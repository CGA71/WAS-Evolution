---
# The AWX instance.
#
# Single-node k3s, so everything is one replica and the database is the
# operator-managed PostgreSQL on the local-path StorageClass. That is a
# deliberate choice for a forge, not a production AWX: there is no HA here, and
# a node loss means a restore from backup.
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
spec:
  # Traefik ships with k3s, so the UI is exposed through it rather than a
  # NodePort. The host must resolve to the node for this to be reachable.
  ingress_type: ingress
  ingress_class_name: traefik
  hostname: awx.lab.example.com

  # Sized for a forge that drives WAS and OpenShift, not for a large estate.
  # The web and task pods each stay well inside the node budget.
  replicas: 1

  web_resource_requirements:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  task_resource_requirements:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  ee_resource_requirements:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 2Gi }

  postgres_storage_requirements:
    requests: { storage: 20Gi }
  postgres_storage_class: local-path

  # Projects are synced from GitLab, so a persistent projects volume is not
  # needed; the task pod re-clones on sync.
  projects_persistence: false

  # The admin password is generated by the operator into a Secret rather than
  # declared here. Reading it is a deliberate act:
  #   kubectl -n awx get secret awx-admin-password -o jsonpath={.data.password} | base64 -d
  # Nothing in this repository ever carries it.
