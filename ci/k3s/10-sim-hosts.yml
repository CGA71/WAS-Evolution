        - { name: binaries, mountPath: /mnt/binaries }
  volumes:
    - { name: app, emptyDir: {} }
    - { name: exploit, emptyDir: {} }
    - { name: binaries, emptyDir: {} }
---
apiVersion: v1
kind: Pod
metadata:
