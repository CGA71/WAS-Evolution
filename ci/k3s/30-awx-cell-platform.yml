---
# What the AWX cell workflow may do on the cluster, and nothing more.
#
# Job 1 of "WAS cell - deployment manager and two federated nodes" creates the
# cell's virtual machines through the Kubernetes API; job 2 reads the install
# lab VM's address; the console job publishes two Services. They authenticate
# with the token of this ServiceAccount, which AWX holds as a "Kubernetes API
# Bearer Token" credential - created by ci/awx/apply-cell-workflow.sh, never
# typed into a template.
#
# Cluster-wide because the job creates the cell's namespace. The verbs stop at
# create, read and patch: nothing here can delete a machine or a disk.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: awx-cell-platform
  namespace: awx
---
# A long-lived token for the AWX credential. Kubernetes fills it in.
apiVersion: v1
kind: Secret
metadata:
  name: awx-cell-platform-token
  namespace: awx
  annotations:
    kubernetes.io/service-account.name: awx-cell-platform
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: awx-cell-platform
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch]
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [get, list, create, patch, update]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [get, list, create, patch, update]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get, list]
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: awx-cell-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: awx-cell-platform
subjects:
  - kind: ServiceAccount
    name: awx-cell-platform
    namespace: awx
