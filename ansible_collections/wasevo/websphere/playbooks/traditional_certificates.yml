---
# The certificate inventory of a cell, and nothing else. Read only.
#
#   ansible-playbook -i inventories/lab <this> \
#       -e was_environment=<code> -e config_dmgr_hosts=dmgr
#
#   ansible-playbook -i inventories/was <this> -e was_environment=RA
#
# ONE ROLE, ONE PLAYBOOK, ONE JOB TEMPLATE. In AWX, "Certificates - inventory",
# scheduled daily and launched by the certificate portal's refresh button. Its
# job artifacts are what the portal shows.

- name: The target this run acts on, refused early if it is missing
  ansible.builtin.import_playbook: guard_target.yml

- name: The certificates of the cell, on the deployment manager
  hosts: >-
    {{ config_dmgr_hosts
       | default((was_environment | default('no-environment-supplied')) | lower
                 ~ ':&' ~ (was_dmgr_group | default('dmgr'))) }}
  gather_facts: true

  tasks:
    - name: The certificate inventory
      ansible.builtin.include_role:
        name: wasevo.websphere.traditional.certificates
