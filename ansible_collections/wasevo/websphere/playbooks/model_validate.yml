---
# The first gate. Validates the model without touching anything.
#
#   AWX  : the survey question "Give an environment"
#   shell: ansible-playbook -i inventories/was \
#            ansible_collections/wasevo/websphere/playbooks/model_validate.yml \
#            -e was_environment=RA
#
# Two plays on purpose.
#
# The environment has to be validated BEFORE a host pattern is built from it.
# This playbook used to be one play targeting "{{ was_environment | lower }}",
# so an unknown environment produced an empty pattern, matched no hosts, and
# the run SUCCEEDED having validated nothing. A bad answer has to fail, not
# evaporate.

- name: Resolve and validate the environment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # Needs no host and no group_vars: the derivations live in the role.
    - name: Validate the environment and the channel
      ansible.builtin.include_role:
        name: wasevo.websphere.model
        tasks_from: environment.yml

    - name: The inventory must contain hosts for this environment
      ansible.builtin.assert:
        that:
          - was_env_lower in groups
          - groups[was_env_lower] | default([]) | length > 0
        fail_msg: >-
          {{ was_environment }} resolves to {{ was_env_code }}, which is a
          usable code, but this inventory has no group "{{ was_env_lower }}"
          with hosts in it. Groups present:
          {{ groups.keys() | reject('in', ['all', 'ungrouped']) | list | join(', ') }}.
          Either the wrong inventory is selected, or the hosts for this
          environment have not been declared.
        # Indexed through a guard, not directly. ansible-core finalises BOTH
        # messages before it evaluates the assertion, so groups[was_env_lower]
        # on an inventory without that group raises "object of type 'dict' has
        # no attribute '<code>'" and the fail_msg written just above - the one
        # that explains the problem - is never shown.
        success_msg: >-
          {{ was_env_code }}: {{ _hosts | length }} host(s) -
          {{ _hosts | join(', ') }}
      vars:
        _hosts: "{{ groups[was_env_lower] if was_env_lower in groups else [] }}"
      when: model_require_hosts | default(true)

# The rest of the model - runtime, the product x JDK matrix, the JVM intents,
# the artefact versions - lives in the environment's group_vars, so it can only
# be validated from a host that belongs to that group.
- name: Validate the model for the chosen environment
  hosts: "{{ was_environment | lower }}"
  gather_facts: false
  connection: local
  run_once: true

  tasks:
    - name: Validate
      ansible.builtin.include_role:
        name: wasevo.websphere.model
