---
# The first gate. Validates the model against the environment catalogue, the
# product x JDK matrix and the JVM intent table, without touching anything.
#
#   ansible-playbook -i inventories/was \
#       ansible_collections/wasevo/websphere/playbooks/model_validate.yml \
#       -e was_environment=RA
#
# Run this in CI for every environment: an invalid combination is rejected
# here rather than discovered halfway through a deployment.
#
# It runs on localhost but reads the inventory, so the environment group vars
# are the ones that will actually apply at run time.

- name: Validate the model for one environment
  hosts: "{{ was_environment | default('rit') | lower }}"
  gather_facts: false
  # One host is enough: the model is per environment, not per host.
  run_once: true
  connection: local

  tasks:
    - name: Validate
      ansible.builtin.include_role:
        name: wasevo.websphere.model
