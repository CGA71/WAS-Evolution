---
# JMS resources, and nothing else.
#
#   ansible-playbook -i inventories/lab <this> \
#       -e was_environment=<code> -e was_topology=nd -e config_dmgr_hosts=dmgr
#
#   ansible-playbook -i inventories/was <this> -e was_environment=RA
#
# ONE ROLE, ONE PLAYBOOK, ONE JOB TEMPLATE. A queue added or an activation
# spec's concurrency raised is one replay of this.
#
# After the bus job, because a default messaging resource names a bus and a
# bus destination; after the J2C job, because a connection factory or an
# activation spec may present an alias.

- name: The target this run acts on, refused early if it is missing
  ansible.builtin.import_playbook: guard_target.yml

- name: JMS resources, on the deployment manager
  hosts: >-
    {{ config_dmgr_hosts
       | default((was_environment | default('no-environment-supplied')) | lower
                 ~ ':&' ~ (was_dmgr_group | default('dmgr'))) }}
  gather_facts: true

  tasks:
    - name: The JMS resources
      ansible.builtin.include_role:
        name: wasevo.websphere.traditional.jms
