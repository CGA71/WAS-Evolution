---
# Traditional plane configuration, for ONE environment chosen at launch.
#
#   AWX  : the Survey question "Target environment" sets was_environment
#   shell: ansible-playbook -i inventories/was <this> -e was_environment=RA
#
# WHAT THIS FILE IS. The whole-plane entry point: it runs the configuration
# steps in the order a cell needs them. It defines none of them. Each step is
# its own playbook, driving its own role, launchable on its own as its own AWX
# job template - because replaying one step after a change has to cost one
# wsadmin session, not the entire chain.
#
#   traditional_cluster.yml          the cluster object                  family 0
#   traditional_cluster_members.yml  the application servers in it       family 0
#   traditional_ssl.yml              SSL configurations and signers      family 5
#   traditional_security.yml         global security, the user registry  family 5
#   traditional_j2c.yml              the J2C authentication aliases      family 5
#   traditional_jdbc.yml             the JDBC providers and datasources  family 2
#   traditional_shared_libraries.yml the shared libraries                family 5
#   traditional_sibus.yml            the service integration buses       family 4
#   traditional_jms.yml              the JMS resources                   family 4
#   traditional_transactions.yml     the transaction service             family 3
#   traditional_ejb_container.yml    the EJB container and timers        family 3
#   traditional_cdi.yml              CDI                                 family 3
#   traditional_policy_sets.yml      web services policy sets            family 1
#   traditional_jpa.yml              the JPA level and defaults          family 2
#   traditional_dynamic_cache.yml    the dynamic cache                   family 5
#   traditional_logging.yml          logging, trace and HPEL             family 5
#   traditional_pmi.yml              PMI                                 family 6
#
# DEPENDENCY ORDER, NOT FAMILY ORDER. The roles are catalogued under API
# families - family_<n>_<name>.yml imports one family's playbooks, README
# section 19 - but a datasource (family 2) presents a J2C alias (family 5),
# and the EJB timers and JPA defaults name datasources, so this chain runs the
# steps in the order they need each other, whatever their family. The server
# settings come last: they apply at server start, and one restart then takes
# them all.
#
# So there is exactly one definition of each step, and this file cannot drift
# from the step it used to carry inline - which is what happened to the legacy
# launch_*.sh scripts, each with its own copy of the same cell build.
#
# Every imported playbook takes the same launch inputs as this one, resolves
# the model itself and stages the Jython driver itself. Running this is the
# same work as running them in order, and running one of them is a supported
# way to fix one thing.
#
# THE HOST PATTERN IS A LAUNCH INPUT. Each step defaults to the intersection of
# an environment group and the deployment manager group, so the environment is
# an answer rather than a directory. An inventory with no environment group -
# the lab, deliberately, because the same VM is built as any environment -
# passes -e config_dmgr_hosts=dmgr.
#
# Always run with --check --diff first. The whole point of the module approach
# is that the dry run tells the truth, which the legacy marker-file approach
# could not.

- name: The cluster
  import_playbook: traditional_cluster.yml

- name: The application servers in it
  import_playbook: traditional_cluster_members.yml

- name: SSL configurations and signer certificates
  import_playbook: traditional_ssl.yml

- name: Global security and the active user registry
  import_playbook: traditional_security.yml

- name: The J2C authentication aliases
  import_playbook: traditional_j2c.yml

- name: The JDBC providers and datasources
  import_playbook: traditional_jdbc.yml

- name: The shared libraries
  import_playbook: traditional_shared_libraries.yml

- name: The service integration buses
  import_playbook: traditional_sibus.yml

- name: The JMS resources
  import_playbook: traditional_jms.yml

- name: Web services policy sets
  import_playbook: traditional_policy_sets.yml

- name: The transaction service of every server, and peer recovery
  import_playbook: traditional_transactions.yml

- name: The EJB container, its cache and its timer service
  import_playbook: traditional_ejb_container.yml

- name: CDI
  import_playbook: traditional_cdi.yml

- name: The JPA level and defaults
  import_playbook: traditional_jpa.yml

- name: The dynamic cache service and servlet caching of every server
  import_playbook: traditional_dynamic_cache.yml

- name: The log and trace mode of every server
  import_playbook: traditional_logging.yml

- name: The Performance Monitoring Infrastructure of every server
  import_playbook: traditional_pmi.yml
