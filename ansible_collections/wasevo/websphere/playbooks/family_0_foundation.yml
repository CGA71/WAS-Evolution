---
# Family 0 - the cell foundation.
#
#   ansible-playbook -i inventories/was <this> -e was_environment=RA
#
# A FAMILY IS A CATALOGUE, NOT A ROLE. It imports the playbooks of its roles,
# in the order they need each other, and defines none of them: each role keeps
# its own playbook and its own AWX job template, and replaying one role after
# a change is still one wsadmin session. Running this is the same work as
# running its playbooks in order.
#
# Not one of the API families: what every one of them stands on. The profiles
# are built by the lab and install chain, before this; the cluster and its
# members are the scope every resource below defaults to.
#
# The whole plane, every family in dependency order, is traditional_config.yml.

- name: The cluster
  import_playbook: traditional_cluster.yml

- name: The application servers in it
  import_playbook: traditional_cluster_members.yml
