---
# Stop one batch of application server JVMs on every node - the JVMs whose
# maximum heap falls in the batch's size range (jvm_batches, inventory
# group_vars/all/45_jvm_batches.yml).
#
#   ansible-playbook -i inventories/aix <this> -e jvm_batch=1024
#   ansible-playbook -i inventories/aix <this> -e jvm_batch=ALL
#
# stopServer.sh for each JVM of the batch, all at once; a JVM still alive
# after jvm_stop_timeout is killed (SIGTERM, then SIGKILL after
# jvm_kill_grace).
# Everything as the WAS account, through "sudo su - was", the module files in
# /tmp - the collection's escalation, so it holds with any inventory
# (playbooks/group_vars/all.yml).
#
# ONE PLAYBOOK, ONE JOB TEMPLATE, a batch per launch: the AWX workflow
# "WAS AIX - Fix pack WAS by JVM batch" runs it once per batch, and any batch can
# be relaunched alone from its job template.

- name: Stop a batch of JVMs
  hosts: "{{ jvm_hosts | default('nodeagents') }}"
  gather_facts: false

  roles:
    - role: wasevo.websphere.traditional.jvm_batch
      vars:
        jvm_batch_action: stop
