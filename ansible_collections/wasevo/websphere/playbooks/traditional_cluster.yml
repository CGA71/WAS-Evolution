---
# The cluster object, and nothing else.
#
#   ansible-playbook -i inventories/lab <this> \
#       -e was_environment=<code> -e was_topology=nd -e config_dmgr_hosts=dmgr
#
#   ansible-playbook -i inventories/was <this> -e was_environment=RA
#
# ONE ROLE, ONE PLAYBOOK, ONE JOB TEMPLATE. This playbook exists so the cluster
# can be declared - or corrected - on its own, without replaying the install,
# the profiles or the members. That is one wsadmin session instead of the whole
# chain, which is what makes a fix after a change cheap enough to actually do.
#
# It is also why it trusts no earlier node: the model is resolved here, the
# Jython driver is staged here, and a missing deployment manager profile is
# named as such rather than surfacing as a wsadmin error.
#
# THE HOST PATTERN IS OVERRIDABLE. By default it is the intersection of an
# environment group and the deployment manager group, so the environment is a
# launch input rather than a directory. The lab has no environment group on
# purpose - the same VM is built as any environment - so it passes
# config_dmgr_hosts=dmgr instead, exactly as lab_create_profiles.yml does for
# the profile roles.
#
# Always worth a --check --diff first: the dry run reads the cell and reports
# the real gap, which the legacy marker-file approach could not.

# WHY THE REFUSAL IS A PLAY AND NOT A FILTER. The pattern below used to end in
# `was_environment | mandatory`, which cannot be rendered without that variable
# - so the playbook could not be syntax-checked or linted without being
# launched, and the failure read "Mandatory variable not defined", a message
# about a filter rather than about a missing answer.
#
# Now the pattern falls back to a name no inventory can hold, so it always
# renders; and because a pattern that matches nothing makes a run SUCCEED
# having done nothing - the one outcome this repository refuses - the refusal
# lives here, where it can say what is missing and how to supply it.
- name: An environment must be supplied before a host pattern is built from it
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Refuse a run with neither an environment nor an explicit host pattern
      ansible.builtin.assert:
        that:
          - (was_environment | default('') | trim | length > 0)
            or (config_dmgr_hosts | default('') | trim | length > 0)
        fail_msg: >-
          No environment was supplied. It decides which hosts this run targets,
          because the host pattern is the intersection of an environment group
          and the deployment manager group - the environment is an answer, not
          a directory. In AWX, answer the survey question for the target
          environment; on the command line, pass -e was_environment=<code>.
          An inventory with no environment group - the lab - is run with
          -e config_dmgr_hosts=dmgr instead.
        success_msg: "a target was supplied"

    # Checked HERE, on localhost, and not in the play that uses the pattern.
    # If the group does not exist that play matches no host at all, so an
    # assertion inside it would never run and the job would end green having
    # built nothing. Only the default pattern needs the group: an inventory
    # with no environment group - the lab - supplies config_dmgr_hosts.
    - name: The chosen environment must exist in the inventory
      ansible.builtin.assert:
        that:
          - (was_environment | lower) in groups
        fail_msg: >-
          No inventory group named {{ was_environment | lower }}. Known
          environments: {{ groups.keys() | reject('in', ['all', 'ungrouped',
          'dmgr', 'nodeagents', 'ihs', 'was_lab']) | list | join(', ') }}.
          An inventory with no environment group - the lab - is run with
          -e config_dmgr_hosts=dmgr instead.
        success_msg: "the environment group exists"
      when: config_dmgr_hosts is not defined

- name: Declare the cluster
  hosts: >-
    {{ config_dmgr_hosts
       | default((was_environment | default('no-environment-supplied')) | lower
                 ~ ':&' ~ (was_dmgr_group | default('dmgr'))) }}
  gather_facts: true

  tasks:

    - name: Resolve the model and the names
      ansible.builtin.include_role:
        name: wasevo.websphere.model

    - name: Resolve and validate the topology
      ansible.builtin.include_role:
        name: wasevo.websphere.model
        tasks_from: topology.yml

    - name: A standalone topology has no cluster
      ansible.builtin.debug:
        msg: >-
          was_topology is "{{ was_topology }}": a standalone server is its own
          administrative domain and holds no cluster. Nothing to do.
      when: not (was_can_cluster | bool)

    - name: Declare the cluster
      when: was_can_cluster | bool
      block:

        - name: Stage the Jython driver on the deployment manager
          ansible.builtin.include_role:
            name: wasevo.websphere.traditional.config

        - name: The deployment manager profile must exist on this host
          ansible.builtin.stat:
            path: "{{ was_profile_path }}/bin/wsadmin.sh"
          register: cluster_wsadmin
          check_mode: false

        # This refusal holds in a check run too, unlike the profile roles'.
        # Theirs describe a future - the product is not installed YET - and
        # stand down. This one does not: the dry run reads the live cell to
        # report the real gap, and there is nothing to read it with. A check
        # run that silently reported "no change" against a cell it never
        # reached would be the one lie this collection exists to avoid.
        - name: Refuse clearly when it does not
          ansible.builtin.fail:
            msg: >-
              No wsadmin at {{ was_profile_path }}/bin/wsadmin.sh on
              {{ inventory_hostname }}. The cluster lives in the master
              configuration repository, which is the deployment manager
              profile - created by the profile job. This playbook can be
              launched on its own, so it names what is missing instead of
              dying inside a shell call. A check run needs it too: reading the
              cell is how a dry run tells the truth.
          when: not (cluster_wsadmin.stat.exists | default(false))

        # Asked for by name, before the module reads them. Without this the
        # failure is "'was_admin_password' is undefined" pointing at a line of
        # YAML, which says nothing about where the value comes from. wsadmin
        # needs the administrator of the CELL, not a local account, and it
        # comes from a credential - in AWX from the "WAS administrative user"
        # credential type, on the command line from a vault or -e.
        - name: Administrative credentials must be supplied to reach the cell
          ansible.builtin.assert:
            that:
              - was_admin_user | default('') | length > 0
              - was_admin_password | default('') | length > 0
            fail_msg: >-
              Reaching a cell with administrative security enabled needs
              was_admin_user and was_admin_password - the deployment manager's
              administrator, not a local account. Supply them from an AWX
              credential or a vault.
            success_msg: "administrative credentials supplied"

        - name: The cluster
          wasevo.websphere.was_cluster:
            name: "{{ was_cluster_name }}"
            cell_name: "{{ was_cell_name }}"
            prefer_local: "{{ was_cluster_prefer_local | default('true') }}"
            state: "{{ was_cluster_state | default('present') }}"
            profile_path: "{{ was_profile_path }}"
            admin_user: "{{ was_admin_user }}"
            admin_password: "{{ was_admin_password }}"
            jython_dir: "{{ was_jython_dir }}"
          register: cluster_result

        - name: Report
          ansible.builtin.debug:
            msg:
              - "environment : {{ was_environment }} ({{ was_env_long_name }})"
              - "cell        : {{ was_cell_name }}"
              - "cluster     : {{ was_cluster_name }}"
              - "changed     : {{ cluster_result.changed }}"
              - "members     : {{ (cluster_result.cluster.members | default([])) | length }}
                                 -- created by traditional_cluster_members.yml,
                                 which is a separate job for the same reason
                                 this one is"
