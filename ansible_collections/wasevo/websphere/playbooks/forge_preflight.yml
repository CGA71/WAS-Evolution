---
# The first node of every workflow. Verifies every declared forge dependency
# before anything is installed.
#
#   AWX  : the Survey sets was_environment
#   shell: ansible-playbook -i inventories/was <this> -e was_environment=RA
#
# Control side only, when no target is reachable (CI, or a laptop):
#   ... -e forge_preflight_control_only=true

- name: Verify the forge dependencies
  hosts: >-
    {{ forge_preflight_hosts if forge_preflight_hosts is defined
       else (was_environment | mandatory | lower) }}
  gather_facts: false

  tasks:
    - name: Preflight
      ansible.builtin.include_role:
        name: wasevo.websphere.forge_preflight
