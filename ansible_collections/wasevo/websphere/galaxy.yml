---
namespace: wasevo
name: websphere
version: 0.1.0
readme: README.md
authors:
  - neo
description: >-
  Ansible automation for IBM WebSphere Application Server ND (traditional) and
  WebSphere Liberty, covering the three-phase trajectory to OpenShift.
license:
  - Apache-2.0
# The first two are from Galaxy's required list - a collection has to carry at
# least one of them, and these are the two that describe it: middleware
# infrastructure, and the applications it deploys. The rest are what someone
# would actually search for.
tags:
  - infrastructure
  - application
  - websphere
  - was
  - liberty
  - openshift
  - ibm
  - middleware
# No kubernetes.core / community.okd for now: Kubernetes is set aside, and the
# Liberty / OpenShift roles that use them are not run. See
# collections/requirements.yml.
dependencies:
  ansible.posix: ">=1.5.4"
  community.general: ">=8.0.0"
repository: https://github.com/CGA71/WAS-Evolution
build_ignore:
  - .git
  - "*.tar.gz"
