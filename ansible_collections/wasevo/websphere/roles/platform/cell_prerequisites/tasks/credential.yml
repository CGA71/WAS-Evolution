---
# One credential, found by name: patched if it exists, created otherwise.

- name: "Find {{ _prereq_cred.name }}"
  ansible.builtin.uri:
    url: "{{ prereq_awx_api }}/credentials/?name={{ _prereq_cred.name | urlencode }}"
    url_username: admin
    url_password: "{{ _prereq_awx_password }}"
    force_basic_auth: true
  register: _prereq_found
  no_log: true

- name: "Create or patch {{ _prereq_cred.name }}"
  ansible.builtin.uri:
    url: "{{ prereq_awx_api }}/credentials/{{ (_prereq_id ~ '/') if _prereq_id | length > 0 else '' }}"
    method: "{{ 'PATCH' if _prereq_id | length > 0 else 'POST' }}"
    url_username: admin
    url_password: "{{ _prereq_awx_password }}"
    force_basic_auth: true
    body_format: json
    body: >-
      {{ _prereq_cred | combine({'organization': _prereq_org | int,
                                 'credential_type': _prereq_cred.credential_type | int}) }}
    status_code: [200, 201]
  vars:
    _prereq_id: >-
      {{ _prereq_found.json.results | selectattr('name', 'equalto', _prereq_cred.name)
         | map(attribute='id') | map('string') | first | default('') }}
  register: _prereq_saved
  changed_when: _prereq_saved.status == 201
  no_log: true

- name: "Keep the id of {{ _prereq_cred.name }}"
  ansible.builtin.set_fact:
    _prereq_credential_ids: "{{ _prereq_credential_ids | default({}) | combine({_prereq_cred.name: _prereq_saved.json.id}) }}"
