---
# On the source: the HTTP server stopped as soon as the copy is done. The
# archive stays, so the next cell built from this lab copies without
# re-archiving.

#
# The unit is transient (systemd-run): once stopped it no longer exists, so a
# replay finds nothing to stop - which is not a failure.
- name: Stop serving the media
  ansible.builtin.systemd_service:
    name: "{{ media_unit }}"
    state: stopped
  become: true
  failed_when: false
