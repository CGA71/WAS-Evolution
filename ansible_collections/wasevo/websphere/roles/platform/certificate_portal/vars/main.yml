---
_certportal_host: "{{ certportal_awx_api | urlsplit('hostname') }}"
_certportal_url: >-
  {{ certportal_awx_api | urlsplit('scheme') }}://{{ certportal_awx_api | urlsplit('netloc') }}{{ certportal_path }}/
# What the page reads at load: no secret, nothing a viewer could not see in
# the page itself.
_certportal_config:
  renew_within_days: "{{ certportal_renew_within_days | int }}"
  awx_ui: "/"
_certportal_files:
  index.html: "{{ lookup('ansible.builtin.file', 'site/index.html') }}"
  portal.css: "{{ lookup('ansible.builtin.file', 'site/portal.css') }}"
  portal.js: "{{ lookup('ansible.builtin.file', 'site/portal.js') }}"
  certificates.js: "{{ lookup('ansible.builtin.file', 'site/certificates.js') }}"
  portal.json: "{{ _certportal_config | to_json }}"
