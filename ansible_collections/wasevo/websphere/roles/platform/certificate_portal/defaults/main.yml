---
# The certificate portal: a static page, served on AWX's own host name under
# certportal_path, that reads the certificate inventories from the AWX API and
# launches the renewal template - with the viewer's AWX session.
#
# SAME ORIGIN IS THE DESIGN. On AWX's host the browser sends the viewer's AWX
# session with every API call, so the page needs no token and no server of its
# own, and AWX's rights apply unchanged: an organisation's users see their
# organisation's cells, launch what they may launch, and nothing else. On any
# other host the browser would send nothing, and the page would need a
# credential of its own - which is exactly what this avoids.
#
# AWX IS HOSTED ELSEWHERE. This collection no longer installs it. What it needs
# is the web server that fronts AWX's host name - the reverse proxy (nginx,
# Apache httpd, IBM HTTP Server) in front of it - and a directory that server
# serves at certportal_path. The role copies the page there and renders the
# server's location block next to it; including that block in the server
# configuration is a one-time step for whoever runs that server.

# AWX, as the inventory declares it. The page is served on its host.
certportal_awx_api: "{{ awx_api_url | default(prereq_awx_api | default('')) }}"

certportal_path: /wasevo/certificates

# On the web host: where the page is copied, and who owns it.
certportal_web_root: /var/www/wasevo/certificates
certportal_web_owner: root
certportal_web_group: root

# The location block for the web server, rendered beside the page. nginx or
# httpd (Apache httpd and IBM HTTP Server share the syntax). Empty to skip.
certportal_web_server: nginx
certportal_web_snippet: "{{ certportal_web_root | dirname }}/certificates.{{ certportal_web_server }}.conf"

# Within this many days a certificate is shown as due. Three months, like the
# inventory role's default: the page recomputes the status for today.
certportal_renew_within_days: 90

# Copying into the web root normally needs root.
certportal_become: true
