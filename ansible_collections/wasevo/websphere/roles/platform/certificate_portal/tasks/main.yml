---
# On the k3s node, as its administrator. kubectl reads the node's kubeconfig.

- name: AWX must be declared - the page is served on its host
  ansible.builtin.assert:
    that:
      - certportal_awx_api | length > 0
      - certportal_awx_api | urlsplit('hostname') | default('', true) | length > 0
    fail_msg: >-
      certportal_awx_api is empty or has no host name. It is the AWX API URL,
      from the inventory (prereq_awx_api), and the portal must be served on
      the same host for the browser to send the viewer's AWX session.
    success_msg: "portal at {{ _certportal_url }}"

- name: The page, its server and its route
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ lookup('ansible.builtin.template', 'portal.yml.j2') }}"
  environment:
    KUBECONFIG: "{{ certportal_kubeconfig }}"
  register: _certportal_apply
  changed_when: _certportal_apply.stdout is search('created|configured')

- name: The server is up
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ certportal_namespace }} rollout status
      deployment/{{ certportal_name }} --timeout=180s
  environment:
    KUBECONFIG: "{{ certportal_kubeconfig }}"
  changed_when: false
  when: not ansible_check_mode

- name: The page answers on AWX's host
  ansible.builtin.uri:
    url: "{{ _certportal_url }}portal.json"
    return_content: true
  register: _certportal_answer
  retries: 15
  delay: 4
  until: _certportal_answer.status == 200
  when: not ansible_check_mode

- name: Where it is
  ansible.builtin.debug:
    msg:
      - "portal : {{ _certportal_url }}"
      - "reads  : the job templates whose playbook is traditional_certificates.yml or"
      - "         traditional_certificate_renewal.yml, with the viewer's AWX rights"
