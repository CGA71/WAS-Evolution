---
# The EJB container, its cache and its timer service.
#
# The intent is translated by plugins/filter/traditional.py and applied by
# traditional.config's server_settings.yml - one wsadmin session, every server
# of the target, read from the cell.
#
# REPLAYABLE ON ITS OWN. Resolves the model, stages the driver, checks its own
# preconditions, and names the job that produces what is missing.

- name: Resolve the model and the names
  ansible.builtin.include_role:
    name: wasevo.websphere.model
  tags: [ejb_container, always]

- name: Resolve and validate the topology
  ansible.builtin.include_role:
    name: wasevo.websphere.model
    tasks_from: topology.yml
  tags: [ejb_container, always]

- name: Nothing declared, nothing to do
  ansible.builtin.debug:
    msg: >-
      ejb_container declares nothing for this run - see
      roles/traditional/ejb_container/defaults/main.yml for the shape.
  when: ejb_container | default({}) | length == 0
  tags: [ejb_container]

- name: Apply ejb_container
  when: ejb_container | default({}) | length > 0
  tags: [ejb_container]
  block:

    - name: Translate the declaration into WAS settings
      ansible.builtin.set_fact:
        ejb_container_render: "{{ ejb_container | wasevo.websphere.ejb_container_settings }}"

    - name: Apply them to every server of the target
      ansible.builtin.include_role:
        name: wasevo.websphere.traditional.config
        tasks_from: server_settings.yml
      vars:
        settings_label: ejb_container
        settings_render: "{{ ejb_container_render }}"
        settings_target: "{{ ejb_container_target }}"
