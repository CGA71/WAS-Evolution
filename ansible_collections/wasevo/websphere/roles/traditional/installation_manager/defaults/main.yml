---
# Where the IBM media is staged on the target. Nothing downloads it: see the
# failure message in tasks/main.yml for why.
im_media_dir: "{{ was_install_binaries_base_dir }}/IBM/install_im"
im_media_pattern: "*.zip"

# WAS 9.0 fix packs require Installation Manager 1.8.5 or later. 1.9.2 is the
# level the source inventory declared.
im_required_version: "1.9.2"

im_unpack_dir: /tmp/im-installer
