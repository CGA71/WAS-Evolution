---
# WebSphere variables, one wsadmin session per scope.
#
# Inputs: _variables (the declarations), _variables_state (present | absent).
# A variable takes `scope:` to leave the application's - where it runs.

- name: Group the variables by scope
  ansible.builtin.set_fact:
    _variable_groups: >-
      {%- set groups = {} -%}
      {%- for v in _variables -%}
      {%-   set scope = v.scope | default(application_scope) -%}
      {%-   set key = scope | to_json -%}
      {%-   set _ = groups.update({key: {'scope': scope, 'variables': (groups[key].variables if key in groups else [])
                                        + [{'name': v.name, 'value': v.value | default('') | string,
                                            'description': v.description | default('')}]}}) -%}
      {%- endfor -%}{{ groups.values() | list }}

- name: The variables of each scope
  wasevo.websphere.was_variable:
    scope: "{{ item.scope }}"
    variables: "{{ item.variables }}"
    state: "{{ _variables_state }}"
    profile_path: "{{ was_profile_path }}"
    admin_user: "{{ was_admin_user }}"
    admin_password: "{{ was_admin_password }}"
    jython_dir: "{{ was_jython_dir }}"
  loop: "{{ _variable_groups }}"
  loop_control:
    label: >-
      {{ item.scope.type }} {{ item.scope[item.scope.type] | default('') }}:
      {{ item.variables | map(attribute='name') | join(', ') }}
