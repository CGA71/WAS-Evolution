- name: Only the mount point is implemented today
  ansible.builtin.assert:
    that:
      - application_source == 'mount'
    fail_msg: >-
      application_source is {{ application_source }}. The artifact repository
      is prepared in roles/traditional/application/tasks/archive.yml, commented;
      uncomment it there to use it.
    success_msg: "archives from the mount point"
