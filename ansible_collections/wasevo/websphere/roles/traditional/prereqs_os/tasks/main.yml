---
# OS prerequisites, before anything IBM is installed.
#
# This runs first in job 1 on purpose. The legacy repository had the opposite
# order: it installed psmisc, which manageprofiles needs for killall, as the
# very last task of the install playbook - after the profiles that depend on
# it. The lab hit the same class of problem from the other side: a missing
# unzip only surfaced when ansible.builtin.unarchive failed with "Unable to
# find required 'unzip' or 'zipinfo' binary in the path", four tasks and
# 148 MB of file copy into the run.
#
# The package list is declared once, in forge_preflight's defaults, so the role
# that checks and the role that installs cannot drift apart.

- name: Resolve the model and the environment
  ansible.builtin.include_role:
    name: wasevo.websphere.model
  tags: [prereqs, always]

- name: Load the declared dependency set
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../forge_preflight/defaults/main.yml"
  tags: [prereqs, always]

- name: Gather what the package and limit tasks need
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", "distribution"]
  check_mode: false
  tags: [prereqs]

- name: The OS family must be one the forge supports
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in forge_os_packages.keys() | list
    fail_msg: >-
      {{ ansible_facts.os_family }} has no package list declared in
      forge_os_packages. AIX in particular was absent from the legacy
      repository, and its prerequisite list still needs confirming against the
      IBM statement for the WAS level in use.
  tags: [prereqs]

# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------

- name: Install the required packages
  ansible.builtin.package:
    name: "{{ forge_os_packages[ansible_facts.os_family] }}"
    state: present
  become: true
  register: prereqs_packages
  # One retry: a cloud image often races its first repository refresh, and a
  # transient mirror failure should not fail a whole workflow node.
  retries: 2
  delay: 10
  until: prereqs_packages is succeeded
  tags: [prereqs, packages]

- name: Read the package facts back
  ansible.builtin.package_facts:
    manager: auto
  check_mode: false
  tags: [prereqs, packages]

- name: Report any package still missing
  ansible.builtin.assert:
    that:
      - item in ansible_facts.packages
    fail_msg: >-
      {{ item }} is still not installed after the package task reported
      success. That usually means the name is wrong for this distribution -
      python3-libdnf5, for instance, exists on dnf5 systems and not on
      Rocky 9, and one bad name fails the whole transaction.
  loop: "{{ forge_os_packages[ansible_facts.os_family] }}"
  loop_control:
    label: "{{ item }}"
  tags: [prereqs, packages]

# ---------------------------------------------------------------------------
# Limits
# ---------------------------------------------------------------------------

- name: Set the shell limits WAS needs
  # Declared as data rather than as a file, so AIX can be given its own values
  # instead of silently inheriting the Linux ones.
  community.general.pam_limits:
    domain: "{{ item.domain }}"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
    dest: /etc/security/limits.d/90-was.conf
  loop: "{{ forge_limits }}"
  loop_control:
    label: "{{ item.domain }} {{ item.type }} {{ item.item }}={{ item.value }}"
  become: true
  when: ansible_facts.os_family != 'AIX'
  tags: [prereqs, limits]

# ---------------------------------------------------------------------------
# Directory layout
# ---------------------------------------------------------------------------

- name: Create the directory layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ site_was_user }}"
    group: "{{ site_was_group }}"
    mode: "0755"
  loop: "{{ forge_required_dirs }}"
  become: true
  tags: [prereqs, dirs]

- name: Summary
  ansible.builtin.debug:
    msg:
      - "host     : {{ inventory_hostname }} ({{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }})"
      - "packages : {{ forge_os_packages[ansible_facts.os_family] | join(', ') }}"
      - "limits   : {{ forge_limits | length }} entries in /etc/security/limits.d/90-was.conf"
      - "changed  : {{ prereqs_packages.changed | default(false) }}"
  tags: [prereqs]
