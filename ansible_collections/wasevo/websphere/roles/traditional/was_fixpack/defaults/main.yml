---
# ---------------------------------------------------------------------------
# The form's way - tasks/component.yml
# ---------------------------------------------------------------------------
# What to update:
#   was       WAS ND                  in the WAS home(s)
#   sdk       the Java SDK            in the WAS home(s)
#   was-sdk   WAS ND and its SDK      in the WAS home(s), one imcl run each
#   ihs       IBM HTTP Server         in the IHS home
#   plg       the web server plugin   in the plugin home
#   ihs-plg   IHS and the plugin      each in its home
fixpack_component: ""

# The level to reach, per product: the four numbers of the fix pack, of the
# SDK for the SDK. The repository is found from it on the binaries share:
#   <fixpack_repository_base>/FP<version>/WAS      WAS ND
#   <fixpack_repository_base>/FP<version>/IHSPLG   IHS and the plugin
#   <fixpack_repository_base>/FP<any>/SDK/<sdk version>
fixpack_was_version: "9.0.5.28"
fixpack_ihs_version: "9.0.5.28"
fixpack_plg_version: "9.0.5.28"
fixpack_sdk_version: "8.0.8.65"

# Where each product is installed. The WAS home takes several, separated by
# commas: on a server carrying a deployment manager and nodes, each is its
# own installation (AppServerDmgr, AppServerNode1...).
fixpack_was_home: "{{ was_home | default('/usr/IBM/WebSphere9/AppServer') }}"
fixpack_ihs_home: "{{ ihs_home | default('/usr/IBM/IHS9') }}"
fixpack_plg_home: "{{ plugin_home | default('/usr/IBM/Plugins9') }}"

fixpack_repository_base: >-
  {{ imcl_repository_base if imcl_repository_base is defined
     else was_install_binaries_base_dir ~ '/Fixes' }}

# Each product: its Installation Manager offering, the features the site
# installs it with, the repository directory of a level, and how its
# installed version is read from its home.
fixpack_products:
  was:
    label: WAS ND
    offering: com.ibm.websphere.ND.v90
    features: core.feature,ejbdeploy,embeddablecontainer,thinclient
    repository: WAS
  ihs:
    label: IBM HTTP Server
    offering: com.ibm.websphere.IHS.v90
    features: core.feature
    repository: IHSPLG
  plg:
    label: Web server plugin
    offering: com.ibm.websphere.PLG.v90
    features: core.feature
    repository: IHSPLG
  sdk:
    label: Java SDK 8
    offering: com.ibm.java.jdk.v8
    features: com.ibm.sdk.8
    repository: SDK

fixpack_components:
  was: [was]
  sdk: [sdk]
  was-sdk: [was, sdk]
  ihs: [ihs]
  plg: [plg]
  ihs-plg: [ihs, plg]

# ---------------------------------------------------------------------------
# The environment's response files - tasks/response_files.yml
# ---------------------------------------------------------------------------
# The components to update, among the inventory's imcl_component_catalog:
# IHSPLG, WAS, WASDMR. Empty: the form's way above.
imcl_selected_components: []

# The server the job runs on, as config/<env>.yml names it. Empty means the
# host's imcl_server, else its inventory name.
imcl_server: ""
