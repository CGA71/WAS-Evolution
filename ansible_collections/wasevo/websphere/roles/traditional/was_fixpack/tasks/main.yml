---
# Fix packs, two ways in.
#
#   fixpack_component   THE FORM'S WAY - tasks/component.yml. The form says
#   (was, sdk, was-sdk,  which product, to which version, in which home; the
#   ihs, plg, ihs-plg)   role reads the version installed there and, when it
#                        differs, applies the fix pack through a response file
#                        it renders itself. No cell, node or profile name.
#
#   imcl_selected_components   the environment's response files -
#   (WAS, WASDMR, IHSPLG)      tasks/response_files.yml, from config/<env>.yml.
#                              Used by the deployment manager and IHS fix pack
#                              playbooks and by the JVM batch workflow.
#
# Every imcl call runs as was: Installation Manager is was's, and run as root
# it reads another, empty registry ("The registry information does not exist
# or does not match with this executable"). The playbook sets the account.

- name: Fix pack of the component asked in the form
  ansible.builtin.include_tasks: component.yml
  when: imcl_selected_components | default([], true) | length == 0
  tags: [fixpack]

- name: Fix packs from the environment's response files
  when: imcl_selected_components | default([], true) | length > 0
  tags: [fixpack]
  block:

    - name: Resolve the model and the environment
      ansible.builtin.include_role:
        name: wasevo.websphere.model

    - name: Apply the environment's response files
      ansible.builtin.include_tasks: response_files.yml
