---
# Global security and the active user registry, on the deployment manager.
#
# Cell-wide by nature: security.xml belongs to the cell. The intent is
# translated by plugins/filter/traditional.py, checked by traditional.config's
# cell_preflight.yml, and applied by was_security in one wsadmin session.
#
# REPLAYABLE ON ITS OWN. Resolves the model, stages the driver, checks its own
# preconditions, and names what is missing.

- name: Resolve the model and the names
  ansible.builtin.include_role:
    name: wasevo.websphere.model
  tags: [security, always]

- name: Nothing declared, nothing to do
  ansible.builtin.debug:
    msg: >-
      security declares nothing for this run - see
      roles/traditional/security/defaults/main.yml for the shape.
  when: security | default({}) | length == 0
  tags: [security]

- name: Apply security
  when: security | default({}) | length > 0
  tags: [security]
  block:

    - name: Translate the declaration into WAS settings
      ansible.builtin.set_fact:
        security_render: "{{ security | wasevo.websphere.security_settings }}"

    - name: Check it, the credentials and the profile, and stage the driver
      ansible.builtin.include_role:
        name: wasevo.websphere.traditional.config
        tasks_from: cell_preflight.yml
      vars:
        cell_label: security
        cell_render: "{{ security_render }}"

    # Resolved on the controller, from the variable the declaration names -
    # filled in AWX by a credential, on the command line by the shell.
    - name: Resolve the LDAP bind password
      ansible.builtin.set_fact:
        security_bind_password: >-
          {{ lookup('ansible.builtin.env', security_render.settings.bind_password_env)
             if security_render.settings.bind_password_env is defined else '' }}
      no_log: true

    - name: An LDAP bind DN must have its password
      ansible.builtin.assert:
        that:
          - security_bind_password | length > 0
        fail_msg: >-
          security.registry.ldap.bind_password_env names
          {{ security_render.settings.bind_password_env }}, and it is empty.
          In AWX, attach the credential that injects it; on the command line,
          export it. It is never written into a versioned file.
        success_msg: "the bind password is supplied"
      when: security_render.settings.bind_password_env is defined

    - name: The administrator of this run should exist in the new registry
      ansible.builtin.debug:
        msg: >-
          was_admin_user is {{ was_admin_user }}, and the registry's primary
          administrator is {{ security_render.settings.registry.attributes.primaryAdminId }}.
          After the restart, wsadmin authenticates against the new registry:
          was_admin_user must be one of its users.
      when: was_admin_user != security_render.settings.registry.attributes.primaryAdminId

    - name: Configure the registry and make it active
      wasevo.websphere.was_security:
        app_security: "{{ security_render.settings.app_security | default(omit) }}"
        java2_security: "{{ security_render.settings.java2_security | default(omit) }}"
        registry: "{{ security_render.settings.registry }}"
        bind_password: "{{ security_bind_password | default(omit, true) }}"
        password_policy: "{{ security_password_policy }}"
        verify_registry: "{{ security_verify_registry | bool }}"
        profile_path: "{{ was_profile_path }}"
        admin_user: "{{ was_admin_user }}"
        admin_password: "{{ was_admin_password }}"
        jython_dir: "{{ was_jython_dir }}"
      register: security_result

    - name: Report
      ansible.builtin.debug:
        msg:
          - "registry : {{ security_render.settings.registry.type }}, active"
          - "changed  : {{ security_result.changed }}"
          - "restart  : {{ security_result.restart_required | join(', ') | default('nothing', true) }}"
          - "note     : the bind password is not in this output, and never will be"
