---
# Web services policy sets, on the deployment manager.
#
# The intent is translated by plugins/filter/traditional.py, checked by
# traditional.config's cell_preflight.yml, and applied by was_policy_set in
# one wsadmin session.
#
# REPLAYABLE ON ITS OWN. Resolves the model, stages the driver, checks its own
# preconditions, and names what is missing.

- name: Resolve the model and the names
  ansible.builtin.include_role:
    name: wasevo.websphere.model
  tags: [policy_sets, always]

- name: Nothing declared, nothing to do
  ansible.builtin.debug:
    msg: >-
      policy_sets is empty for this run - see
      roles/traditional/policy_sets/defaults/main.yml for the shape.
  when: policy_sets | default([]) | length == 0
  tags: [policy_sets]

- name: Apply policy_sets
  when: policy_sets | default([]) | length > 0
  tags: [policy_sets]
  block:

    - name: Translate the declaration into WAS settings
      ansible.builtin.set_fact:
        policy_sets_render: "{{ policy_sets | wasevo.websphere.policy_set_settings }}"

    - name: Check it, the credentials and the profile, and stage the driver
      ansible.builtin.include_role:
        name: wasevo.websphere.traditional.config
        tasks_from: cell_preflight.yml
      vars:
        cell_label: policy_sets
        cell_render: "{{ policy_sets_render }}"

    - name: Reconcile the policy sets
      wasevo.websphere.was_policy_set:
        policy_sets: "{{ policy_sets_render.settings.policy_sets }}"
        profile_path: "{{ was_profile_path }}"
        admin_user: "{{ was_admin_user }}"
        admin_password: "{{ was_admin_password }}"
        jython_dir: "{{ was_jython_dir }}"
      register: policy_sets_result

    - name: Report
      ansible.builtin.debug:
        msg:
          - "present  : {{ policy_sets_result.policy_sets | map(attribute='name') | join(', ') | default('(none)', true) }}"
          - "changed  : {{ policy_sets_result.changed }}"
