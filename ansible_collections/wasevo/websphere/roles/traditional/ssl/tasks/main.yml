---
# SSL configurations and signers, on the deployment manager.
#
# The intent is translated by plugins/filter/traditional.py, checked by
# traditional.config's cell_preflight.yml, and applied by was_ssl_config in
# one wsadmin session.
#
# REPLAYABLE ON ITS OWN. Resolves the model, stages the driver, checks its own
# preconditions, and names what is missing.

- name: Resolve the model and the names
  ansible.builtin.include_role:
    name: wasevo.websphere.model
  tags: [ssl, always]

- name: Nothing declared, nothing to do
  ansible.builtin.debug:
    msg: >-
      ssl declares nothing for this run - see
      roles/traditional/ssl/defaults/main.yml for the shape.
  when: ssl | default({}) | length == 0
  tags: [ssl]

- name: Apply ssl
  when: ssl | default({}) | length > 0
  tags: [ssl]
  block:

    - name: Translate the declaration into WAS settings
      ansible.builtin.set_fact:
        ssl_render: "{{ ssl | wasevo.websphere.ssl_settings }}"

    - name: Check it, the credentials and the profile, and stage the driver
      ansible.builtin.include_role:
        name: wasevo.websphere.traditional.config
        tasks_from: cell_preflight.yml
      vars:
        cell_label: ssl
        cell_render: "{{ ssl_render }}"

    - name: Reconcile the configurations and the signers
      wasevo.websphere.was_ssl_config:
        configs: "{{ ssl_render.settings.configs }}"
        signers: "{{ ssl_render.settings.signers }}"
        profile_path: "{{ was_profile_path }}"
        admin_user: "{{ was_admin_user }}"
        admin_password: "{{ was_admin_password }}"
        jython_dir: "{{ was_jython_dir }}"
      register: ssl_result

    - name: Report
      ansible.builtin.debug:
        msg:
          - "configs  : {{ ssl_render.settings.configs | map(attribute='alias') | join(', ') | default('(none)', true) }}"
          - "signers  : {{ ssl_render.settings.signers | map(attribute='alias') | join(', ') | default('(none)', true) }}"
          - "changed  : {{ ssl_result.changed }}"
          - >-
            restart  : {{ ssl_result.restart_required | join(', ')
            | default('nothing - new connections use it once the nodes are synchronised', true) }}
