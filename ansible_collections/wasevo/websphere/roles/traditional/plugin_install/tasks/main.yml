---
# The WebSphere web server plugin, through Installation Manager.
#
# Same arrangement as was_install and ihs_install: imcl must be there
# (installation_manager role), what is installed is read from imcl and left
# alone, the offering id is discovered from the repository, and the result is
# verified on every run. A server where the plugin is already installed in
# plugin_home gets changed=0.
#
# Fix packs are applied by the was_fixpack role, which already knows the
# plugin offering: run it after this one. Configuring the plugin
# (plugin-cfg.xml, its module in httpd.conf) is not done here.

- name: Resolve the model and the environment
  ansible.builtin.include_role:
    name: wasevo.websphere.model
  tags: [plugin, always]

- name: Installation Manager must be present
  ansible.builtin.stat:
    path: "{{ im_installer_cmd }}"
  register: plugin_imcl
  check_mode: false
  tags: [plugin]

- name: Refuse clearly when Installation Manager is missing
  ansible.builtin.fail:
    msg: >-
      No imcl at {{ im_installer_cmd }}. The plugin is installed through
      Installation Manager: run lab_install_im.yml first.
  when: not plugin_imcl.stat.exists
  tags: [plugin]

# ---------------------------------------------------------------------------
# Is it already there?
# ---------------------------------------------------------------------------

- name: List the installed packages
  ansible.builtin.command:
    cmd: "{{ im_installer_cmd }} listInstalledPackages -long"
  register: plugin_installed
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  tags: [plugin]

# listInstalledPackages -long prints
#   <installation directory> : <package id>_<build> : <display name> : <version>
# The plugin counts as installed when a line names BOTH plugin_home and the
# plugin offering - a plugin installed somewhere else is not this one.
- name: Is the plugin installed in its directory
  ansible.builtin.set_fact:
    plugin_found: "{{ _hit | first | default('') | trim }}"
    plugin_needs_install: "{{ _hit | length == 0 }}"
  vars:
    _hit: >-
      {{ plugin_installed.stdout_lines | default([])
         | select('search', (plugin_home | regex_replace('/+$', '') | regex_escape) ~ '/? +:')
         | select('search', plugin_package_filter | regex_escape) | list }}
  tags: [plugin]

- name: Report what was found
  ansible.builtin.debug:
    msg: >-
      Web server plugin in {{ plugin_home }}:
      {{ ('installed - ' ~ plugin_found ~ ' - nothing to do') if not plugin_needs_install else 'not installed - install required' }}
  tags: [plugin]

# ---------------------------------------------------------------------------
# Install
# ---------------------------------------------------------------------------

- name: Install
  when: plugin_needs_install | bool
  tags: [plugin]
  block:

    - name: Look for the repository descriptors
      ansible.builtin.find:
        paths: "{{ item }}"
        patterns: "repository.config"
        recurse: true
        depth: 4
        file_type: file
      loop: "{{ [plugin_media_dir, plugin_sdk_media_dir | default('')] | select | unique | list }}"
      register: plugin_repo_files
      check_mode: false

    - name: Refuse clearly when the supplements repository is missing
      ansible.builtin.fail:
        msg: |
          No Installation Manager repository under {{ plugin_media_dir }} on
          {{ inventory_hostname }} - no repository.config was found.

          The web server plugin is in the "WebSphere Application Server V9.0
          Supplements" download (Passport Advantage or Fix Central, with an
          IBMid). Unzip every part into one directory and place it here:

              {{ plugin_media_dir }}/
      when: (plugin_repo_files.results | first).matched == 0

    # The shallowest descriptor of each directory is its repository root -
    # counted in path separators, as in was_install.
    - name: Settle the repositories
      ansible.builtin.set_fact:
        plugin_repositories: >-
          {%- set out = [] -%}
          {%- for r in plugin_repo_files.results -%}
          {%-   set paths = r.files | default([]) | map(attribute='path') | list -%}
          {%-   if paths | length > 0 -%}
          {%-     set depths = paths | map('regex_findall', '/') | map('length') | list -%}
          {%-     set _ = out.append((depths | zip(paths) | sort | first | last) | dirname) -%}
          {%-   endif -%}
          {%- endfor -%}{{ out | unique | list }}

    - name: Ask the repositories what they contain
      ansible.builtin.command:
        cmd: >-
          {{ im_installer_cmd }} listAvailablePackages
          -repositories {{ plugin_repositories | join(',') }}
          -long
      register: plugin_available
      changed_when: false
      check_mode: false
      become: true

    # <repository> : <package id> : <display name> : <version> - the id is the
    # second field, never the start of the line.
    - name: Pick the plugin offering and the SDK
      ansible.builtin.set_fact:
        plugin_offering: >-
          {{ plugin_package_id if (plugin_package_id | length > 0)
             else (_candidates | last | default('')) }}
        plugin_offering_stems: "{{ _candidates | map('regex_replace', '_.*$', '') | unique | list }}"
        plugin_sdk_offering: >-
          {{ _advertised | select('search', '^' ~ (plugin_sdk_package_filter | regex_escape))
             | list | last | default('', true) }}
      vars:
        _advertised: >-
          {{ plugin_available.stdout_lines | map('trim') | select('search', ' : ')
             | map('regex_search', '^[^:]+ : ([^ :]+)', '\1')
             | flatten | select('string') | list | unique | sort }}
        _candidates: >-
          {{ _advertised | select('search', '^' ~ (plugin_package_filter | regex_escape)) | list }}

    - name: Refuse when the plugin is not advertised
      ansible.builtin.fail:
        msg: >-
          The repositories {{ plugin_repositories | join(', ') }} advertise no
          package starting with {{ plugin_package_filter }}. What they
          advertise: {{ plugin_available.stdout_lines | join(' | ') }}
      when: plugin_offering | length == 0

    - name: Refuse when the choice is ambiguous rather than guessing
      ansible.builtin.fail:
        msg: >-
          The repositories carry {{ plugin_offering_stems | join(', ') }}. Set
          plugin_package_id to the one wanted.
      when:
        - plugin_package_id | length == 0
        - plugin_offering_stems | length > 1

    - name: Refuse when no Java SDK is advertised
      ansible.builtin.fail:
        msg: >-
          The 9.0 plugin is installed together with an IBM Java 8 SDK, and
          none of {{ plugin_repositories | join(', ') }} advertises a package
          starting with {{ plugin_sdk_package_filter }}. Point
          plugin_sdk_media_dir at the repository that carries it - the WAS 9.0
          repository normally does.
      when: plugin_sdk_offering | length == 0

    - name: Report the plan
      ansible.builtin.debug:
        msg:
          - "repositories : {{ plugin_repositories | join(', ') }}"
          - "offering     : {{ plugin_offering }}"
          - "sdk          : {{ plugin_sdk_offering }}"
          - "into         : {{ plugin_home }}"

    - name: Create the target directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ site_was_user }}"
        group: "{{ site_was_group }}"
        mode: "0755"
      # im_install_log_dir may be empty: imcl then logs where it always does.
      loop: "{{ [plugin_home, im_install_log_dir | default('')] | select | list }}"
      become: true

    - name: Remove lost+found from the installation directory
      # Often its own filesystem, and imcl refuses a non-empty target.
      ansible.builtin.file:
        path: "{{ plugin_home }}/lost+found"
        state: absent
      become: true

    - name: Install the plugin through Installation Manager
      ansible.builtin.command:
        cmd: >-
          {{ im_installer_cmd }} install
          {{ plugin_offering }} {{ plugin_sdk_offering }}
          -repositories {{ plugin_repositories | join(',') }}
          -installationDirectory {{ plugin_home }}
          {{ ('-sharedResourcesDirectory ' ~ im_shared_resources_dir) if (im_shared_resources_dir | default('') | length > 0) else '' }}
          {{ ('-dataLocation ' ~ im_agent_data_dir) if (im_agent_data_dir | default('') | length > 0) else '' }}
          {{ ('-preferences ' ~ im_preferences_dir) if (im_preferences_dir | default('') | length > 0) else '' }}
          {{ ('-log ' ~ im_install_log_dir ~ '/install_plugin.log') if (im_install_log_dir | default('') | length > 0) else '' }}
          -acceptLicense
          -nl {{ im_install_locale }}
      become: true
      async: 3600
      poll: 15
      register: plugin_install_run

    - name: Show the tail of the installer output
      ansible.builtin.debug:
        msg: "{{ (plugin_install_run.stdout_lines | default([]))[-20:] }}"

# ---------------------------------------------------------------------------
# Verify on every run
# ---------------------------------------------------------------------------

- name: Verify
  # A check run installs nothing: a plugin that was missing is still missing,
  # which is the expected outcome of a dry run, not a failure.
  when: not (plugin_needs_install | bool and ansible_check_mode)
  tags: [plugin, verify]
  block:

    - name: List the installed packages again
      ansible.builtin.command:
        cmd: "{{ im_installer_cmd }} listInstalledPackages -long"
      register: plugin_verify
      changed_when: false
      check_mode: false
      become: true

    - name: The plugin must be installed in its directory
      ansible.builtin.assert:
        that:
          - _hit | length > 0
        fail_msg: >-
          Installation Manager does not report {{ plugin_package_filter }}* in
          {{ plugin_home }}. What it reports:
          {{ plugin_verify.stdout_lines | default([]) | join(' | ') }}.
          See {{ (im_install_log_dir ~ '/install_plugin.log')
             if (im_install_log_dir | default('') | length > 0)
             else 'the Installation Manager logs (imcl -log was not passed)' }}.
        success_msg: "{{ _hit | first | default('') | trim }}"
      vars:
        _hit: >-
          {{ plugin_verify.stdout_lines | default([])
             | select('search', (plugin_home | regex_replace('/+$', '') | regex_escape) ~ '/? +:')
             | select('search', plugin_package_filter | regex_escape) | list }}

- name: Summary
  ansible.builtin.debug:
    msg:
      - "host        : {{ inventory_hostname }}"
      - "environment : {{ was_environment }} ({{ was_env_long_name }})"
      - "plugin      : {{ plugin_home }}"
      - "changed     : {{ plugin_install_run.changed | default(false) }}"
      - "next        : the fix packs (lab_apply_fixpacks.yml), which patch it with IHS and WAS"
  tags: [plugin]
