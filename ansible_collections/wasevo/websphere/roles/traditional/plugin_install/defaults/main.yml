---
# The WebSphere web server plugin 9.0, installed through Installation Manager -
# the same imcl as WAS (installation_manager role).
#
# The plugin comes from the "WAS 9.0 Supplements" repository - the same one as
# IHS - and is installed TOGETHER with an IBM Java 8 SDK, in its own package
# group. The SDK offering is read from the WAS repository unless the
# supplements repository carries it too.
#
# IBM HTTP Server is a separate role: ihs_install.

# Where the supplements repository is unpacked. The same as IHS by default.
plugin_media_dir: "{{ ihs_media_dir | default(was_install_binaries_base_dir ~ '/IBM/install_ihs90') }}"

# Where the Java SDK offering is read from. The WAS 9.0 repository carries it;
# set "" if plugin_media_dir has it.
plugin_sdk_media_dir: "{{ was_media_dir | default(was_install_binaries_base_dir ~ '/IBM/install_was90') }}"

# The installation directory. An inventory declares the site's own
# (inventories/aix: /usr/IBM/Plugins9).
plugin_home: /opt/IBM/WebSphere/Plugins

# The offering id stem searched for in the repository and in what is installed.
plugin_package_filter: "com.ibm.websphere.PLG."

# Pin the offering when the repository carries more than one, e.g.
# com.ibm.websphere.PLG.v90_9.0.5017.20230725_1607. Empty: the newest
# advertised.
plugin_package_id: ""

plugin_sdk_package_filter: "com.ibm.java.jdk."

# The locale Installation Manager runs in.
im_install_locale: en
