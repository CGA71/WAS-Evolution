---
# Deployment manager profile.
#
# Only reached when was_topology is "nd". A standalone cell has no deployment
# manager; see the profile_standalone role.

# Where the rendered manageprofiles input is written on the target. It is
# rendered fresh on every run and removed afterwards: a response file kept
# around becomes a second definition of the profile, and the one that drifts is
# always the one somebody reads.
profile_response_dir: "{{ was_data_base_dir }}/profiles"

# Keep the rendered response file after the run. Off by default - it carries
# the administrative user name - and useful when a creation failed and the
# exact input matters more than the tidiness.
profile_keep_response: false

# An explicit port map wins over -startingPort. Leave it empty and
# manageprofiles allocates from was_base_port in the order its template
# defines; fill it to pin individual ports, keyed exactly as portdef.props
# names them (SOAP_CONNECTOR_ADDRESS, BOOTSTRAP_ADDRESS, WC_adminhost, ...).
#
# Either way the role does NOT assume where SOAP landed: it reads the created
# profile and publishes the real value. was_dmgr_soap_port is then an assertion
# target, not an input.
profile_dmgr_ports: {}

# Administrative security is on. A deployment manager reachable without
# credentials is not a lab shortcut, it is an open administrative console on
# the network the node agents live on.
profile_dmgr_admin_security: true

# No defaults for these on purpose. They come from an AWX credential or a
# vault, never from this repository - the source estate carried
# was_admin_password: "wsadmin" in group_vars and that is exactly what is not
# being carried over. The role refuses clearly when they are missing.
was_admin_user: ""
was_admin_password: ""

# No dry-run switch of its own. Simulating is a CHECK RUN - ansible-playbook
# --check, which AWX offers as "Job type: Check" in the launch dialog - so the
# role reads ansible_check_mode and nothing else. A parallel flag would be a
# second code path, and the second path is the one nobody tests.
