---
# Start one WAS process if it is not running - the deployment manager, a node
# agent or an application server.
#
# Inputs: start_label, start_command, and start_pid_files - every place the
# .pid file can be (or start_pid_file, a single one).
#
# RUNNING IS A LIVE PID, NOT A FILE. A process that died leaves its .pid file
# behind; a check on the file alone would call a dead server running and never
# start it. The pid inside must name a live process.
#
# SEVERAL PLACES because WAS writes the pid under LOG_ROOT, and LOG_ROOT can be
# moved (the log_root role): a process started before the move has its pid in
# the profile's logs/, one started after it in the new directory. Running in
# either is running.

# Plain POSIX sh, no bash: /bin/sh is ksh on AIX, and bash is not in the base
# system there. There is no pipeline, so there is nothing for pipefail to do.
- name: Is it running - {{ start_label }}
  ansible.builtin.shell:
    cmd: |
      state=stopped
      for f in {% for p in (start_pid_files | default([start_pid_file])) | unique %}"{{ p }}" {% endfor %}; do
        if [ -f "$f" ] && kill -0 "$(cat "$f")" 2>/dev/null; then
          state=running
        fi
      done
      echo $state
  register: _start_state
  changed_when: false
  check_mode: false
  become: true

- name: Start it - {{ start_label }}
  ansible.builtin.command:
    cmd: "{{ start_command }}"
  become: true
  when: _start_state.stdout != 'running'
  register: _start_run
  changed_when: true
  async: 900
  poll: 10

- name: Report - {{ start_label }}
  ansible.builtin.debug:
    msg: >-
      {{ start_label }}:
      {{ 'already running, left alone' if _start_state.stdout == 'running'
         else ('started' if not ansible_check_mode else 'would be started') }}
