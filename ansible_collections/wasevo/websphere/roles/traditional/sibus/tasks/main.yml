---
# Service integration buses, on the deployment manager.
#
# One module call per bus: the bus, its members and its destinations, in one
# wsadmin session, in the order they depend on each other.
#
# REPLAYABLE ON ITS OWN. Resolves the model, stages the driver, checks its own
# preconditions, and names the job that produces what is missing.

- name: Resolve the model and the names
  ansible.builtin.include_role:
    name: wasevo.websphere.model
  tags: [sibus, always]

- name: Resolve and validate the topology
  ansible.builtin.include_role:
    name: wasevo.websphere.model
    tasks_from: topology.yml
  tags: [sibus, always]

- name: Nothing declared, nothing to do
  ansible.builtin.debug:
    msg: >-
      sibuses is empty for this run. Buses are declared in the traditional
      part of the model or the inventory - see
      roles/traditional/sibus/defaults/main.yml for the shape.
  when: sibuses | length == 0
  tags: [sibus]

- name: Reconcile the service integration buses
  when: sibuses | length > 0
  tags: [sibus]
  block:

    - name: Complete and check the declarations
      ansible.builtin.set_fact:
        sibus_render: "{{ sibuses | wasevo.websphere.sibus_specs(was_cluster_name) }}"

    # Every error at once: a reliability level misspelt, a policy that does
    # not exist, a destination declared twice.
    - name: Every bus must be a bus WAS can build
      ansible.builtin.assert:
        that:
          - sibus_render.errors | length == 0
        fail_msg: >-
          {{ sibus_render.errors | length }} bus declaration problem(s):
          {{ sibus_render.errors | join(' | ') }}
        success_msg: "{{ sibus_render.buses | length }} bus(es) to reconcile"

    - name: A cluster bus member needs a cluster
      ansible.builtin.assert:
        that:
          - was_can_cluster | bool
            or (sibus_render.buses | map(attribute='members') | flatten
                | selectattr('cluster', 'defined') | selectattr('cluster') | list | length == 0)
        fail_msg: >-
          was_topology is "{{ was_topology }}", which has no cluster, and a bus
          would take a cluster as its member - the default. On a standalone
          server declare the member as {node: <node>, server: <server>}.
        success_msg: "every member can exist in this topology"

    - name: Administrative credentials must be supplied to reach the cell
      ansible.builtin.assert:
        that:
          - was_admin_user | default('') | length > 0
          - was_admin_password | default('') | length > 0
        fail_msg: >-
          Reaching a cell with administrative security enabled needs
          was_admin_user and was_admin_password - the deployment manager's
          administrator, not a local account. Supply them from an AWX
          credential or a vault.
        success_msg: "administrative credentials supplied"

    - name: Stage the Jython driver on the deployment manager
      ansible.builtin.include_role:
        name: wasevo.websphere.traditional.config

    - name: The deployment manager profile must exist on this host
      ansible.builtin.stat:
        path: "{{ was_profile_path }}/bin/wsadmin.sh"
      register: sibus_wsadmin
      check_mode: false

    - name: Refuse clearly when it does not
      ansible.builtin.fail:
        msg: >-
          No wsadmin at {{ was_profile_path }}/bin/wsadmin.sh on
          {{ inventory_hostname }}. A bus lives in the master configuration
          repository, which is the deployment manager profile - created by the
          profile job. A check run needs it too: reading the cell is how a dry
          run tells the truth.
      when: not (sibus_wsadmin.stat.exists | default(false))

    # ------------------------------------------------------------------
    # One wsadmin session per bus
    # ------------------------------------------------------------------
    - name: Reconcile each bus
      wasevo.websphere.was_sibus:
        bus: "{{ item.bus }}"
        description: "{{ item.description }}"
        security: "{{ item.security }}"
        members: "{{ item.members }}"
        destinations: "{{ item.destinations }}"
        state: "{{ sibus_state }}"
        profile_path: "{{ was_profile_path }}"
        admin_user: "{{ was_admin_user }}"
        admin_password: "{{ was_admin_password }}"
        jython_dir: "{{ was_jython_dir }}"
      loop: "{{ sibus_render.buses }}"
      loop_control:
        label: "{{ item.bus }}"
      register: sibus_result

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {% for r in sibus_result.results %}bus {{ r.item.bus }}:
          {{ r.item.members | length }} member(s),
          {{ (r.bus.destinations | default([])) | length }} destination(s),
          changed {{ r.changed }},
          {{ (r.drifts | default([])) | length }} store drift(s) left alone{{ ' || ' if not loop.last }}{% endfor %}
