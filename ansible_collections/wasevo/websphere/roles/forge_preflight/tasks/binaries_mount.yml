---
# The binaries mount point: where every IBM artefact is read from.
#
# Read-only. Mounting the share is the system administrator's job; this file
# says, before anything is installed, whether what the install jobs are about
# to read is really there:
#
#   1. the path exists and is a directory;
#   2. it is a MOUNT POINT, not a directory of the root filesystem that merely
#      exists - df names the filesystem a path lives on, and that filesystem's
#      mount point has to be the path itself;
#   3. the filesystem is of the declared type (nfs, cifs, jfs2...), and
#      optionally the declared share;
#   4. the connecting account can read and traverse it;
#   5. it carries the media: the Installation Manager archive and a WAS
#      repository (repository.config). Fix packs are counted, not required.
#
# Everything here is a command that exists on AIX and on Linux alike: df -P
# and the two OS-specific ways of reading a filesystem type.

- name: Binaries mount point - the path
  ansible.builtin.stat:
    path: "{{ was_install_binaries_base_dir }}"
  register: _bin_stat
  check_mode: false

- name: Binaries mount point - it must exist
  ansible.builtin.assert:
    that:
      - _bin_stat.stat.exists
      - _bin_stat.stat.isdir
    fail_msg: >-
      {{ was_install_binaries_base_dir }} does not exist on
      {{ inventory_hostname }}. Every IBM artefact path in the inventory is
      relative to it, so nothing can be installed until the share
      {{ site_binaries_repository | default('declared in the inventory') }}
      is mounted there.
    success_msg: "{{ was_install_binaries_base_dir }} exists"

# df -P is POSIX output on both systems: one header, then
#   <filesystem> <blocks> <used> <available> <capacity> <mounted on>
- name: Binaries mount point - the filesystem it lives on
  ansible.builtin.shell:
    cmd: df -Pk "{{ was_install_binaries_base_dir }}" | tail -1
  register: _bin_df
  changed_when: false
  check_mode: false

- name: Binaries mount point - read df
  ansible.builtin.set_fact:
    _bin_device: "{{ (_bin_df.stdout | trim).split() | first }}"
    _bin_mounted_on: "{{ (_bin_df.stdout | trim).split() | last }}"
    _bin_free_mb: "{{ ((_bin_df.stdout | trim).split()[3] | int) // 1024 }}"

- name: Binaries mount point - it must be a mount point
  ansible.builtin.assert:
    that:
      - _bin_mounted_on == (was_install_binaries_base_dir | regex_replace('/+$', ''))
    fail_msg: >-
      {{ was_install_binaries_base_dir }} is not a mount point: it is a
      directory of the filesystem mounted on {{ _bin_mounted_on }}
      ({{ _bin_device }}). The share
      {{ site_binaries_repository | default('declared in the inventory') }}
      is not mounted, so what the install would read there is whatever was
      left in the empty directory. Mount it (on AIX: mount, or an entry in
      /etc/filesystems with mount = true), or set
      forge_binaries_require_mount=false for a directory filled by hand.
    success_msg: "{{ was_install_binaries_base_dir }} is mounted from {{ _bin_device }}"
  when: forge_binaries_require_mount | bool

# The type: AIX's mount prints "node mounted over vfs ..." for a remote
# filesystem and "mounted over vfs ..." for a local one, so the type is the
# field after the one equal to the path. Linux has findmnt.
- name: Binaries mount point - the filesystem type (AIX)
  ansible.builtin.shell:
    cmd: >-
      mount | awk -v p="{{ was_install_binaries_base_dir | regex_replace('/+$', '') }}"
      '$2 == p { print $3; exit } $3 == p { print $4; exit }'
  register: _bin_type_aix
  changed_when: false
  check_mode: false
  when: ansible_facts.os_family == 'AIX'

- name: Binaries mount point - the filesystem type (Linux)
  ansible.builtin.command:
    cmd: findmnt -n -o FSTYPE --target "{{ was_install_binaries_base_dir }}"
  register: _bin_type_linux
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts.os_family != 'AIX'

- name: Binaries mount point - read the type
  ansible.builtin.set_fact:
    _bin_fstype: "{{ ((_bin_type_aix.stdout | default('')) ~ (_bin_type_linux.stdout | default(''))) | trim }}"

# nfs matches nfs3 and nfs4: the declared type is a prefix, not an exact name.
- name: Binaries mount point - it must be of the declared type
  ansible.builtin.assert:
    that:
      - (_bin_fstype | trim | lower).startswith(forge_binaries_fstype | trim | lower)
    fail_msg: >-
      {{ was_install_binaries_base_dir }} is a {{ _bin_fstype | trim | default('filesystem of unknown type', true) }}
      filesystem, and the inventory declares the share as
      {{ forge_binaries_fstype | trim }} (site_binaries_repository_type). Either
      the wrong thing is mounted there, or the inventory is wrong.
    success_msg: "type {{ _bin_fstype | trim }}"
  when: forge_binaries_fstype | trim | length > 0

- name: Binaries mount point - it must be the declared share
  ansible.builtin.assert:
    that:
      - (_bin_device | regex_replace('/+$', '')) == (site_binaries_repository | regex_replace('/+$', ''))
    fail_msg: >-
      {{ was_install_binaries_base_dir }} is mounted from {{ _bin_device }}, and
      the inventory declares {{ site_binaries_repository }}.
    success_msg: "mounted from the declared share {{ site_binaries_repository }}"
  when: forge_binaries_check_source | bool

- name: Binaries mount point - the connecting account must be able to read it
  ansible.builtin.shell:
    cmd: test -r "{{ was_install_binaries_base_dir }}" && test -x "{{ was_install_binaries_base_dir }}"
  register: _bin_readable
  changed_when: false
  failed_when: false
  check_mode: false

- name: Binaries mount point - it must be readable
  ansible.builtin.assert:
    that:
      - _bin_readable.rc == 0
    fail_msg: >-
      {{ ansible_user | default('the connecting account') }} cannot read
      {{ was_install_binaries_base_dir }}. On an NFS share this is usually the
      export's root squashing or the uid of the account differing between the
      server and the client.
    success_msg: "readable by {{ ansible_user | default('the connecting account') }}"

# ---------------------------------------------------------------------------
# The media on it
# ---------------------------------------------------------------------------

- name: Binaries mount point - the media
  when: forge_binaries_require_media | bool
  vars:
    _im_dir: "{{ im_media_dir | default(was_install_binaries_base_dir ~ '/IBM/install_im') }}"
    _im_pattern: "{{ im_media_pattern | default('*.zip') }}"
    _was_dir: "{{ was_media_dir | default(was_install_binaries_base_dir ~ '/IBM/install_was90') }}"
    _fp_dir: "{{ was_fixpack_media_dir | default(was_install_binaries_base_dir ~ '/IBM/fixes') }}"
  block:

    - name: Binaries mount point - look for the Installation Manager archive
      ansible.builtin.find:
        paths: "{{ _im_dir }}"
        patterns: "{{ _im_pattern }}"
        file_type: file
      register: _bin_im
      check_mode: false

    - name: Binaries mount point - look for the WAS repository
      ansible.builtin.find:
        paths: "{{ _was_dir }}"
        patterns: "repository.config"
        recurse: true
        depth: 3
        file_type: file
      register: _bin_was
      check_mode: false

    - name: Binaries mount point - look for fix pack repositories
      ansible.builtin.find:
        paths: "{{ _fp_dir }}"
        patterns: "repository.config"
        recurse: true
        depth: 3
        file_type: file
      register: _bin_fp
      check_mode: false

    - name: Binaries mount point - the media must be there
      ansible.builtin.assert:
        that:
          - _bin_im.matched > 0
          - _bin_was.matched > 0
        fail_msg: >-
          The share is mounted but does not carry what the install reads.
          Installation Manager archive ({{ _im_pattern }} in {{ _im_dir }}):
          {{ 'found' if _bin_im.matched > 0 else 'MISSING' }}.
          WAS repository (repository.config under {{ _was_dir }}):
          {{ 'found' if _bin_was.matched > 0 else 'MISSING' }}.
          Neither can be downloaded by a playbook - both need an IBMid. On AIX
          the Installation Manager archive is the AIX one
          (agent.installer.aix.motif.ppc_<version>.zip), not the Linux one.
        success_msg: >-
          Installation Manager: {{ _bin_im.files | map(attribute='path') | map('basename') | join(', ') }};
          WAS repository: {{ (_bin_was.files | map(attribute='path') | first | default('')) | dirname }}

    - name: Binaries mount point - what it carries
      ansible.builtin.debug:
        msg:
          - "mount      : {{ was_install_binaries_base_dir }} <- {{ _bin_device }} ({{ _bin_fstype | trim | default('?', true) }})"
          - "free       : {{ _bin_free_mb }} MB"
          - "IM archive : {{ _bin_im.files | map(attribute='path') | list | join(', ') | default('-', true) }}"
          - "WAS repo   : {{ _bin_was.files | map(attribute='path') | map('dirname') | list | join(', ') | default('-', true) }}"
          - "fix packs  : {{ _bin_fp.matched }} repository(ies) under {{ _fp_dir }}"
