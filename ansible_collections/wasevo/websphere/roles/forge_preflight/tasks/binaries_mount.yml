---
# The binaries mount point: where every IBM artefact is read from.
#
# Read-only, and three tasks: READ everything in one pass on the target, FIND
# the media in one pass, then one VERDICT that lists every problem at once -
# rather than stopping at the first and leaving the operator to rerun for the
# next. What is checked:
#
#   1. the path exists and is a directory;
#   2. it is a MOUNT POINT, not a directory of the root filesystem that merely
#      exists (forge_binaries_require_mount) - df names the filesystem a path
#      lives on, and that filesystem's mount point has to be the path itself;
#   3. the filesystem is of the declared type (forge_binaries_fstype: nfs
#      matches nfs3 and nfs4), and optionally the declared share
#      (forge_binaries_check_source);
#   4. the connecting account can read and traverse it;
#   5. it carries the media (forge_binaries_require_media): the Installation
#      Manager archive and a WAS repository - but each only while its product
#      is NOT installed yet. They serve a first install and nothing else: a
#      server where imcl and WAS are already in place is not asked for them.
#      Fix packs are counted, not required - having none is a normal outcome
#      for the fix pack job.
#
# Only POSIX sh, df -P, and each system's own way of reading a filesystem
# type: AIX's mount, Linux's findmnt.

- name: Binaries mount point
  vars:
    _bin_path: "{{ was_install_binaries_base_dir | regex_replace('/+$', '') }}"
    _im_dir: "{{ im_media_dir | default(was_install_binaries_base_dir ~ '/IBM/install_im') | regex_replace('/+$', '') }}"
    _was_dir: "{{ was_media_dir | default(was_install_binaries_base_dir ~ '/IBM/install_was90') | regex_replace('/+$', '') }}"
    _fp_dir: "{{ was_fixpack_media_dir | default(was_install_binaries_base_dir ~ '/IBM/fixes') | regex_replace('/+$', '') }}"
    # What the read printed, as key=value lines, made a dictionary. Every value
    # stays a string: yes/no are compared as such.
    _bin: >-
      {{ dict(_bin_read.stdout_lines | default([])
              | select('match', '^[a-z_]+=')
              | map('regex_search', '^([a-z_]+)=(.*)$', '\\1', '\\2')) }}
    _bin_free_mb: "{{ (_bin.free_kb | default(0) | int) // 1024 }}"
    _media: "{{ _bin_media.files | default([]) | map(attribute='path') | list }}"
    _im_files: >-
      {{ _media | select('match', (_im_dir | regex_escape) ~ '/[^/]+$')
         | reject('search', '/repository[.]config$') | list }}
    _was_repos: >-
      {{ _media | select('match', (_was_dir | regex_escape) ~ '/.*repository[.]config$') | map('dirname') | list }}
    _fp_repos: >-
      {{ _media | select('match', (_fp_dir | regex_escape) ~ '/.*repository[.]config$') | map('dirname') | list }}
  block:

    - name: Binaries mount point - read it
      ansible.builtin.shell:
        # AIX's mount prints "node mounted over vfs ..." for a remote
        # filesystem and "mounted over vfs ..." for a local one: the type is
        # the field after the one equal to the path.
        cmd: |
          p="{{ _bin_path }}"
          if [ ! -d "$p" ]; then echo "exists=no"; exit 0; fi
          echo "exists=yes"
          set -- $(df -Pk "$p" | tail -1)
          echo "device=$1"
          echo "free_kb=$4"
          echo "mounted_on=$6"
          if [ "$(uname -s)" = AIX ]; then
            t=$(mount | awk -v p="$p" '$2 == p { print $3; exit } $3 == p { print $4; exit }')
          else
            t=$(findmnt -n -o FSTYPE --target "$p" 2>/dev/null)
          fi
          echo "fstype=$t"
          if [ -r "$p" ] && [ -x "$p" ]; then echo "readable=yes"; else echo "readable=no"; fi
          if [ -x "{{ im_installer_cmd | default('/nonexistent') }}" ]; then echo "im_installed=yes"; fi
          if [ -f "{{ was_home | default('/nonexistent') }}/bin/versionInfo.sh" ]; then echo "was_installed=yes"; fi
      register: _bin_read
      changed_when: false
      check_mode: false

    - name: Binaries mount point - find the media
      ansible.builtin.find:
        paths: "{{ [_im_dir, _was_dir, _fp_dir] | unique }}"
        patterns: "{{ [im_media_pattern | default('*.zip'), 'repository.config'] }}"
        recurse: true
        depth: 4
        file_type: file
      register: _bin_media
      check_mode: false
      when:
        - forge_binaries_require_media | bool
        - _bin.exists == 'yes'
        - _bin.readable | default('no') == 'yes'

    - name: Binaries mount point - verdict
      ansible.builtin.assert:
        that:
          - _problems | length == 0
        fail_msg: |-
          {{ _bin_path }} on {{ inventory_hostname }} cannot be used:
          {{ _problems | map('regex_replace', '^', '  - ') | join('\n') }}
        success_msg: |-
          mount      : {{ _bin_path }} <- {{ _bin.device | default('?') }} ({{ _bin.fstype | default('?', true) }})
          free       : {{ _bin_free_mb }} MB
          IM archive : {{ 'not needed, Installation Manager is installed' if _bin.im_installed | default('no') == 'yes'
                          else (_im_files | map('basename') | join(', ')) }}
          WAS repo   : {{ 'not needed, WAS is installed' if _bin.was_installed | default('no') == 'yes'
                          else (_was_repos | join(', ')) }}
          fix packs  : {{ _fp_repos | length }} repository(ies) under {{ _fp_dir }}
      vars:
        _share: "{{ site_binaries_repository | default('the share') }}"
        _problems: >-
          {%- set p = [] -%}
          {%- if _bin.exists != 'yes' -%}
          {%-   set _ = p.append(_bin_path ~ ' does not exist. Every IBM artefact path of the inventory is relative to it:'
                                 ~ ' mount ' ~ _share ~ ' there - job 0a, binaries_mount.yml.') -%}
          {%- else -%}
          {%-   if forge_binaries_require_mount | bool and _bin.mounted_on != _bin_path -%}
          {%-     set _ = p.append('not a mount point but a directory of the filesystem mounted on ' ~ _bin.mounted_on
                                   ~ ' (' ~ _bin.device ~ '): ' ~ _share ~ ' is not mounted. Job 0a mounts it;'
                                   ~ ' forge_binaries_require_mount=false accepts a directory filled by hand.') -%}
          {%-   elif forge_binaries_fstype | trim | length > 0
                   and not (_bin.fstype | default('') | lower).startswith(forge_binaries_fstype | trim | lower) -%}
          {%-     set _ = p.append('a ' ~ (_bin.fstype | default('', true) or 'unknown') ~ ' filesystem, where the inventory declares '
                                   ~ (forge_binaries_fstype | trim) ~ ' (site_binaries_repository_type).') -%}
          {%-   endif -%}
          {%-   if forge_binaries_check_source | bool
                 and (_bin.device | regex_replace('/+$', '')) != (_share | regex_replace('/+$', '')) -%}
          {%-     set _ = p.append('mounted from ' ~ _bin.device ~ ', where the inventory declares ' ~ _share ~ '.') -%}
          {%-   endif -%}
          {%-   if _bin.readable != 'yes' -%}
          {%-     set _ = p.append((ansible_user | default('the connecting account')) ~ ' cannot read it. On NFS: the root'
                                   ~ ' squashing of the export, or the uid of the account differing between server and client.') -%}
          {%-   elif forge_binaries_require_media | bool -%}
          {%-     if _im_files | length == 0 and _bin.im_installed | default('no') != 'yes' -%}
          {%-       set _ = p.append('no Installation Manager archive (' ~ (im_media_pattern | default('*.zip')) ~ ') in ' ~ _im_dir
                                     ~ '. On AIX it is the AIX one, agent.installer.aix.motif.ppc_<version>.zip. It needs an IBMid.') -%}
          {%-     endif -%}
          {%-     if _was_repos | length == 0 and _bin.was_installed | default('no') != 'yes' -%}
          {%-       set _ = p.append('no WAS repository (repository.config) under ' ~ _was_dir ~ '. It needs an IBMid.') -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endif -%}
          {{ p }}
