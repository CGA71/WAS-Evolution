---
# Everything the WAS Evolution forge needs in order to run, declared in one
# place so that a missing dependency is a named assertion failure instead of a
# cryptic error three roles later.
#
# "Forge" covers two sides, and they have nothing in common:
#
#   control side - the Execution Environment or control node that runs Ansible
#   target side  - the WAS/IHS hosts, and the OpenShift API for the Liberty plane
#
# Scope is driven by runtime.product, because the two planes need different
# things: the traditional plane needs SSH and a staged Jython driver, the
# Liberty plane needs an API endpoint and no SSH at all.

# ---------------------------------------------------------------------------
# Control side
# ---------------------------------------------------------------------------

forge_ansible_core_min: "2.15.0"

# Collections, per plane. The traditional plane deliberately needs almost
# nothing: the whole point of shipping a Jython driver as data is that the
# Execution Environment carries no Java and no Jython.
forge_collections:
  common:
    - { name: ansible.posix, version: ">=1.5.4" }
    - { name: community.general, version: ">=8.0.0" }
  traditional: []
  liberty_more: []
  liberty_ocp:
    - { name: kubernetes.core, version: ">=3.0.0" }
    # Not redhat.openshift: that one is certified and lives on Automation
    # Hub, not Galaxy, so ansible-galaxy cannot resolve it without a Hub
    # token. community.okd is the Galaxy equivalent.
    - { name: community.okd, version: ">=2.0.0" }

# Python packages that must be importable in the Execution Environment.
forge_python_packages:
  common: []
  traditional: []
  liberty_more: []
  liberty_ocp:
    - { import_name: kubernetes, pip_name: kubernetes }
    - { import_name: yaml, pip_name: PyYAML }

# Command-line tools that must be on PATH. Kept short on purpose: anything
# reachable through a module should go through the module, not a shell call.
forge_control_commands:
  common: []
  traditional: []
  liberty_more: []
  liberty_ocp: []

# Only needed by liberty/image_build (wave 4). Left empty by default because a
# forge that delegates image builds to a BuildConfig or a Tekton pipeline has
# no builder of its own, which is the preferred arrangement.
forge_image_builder: ""          # "" | podman | buildah

# ---------------------------------------------------------------------------
# Target side - WAS and IHS hosts
# ---------------------------------------------------------------------------

# OS packages, per distribution family. Grounded in what the legacy playbooks
# actually installed or implicitly relied on:
#   psmisc  - provides killall, which manageprofiles needs. The legacy
#             was_install playbook installed it as its very last task, after
#             the profiles it is a prerequisite for.
#   unzip, tar, gzip - Installation Manager unpacks with them
#   gettext - imcl localisation (the legacy install passed -nl fr)
forge_os_packages:
  RedHat:
    - psmisc
    - unzip
    - tar
    - gzip
    - gettext
    - net-tools
  Debian:
    - psmisc
    - unzip
    - tar
    - gzip
    - gettext-base
    - net-tools
  AIX:
    # AIX FILESETS, checked with lslpp - not RPMs. They come from the AIX
    # installation media (installp), so prereqs_os verifies them and refuses
    # with their names; it does not install them. Confirm the list against the
    # IBM prerequisite statement for the WAS level in use.
    - bos.adt.libm
    - bos.perf.perfstat
    - xlC.aix61.rte

# Commands that must be on the DEFAULT PATH of a non-interactive SSH session,
# per OS family. On Linux the packages above provide them in /usr/bin. On AIX
# they come from the AIX Toolbox for Open Source Software, under
# /opt/freeware/bin, which a non-interactive session does not have on its PATH
# unless /etc/environment adds it or the Toolbox links them into /usr/bin -
# and ansible.builtin.unarchive looks for unzip and zipinfo on that PATH, so a
# missing one fails the Installation Manager job 148 MB of copy later.
forge_os_commands:
  RedHat: []
  Debian: []
  AIX:
    - unzip
    - zipinfo
    - sudo

# The AIX Toolbox RPMs that provide forge_os_commands. prereqs_os installs them
# with the Toolbox's dnf when it is present; without dnf it refuses and names
# them.
forge_aix_toolbox_packages:
  - unzip
  - sudo
forge_aix_dnf: /opt/freeware/bin/dnf

# Kernel and shell limits the legacy repository deployed as files into
# /etc/security/limits.d/. Declared as data so AIX can be given its own
# equivalent rather than silently inheriting Linux values: on AIX they are
# user attributes in /etc/security/limits, set with chuser, under the names
# forge_aix_limit_names gives them (a hard limit adds _hard).
# site_was_user, not was_admin_user: these are two different things that I had
# conflated. site_was_user is the OS account that owns the installation and
# runs the processes; was_admin_user is the WAS administrative console user,
# which has no OS existence at all and comes from a credential.
forge_limits:
  - { domain: "{{ site_was_user }}", type: soft, item: nofile, value: 65536 }
  - { domain: "{{ site_was_user }}", type: hard, item: nofile, value: 65536 }
  - { domain: "{{ site_was_user }}", type: soft, item: nproc, value: 16384 }
  - { domain: "{{ site_was_user }}", type: hard, item: nproc, value: 16384 }

forge_aix_limit_names:
  nofile: nofiles
  nproc: nproc

# Directories that must exist before any install step. Derived from the paths
# declared in the inventory, so changing a base path moves all of them.
forge_required_dirs:
  - "{{ was_app_base_dir }}"
  - "{{ was_binaries_base_dir }}"
  - "{{ was_profiles_base_dir }}"
  - "{{ was_logs_base_dir }}"
  - "{{ was_jython_dir }}"

# Free space required, in megabytes, checked before an install or a fixpack.
# A fixpack that runs out of space mid-apply leaves the installation in a state
# that is far more expensive to recover than a refused playbook.
forge_min_free_mb:
  "{{ was_binaries_base_dir }}": 6144
  "{{ was_logs_base_dir }}": 2048

# ---------------------------------------------------------------------------
# Target side - the binaries mount point
# ---------------------------------------------------------------------------
# The IBM media is read from was_install_binaries_base_dir, a share the system
# administrator mounts. tasks/binaries_mount.yml verifies it, read-only; the
# playbook binaries_mount_check.yml runs that check on its own, and it is the
# first gate of the pipeline's Validation stage.

# The path must be a mount point, not a directory of the root filesystem. A
# directory that merely exists passes a stat and then holds nothing, or holds a
# stale copy, which is worse.
forge_binaries_require_mount: true

# The filesystem type the mount must have: nfs, cifs, jfs2... Empty or "none"
# skips the comparison. Defaults to the type the inventory declares for the
# share.
forge_binaries_fstype: >-
  {{ site_binaries_repository_type | default('')
     | regex_replace('^none$', '') }}

# When true, the mounted device must be the declared share
# (site_binaries_repository). Off by default: the same export is often written
# differently (host name, IP, trailing slash) and a false refusal is no help.
forge_binaries_check_source: false

# What must be on the share before an install, relative to the paths the
# inventory declares. The Installation Manager archive and the WAS repository
# are required; the fix packs are reported, since having none is a normal
# outcome for the fix pack job.
forge_binaries_require_media: true

# ---------------------------------------------------------------------------
# Target side - OpenShift
# ---------------------------------------------------------------------------

# Checked by name only. The preflight confirms the API answers and the
# namespace is reachable; it does not create anything.
forge_openshift_required_api_groups:
  - apps.openshift.io
  - route.openshift.io

# The operator supplies the WebSphereLibertyApplication CRD. Without it the
# deploy role has nothing to apply, and that is worth finding out before the
# promotion workflow starts rather than at the PRD node.
forge_openshift_required_crds:
  - webspherelibertyapplications.liberty.websphere.ibm.com

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------

# When false, missing dependencies are reported and the play continues. Useful
# for a first survey of an estate; never in a pipeline.
forge_preflight_strict: true

# Set true to skip the target-side checks, e.g. when validating only the model
# and the control side in CI where no WAS host is reachable.
forge_preflight_control_only: false

# Set false to skip the check that the directory layout exists, i.e. before the
# first install on a new server: prereqs_os creates it.
forge_preflight_check_dirs: true
