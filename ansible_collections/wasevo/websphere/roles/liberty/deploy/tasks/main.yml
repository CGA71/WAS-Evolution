---
# Apply the WebSphereLibertyApplication CR, ConfigMap and Secret through kubernetes.core. Never merge with config_render: this is the GitOps boundary.
#
# Scheduled for: wave 5
# Source material: replaces pbk_deploiement_ressource.yml, which SSHes to a master and runs kubectl apply - that pattern does not survive OpenShift
#
# Not implemented yet. This file exists so the role is tracked, so the wave it
# belongs to is recorded next to the code, and so a playbook that references it
# fails with a clear message rather than a missing-role error.

- name: Role not implemented yet
  ansible.builtin.fail:
    msg: >-
      wasevo.websphere.liberty/deploy is scheduled for wave 5 and is not implemented.
      See README section 5 to 7 for the action list of that wave.
  when: not (allow_unimplemented_roles | default(false))
