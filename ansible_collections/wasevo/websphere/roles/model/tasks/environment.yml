---
# Environment resolution and validation, on its own so it can run BEFORE any
# host pattern is computed.
#
# This split exists because of a hole the lab found: model_validate.yml used to
# target "{{ was_environment | lower }}", so an unknown environment produced an
# empty host pattern, the play matched nothing, and the run SUCCEEDED without
# validating anything. An unknown code has to fail, not evaporate.
#
# Nothing here needs a host or a group_var: the catalogue lives in this role.

- name: Load the catalogues and the translation tables
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop:
    - environments.yml
    - jvm_flags.yml
    - jdk_matrix.yml
  tags: [model, always]

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# One declared code, everything else looked up. The source inventory needed
# eight hand-written variables for this, two of which held the same string.

- name: An environment and a channel must be supplied
  ansible.builtin.assert:
    that:
      - was_environment is defined
      - was_channel is defined
    fail_msg: >-
      No environment was supplied. It is an input, not a property of a host or
      of a directory: the same machine can be built as any of
      {{ was_environment_catalog.keys() | list | join(', ') }}, and the answer
      decides the cell name, the profile names and the ports.
      In AWX, answer the survey question "Give an environment". On the command
      line, pass -e was_environment=RIT. The channel is the same kind of input
      and may default where a lab only exercises one.
  tags: [model, validate, environment]

- name: The environment must resolve to a catalogue entry
  ansible.builtin.assert:
    that:
      - was_env_code | length > 0
    fail_msg: >-
      Unknown environment "{{ was_environment }}". Known:
      {{ was_environment_catalog.keys() | list | join(', ') }}.
      The match is case-insensitive, so rit, RIT and Rit all resolve - this
      failure means the code itself is not in the catalogue, not that the case
      is wrong. To add one, add a catalogue entry in
      roles/model/vars/environments.yml and the hosts to the inventory.
    success_msg: >-
      {{ was_environment }} resolved to {{ was_env_code }} / {{ was_env_lower }}
  tags: [model, validate, environment]

- name: The channel must resolve to a catalogue entry
  ansible.builtin.assert:
    that:
      - was_channel_code | length > 0
    fail_msg: >-
      Unknown channel "{{ was_channel }}". Known:
      {{ was_channel_catalog.keys() | list | join(', ') }}.
      The match is case-insensitive; the canonical form is title case because
      that is how the channel appears inside WAS object names.
  tags: [model, validate, environment]

- name: Warn about catalogue entries that were never confirmed
  ansible.builtin.debug:
    msg: >-
      {{ item.what }} {{ item.name }} is marked confirmed: false. Only RIT was
      ever declared in the source inventory, where the letter was "I"; the
      other values are plausible but unverified. Check them against the naming
      standard and set confirmed: true.
  loop:
    - what: Environment
      name: "{{ was_env_code }}"
      ok: "{{ was_environment_catalog[was_env_code].confirmed | default(false) }}"
    - what: Channel
      name: "{{ was_channel_code }}"
      ok: "{{ was_channel_catalog[was_channel_code].confirmed | default(false) }}"
  loop_control:
    label: "{{ item.what }} {{ item.name }}"
  when: not (item.ok | bool)
  tags: [model, validate, environment]

- name: Production requires a deliberate acknowledgement
  ansible.builtin.assert:
    that:
      - model_allow_production | bool
    fail_msg: >-
      {{ was_environment }} is tier prod. Pass -e model_allow_production=true,
      or use the AAP workflow, which carries an Approval Node for exactly this.
      A production run should never be something that happens by typing the
      wrong inventory path.
  when: was_environment_catalog[was_env_code].tier == 'prod'
  tags: [model, validate, environment]

