---
# Environment catalogue.
#
# The source inventory declared EIGHT variables for what is one fact:
#
#   environnement_nom_long_majuscule: "RIT"      <- same value...
#   environnement_nom_long_minuscule: "rit"
#   environnement_trigramme_majuscule: "RIT"     <- ...as this one, both by hand
#   environnement_trigramme_minuscule: "rit"
#   environnement_lettre_majuscule: "I"
#   environnement_lettre_minuscule: "i"
#   canal: "Extranet"
#   canal_minuscule: "extranet"
#
# Two names held the same string, and six of the eight are derivable. Every one
# of them had to be edited by hand when a new environment was created, which is
# exactly the shape of a drift bug waiting to happen.
#
# Here the inventory declares ONE code -- was_environment: RIT -- and everything
# else is looked up or computed. The same applies to the channel.
#
# To add an environment: add an entry here and create inventories/<code lower>/.
# Nothing else.

was_environment_catalog:

  RIT:
    long_name: "Recette Integration Technique"
    letter: "I"
    tier: non_prod
    # Promotion order, used by the AAP workflow to sequence RIT -> RA -> RU -> PRD.
    rank: 10
    confirmed: true

  RA:
    long_name: "Recette Applicative"
    letter: "A"
    tier: non_prod
    rank: 20
    # TO CONFIRM: the source inventory only ever declared RIT, where the letter
    # was "I". The letters below are plausible but unverified. The model role
    # warns while confirmed is false; set it to true once checked against the
    # naming standard.
    confirmed: false

  RU:
    long_name: "Recette Utilisateur"
    letter: "U"
    tier: non_prod
    rank: 30
    confirmed: false

  PRD:
    long_name: "Production"
    letter: "P"
    tier: prod
    rank: 90
    confirmed: false


# Channels. The source inventory carried canal / canal_minuscule as two hand
# written variables; the lowercase form is derived here instead.
was_channel_catalog:

  Extranet:
    description: "Internet-facing channel"
    confirmed: true

  Intranet:
    description: "Internal channel"
    # The source repository shipped keystores for Intranet_RA, Intranet_RIT and
    # Intranet_RU, so the channel exists; its exact declarations were not in
    # the archive that was handed over.
    confirmed: false


# Derived forms.
#
# Both cases genuinely matter, which is why the source inventory carried
# _majuscule and _minuscule pairs rather than being merely redundant:
#
#   UPPERCASE  cell name (Extranet_RIT), profile name (Dmgr_RIT_Extranet),
#              shared class cache (-Xshareclasses:name=RIT%g)
#   lowercase  directory paths, keystore paths (files/ssl/rit/extranet/),
#              hostnames and DNS, and the inventory group a host pattern
#              resolves to
#
# So both are published. What is NOT duplicated is the declaration: one input,
# both forms derived from it.
#
# The input arrives from a survey answer, so its case cannot be trusted. The
# catalogue keys are canonical - environments uppercase, channels title case -
# and the lookup below is case-insensitive: rit, RIT and Rit all resolve, and
# so do extranet and Extranet. Without this, a lowercase answer produces a
# KeyError on the catalogue and nothing explains why.

# UPPERCASE form of each catalogue key -> the canonical key itself.
_env_by_upper: >-
  {{ dict(was_environment_catalog.keys() | list | map('upper') | list
          | zip(was_environment_catalog.keys() | list)) }}
_channel_by_upper: >-
  {{ dict(was_channel_catalog.keys() | list | map('upper') | list
          | zip(was_channel_catalog.keys() | list)) }}

# The canonical codes. Everything else derives from these two, never from the
# raw input, so a difference of case cannot reach a cell name or a path.
was_env_code: >-
  {{ _env_by_upper[was_environment | default('') | upper] | default('', true) }}
was_channel_code: >-
  {{ _channel_by_upper[was_channel | default('') | upper] | default('', true) }}

was_env: "{{ was_environment_catalog[was_env_code] }}"

was_env_upper: "{{ was_env_code }}"
was_env_lower: "{{ was_env_code | lower }}"
was_env_letter_upper: "{{ was_environment_catalog[was_env_code].letter | upper }}"
was_env_letter_lower: "{{ was_environment_catalog[was_env_code].letter | lower }}"
was_env_long_name: "{{ was_environment_catalog[was_env_code].long_name }}"
was_env_tier: "{{ was_environment_catalog[was_env_code].tier }}"
was_env_rank: "{{ was_environment_catalog[was_env_code].rank }}"
was_env_is_production: "{{ was_environment_catalog[was_env_code].tier == 'prod' }}"

was_channel_upper: "{{ was_channel_code | upper }}"
was_channel_lower: "{{ was_channel_code | lower }}"
# Title case, the form that appears inside WAS object names.
was_channel_name: "{{ was_channel_code }}"
