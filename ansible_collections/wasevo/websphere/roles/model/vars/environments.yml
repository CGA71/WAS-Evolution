---
# Environment and channel: derivation, not nomenclature.
#
# There is deliberately NO list of environment codes in this file, and there
# must not be one anywhere in the collection. The environment is an answer to
# the AWX workflow survey question, so its value is whatever the operator
# typed. A closed catalogue would mean every new environment needs a code
# change before it can be built, which is the opposite of taking it as an
# input - and a hardcoded list of the usual suspects is exactly the thing this
# repository is replacing.
#
# What used to be looked up per code is now either derived from the code or
# supplied as its own input:
#
#   long_name   ->  was_environment_long_name   (optional, defaults to the code)
#   letter      ->  was_environment_letter      (optional, defaults to code[0])
#   tier        ->  was_environment_tier        (input, defaults to non_prod)
#   rank        ->  gone. The workflow sequences its own nodes; a promotion
#                   rank cannot be computed for a value nobody declared.
#   confirmed   ->  gone. It only existed because the catalogue was guessing.
#
# The input arrives from a survey, so its case cannot be trusted. Both cases
# genuinely matter downstream, which is why two forms are published:
#
#   UPPERCASE  cell name, profile names, the shared class cache name
#   lowercase  directory paths, keystore paths, hostnames and DNS, and the
#              inventory group a host pattern resolves to
#
# What is NOT duplicated is the declaration: one input, both forms derived
# from it. Nothing downstream may read was_environment directly - everything
# comes from was_env_code, so a difference of case cannot reach a cell name.

# Canonical forms. upper for objects, lower for paths and group names.
was_env_code: "{{ was_environment | default('') | trim | upper }}"
was_env_upper: "{{ was_env_code }}"
was_env_lower: "{{ was_env_code | lower }}"

# The letter that appears inside node names. Derived from the code rather than
# looked up; override it in the inventory when a site naming standard says
# otherwise, because a derived first letter is a convention, not a rule.
was_env_letter_upper: "{{ (was_environment_letter | default(was_env_code[:1])) | upper }}"
was_env_letter_lower: "{{ was_env_letter_upper | lower }}"

# Free text, used in reports only. No value is invented for it: an environment
# that was not described is reported by its code.
was_env_long_name: "{{ was_environment_long_name | default(was_env_code, true) }}"

# Tier is an input, not a property of a code. It cannot be inferred: the whole
# point of an open value is that this collection does not know which codes a
# site calls production. Default non_prod, so forgetting it never UNLOCKS
# production - it is the acknowledgement that unlocks it.
was_env_tier: "{{ was_environment_tier | default('non_prod') | trim | lower }}"
was_env_is_production: "{{ was_env_tier == 'prod' }}"

# The channel is a second, independent input, treated the same way: canonical
# title case for the form that appears inside WAS object names, lowercase for
# paths and keystore directories. No catalogue either - a site that adds a
# channel should not need a merge request.
was_channel_code: "{{ was_channel | default('') | trim | lower | capitalize }}"
was_channel_name: "{{ was_channel_code }}"
was_channel_upper: "{{ was_channel_code | upper }}"
was_channel_lower: "{{ was_channel_code | lower }}"

# Accepted shape, checked in tasks/environment.yml. This replaces membership
# of a list: the value is refused for being unusable in a WAS object name or a
# path, never for being unknown. Letter first because a profile name and a
# node name both start with it; alphanumeric only because the value reaches a
# cell name, a directory path, a keystore path and a DNS label.
was_env_code_pattern: '^[A-Z][A-Z0-9]{1,7}$'
was_channel_code_pattern: '^[A-Z][A-Za-z0-9]{1,15}$'
