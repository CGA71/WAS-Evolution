---
# Resolved by AWX at project sync, and by the CI jobs. In production these are
# baked into the Execution Environment image.
#
# The traditional plane on AIX only. kubernetes.core and community.okd are not
# here: Kubernetes / OpenShift is set aside for now, and nothing the pipeline
# or the AWX workflows run calls them. The Liberty / OpenShift roles stay in
# the collection; whoever revives that plane adds the two back here (and to
# galaxy.yml) - forge_preflight already names them for runtime.product
# liberty_ocp and fails on their absence with that message.
#
# Keep this file a superset of forge_collections.common in forge_preflight:
# the preflight checks those against what is installed.
collections:
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=8.0.0"
