---
# The resources the simulation builds in its fake cell, family by family.
#
# Same shape as the shared model - layer 1 - so the simulation exercises the
# declaration a real environment writes, not a test-only variant of it.

# --------------------------------------------------------------------------
# J2C authentication aliases
# --------------------------------------------------------------------------
# password_env names a variable on the controller. In AWX a credential fills
# it; in the pipeline the job sets it (.gitlab-ci.yml, SIM_J2C_PASSWORD), with
# a value that is a marker and not a secret. Either way the path is the same:
# the declaration carries the NAME, the run supplies the value.
j2c_aliases:
  - name: simDbAlias
    user: simapp
    password_env: SIM_J2C_PASSWORD
    description: CI simulation database

# --------------------------------------------------------------------------
# Datasources
# --------------------------------------------------------------------------
# Rendered for WAS traditional by plugins/filter/traditional.py - the vendor
# through roles/model/vars/jdbc_vendors.yml, the Liberty-style pool settings
# into WAS attributes in seconds. Cluster scope, the default.
#
# Two datasources sharing one provider, so the simulation exercises the case
# where the provider is declared once and used twice - and a third at server
# scope, so a run with more than one scope is exercised too.
datasources:
  - name: simOrders
    jndi_name: jdbc/sim/orders
    vendor: db2_i_toolbox
    provider: simToolboxProvider
    driver_dir: /app/binaries/was90/jdbcprovider
    driver_jar: jt400.jar
    auth_alias: simDbAlias
    statement_cache_size: 20
    properties:
      databaseName: SIMORDERS
      serverName: as400.sim.internal
    pool:
      maxPoolSize: 30
      minPoolSize: 5
      connectionTimeout: 30s
      maxIdleTime: 30m

  - name: simStock
    jndi_name: jdbc/sim/stock
    vendor: db2_i_toolbox
    provider: simToolboxProvider
    driver_dir: /app/binaries/was90/jdbcprovider
    driver_jar: jt400.jar
    auth_alias: simDbAlias
    properties:
      databaseName: SIMSTOCK
      serverName: as400.sim.internal

  - name: simReporting
    jndi_name: jdbc/sim/reporting
    vendor: oracle
    driver_dir: /app/binaries/was90/jdbcprovider
    driver_jar: ojdbc8.jar
    auth_alias: simDbAlias
    transactional: "false"
    scope:
      type: server
      node: was-node-01Node
      server: ClusterEXT_was-node-01Node_01
    properties:
      URL: "jdbc:oracle:thin:@//oracle.sim.internal:1521/REPORT"

# --------------------------------------------------------------------------
# Shared libraries
# --------------------------------------------------------------------------
# The two forms of the shared model, one each. The pattern is expanded on the
# deployment manager pod, where sim:configure stages two jars first - the step
# a real estate performs when it deploys its application binaries. The
# explicit list needs no file at all: it is taken as written.
shared_libraries:
  - name: simCommonLibrary
    dir: /app/sim-shared
    includes: "*.jar"

  - name: simReportingLibrary
    jars:
      - /app/sim-reporting/engine.jar
      - /app/sim-reporting/fonts.jar

# --------------------------------------------------------------------------
# Service integration bus
# --------------------------------------------------------------------------
# Traditional only - no Liberty equivalent. No member is declared, so the bus
# takes the run's cluster, which exercises that default. A queue with its own
# exception destination, the dead-letter queue itself, and a topic space.
sibuses:
  - name: SimOrdersBus
    description: CI simulation bus
    destinations:
      - name: SimOrdersQueue
        max_failed_deliveries: 5
        exception_destination: SimOrdersDeadLetters
      - name: SimOrdersDeadLetters
      - name: SimPricesTopic
        type: topic_space
        reliability: RELIABLE_NONPERSISTENT

# --------------------------------------------------------------------------
# JMS, on both providers
# --------------------------------------------------------------------------
# On SimOrdersBus, declared above: a connection factory, a JMS queue on the
# bus queue, a JMS topic on the topic space, and an activation spec listening
# on the queue - the shape a message-driven bean needs.
#
# On IBM MQ: the queue manager declared once, a factory, a queue at CELL scope
# and a cluster-scope activation spec listening on it - WAS resolves the JNDI
# name through the scopes, and the run must accept it. No queue manager runs
# in the simulation: the resources are configuration, and nothing connects.
jms:
  mq_connection:
    qmgr: SIMQM1
    transport: CLIENT
    host: mq.sim.internal
    port: 1414
    channel: SIM.APP.SVRCONN
  connection_factories:
    - name: SimOrdersCF
      jndi_name: jms/sim/ordersCF
      bus: SimOrdersBus
    - name: SimPaymentsCF
      jndi_name: jms/sim/paymentsCF
      provider: mq
      type: QCF
  queues:
    - name: SimPaymentsQueue
      jndi_name: jms/sim/payments
      provider: mq
      queue: SIM.PAYMENTS.IN
      scope: cell
    - name: SimOrdersJmsQueue
      jndi_name: jms/sim/orders
      queue: SimOrdersQueue
      bus: SimOrdersBus
  topics:
    - name: SimPricesJmsTopic
      jndi_name: jms/sim/prices
      topic_space: SimPricesTopic
      topic_name: eur
      bus: SimOrdersBus
  activation_specs:
    - name: SimOrdersAS
      jndi_name: jms/sim/ordersAS
      destination_jndi: jms/sim/orders
      bus: SimOrdersBus
      max_concurrency: 5
    - name: SimPaymentsAS
      jndi_name: jms/sim/paymentsAS
      provider: mq
      destination_jndi: jms/sim/payments
      max_concurrency: 5
