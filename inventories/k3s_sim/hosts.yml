---
# The CI simulation inventory.
#
# Group names match the real inventories - dmgr, nodeagents, was_traditional -
# so the same playbooks run unchanged. That is the whole value: CI exercises the
# production code path, not a parallel one written for testing.
#
# Connection is kubernetes.core.kubectl over pods/exec. No sshd inside the
# container image, no private key in the pipeline, nothing to rotate.

all:
  vars:
    ansible_connection: kubernetes.core.kubectl
    ansible_python_interpreter: /usr/bin/python3
    # The pods run as root, so become is both unnecessary and unavailable
    # (no sudo in a stock Rocky image).
    ansible_become: false

  children:

    was_traditional:
      children:

        dmgr:
          hosts:
            was-dmgr-01:
              ansible_kubectl_namespace: was-sim-dmgr
              ansible_kubectl_pod: was-dmgr-01

        nodeagents:
          hosts:
            was-node-01:
              ansible_kubectl_namespace: was-sim-nodeagents
              ansible_kubectl_pod: was-node-01
            was-node-02:
              ansible_kubectl_namespace: was-sim-nodeagents
              ansible_kubectl_pod: was-node-02
