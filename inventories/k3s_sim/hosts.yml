---
# The CI simulation inventory.
#
# Group names match the real inventory - an environment group crossed with role
# groups - so the same playbooks and the same host patterns work unchanged:
#
#     hosts: "{{ was_environment | lower }}:&dmgr"
#
# That is the whole value: CI exercises the production code path, not a
# parallel one written for testing.
#
# Connection is kubernetes.core.kubectl over pods/exec. No sshd inside the
# container image, no private key in the pipeline, nothing to rotate.

all:
  vars:
    ansible_connection: kubernetes.core.kubectl
    ansible_python_interpreter: /usr/bin/python3
    # The pods run as root, so become is both unnecessary and unavailable -
    # there is no sudo in a stock Rocky image.
    ansible_become: false

  children:

    # The environment group name is the survey answer in lowercase - here SIM,
    # declared in group_vars/all/10_environment.yml. Machine names are this
    # inventory's own; nothing in the collection composes or assumes them.
    sim:
      hosts:
        was-dmgr-01:
          ansible_kubectl_namespace: was-sim-dmgr
          ansible_kubectl_pod: was-dmgr-01
        was-node-01:
          ansible_kubectl_namespace: was-sim-nodeagents
          ansible_kubectl_pod: was-node-01
        was-node-02:
          ansible_kubectl_namespace: was-sim-nodeagents
          ansible_kubectl_pod: was-node-02

    dmgr:
      hosts:
        was-dmgr-01: {}

    nodeagents:
      hosts:
        was-node-01: {}
        was-node-02: {}
