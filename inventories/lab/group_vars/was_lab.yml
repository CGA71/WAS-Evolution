---
# WebSphere Application Server for Developers v9.0.5.
#
# "for Developers" is an edition, not a different product: it installs through
# the same Installation Manager and differs only by its offering id and its
# licence. The role discovers that id from the repository rather than
# hardcoding it, so this file does not need to know it.
#
# Media staged here on the VM, by hand - see the README. Neither artefact can
# be downloaded without an IBMid.
# The media directories themselves come from 25_install_dirs.yml, like every
# other installation directory. Only what is specific to this lab is here: the
# archive sits on the controller, so the role stages it across.
im_media_src: "/mnt/binaries/IBM/install_im/*.zip"
was_media_src: "/mnt/binaries/IBM/install_was90/*.zip"

# 9.0.0.0 is what the base Developers install yields. The 9.0.5.x level comes
# from the fix pack, which is a separate job.
was_expected_version: "9.0.0.0"

was_node_name: "LabNode01"
was_service_name: wasserver
