---
# The federated node role, on whichever machines the nodeagents group names.
#
# This is what produces the node agent, and it is also where the cluster member
# lives - a cluster member IS an application server, created on a federated
# node and owned by the cell.

was_service_name: wasnode

# The deployment manager is NOT named here. profile_nodeagent resolves it from
# groups['dmgr'] and reads the SOAP port the created profile actually got, which
# is the one thing that cannot disagree with reality. was_dmgr_host in the
# estate inventory is read by nothing and is not repeated here.

# --------------------------------------------------------------------------
# Names
# --------------------------------------------------------------------------
# manageprofiles -profileName for the managed template. AppSrv01 is also the
# role pattern; it is written out so the file names every object it creates
# rather than half of them.
was_profile_name: "AppSrv01"

# manageprofiles -nodeName. The role pattern derives this from the machine
# name (was-lab-01-nodeNode here), which reads like an accident. The lab names
# it from the environment and an index instead.
was_node_name: "{{ was_env_upper }}Node01"

# The application server. In an ND cell an application server that belongs to a
# cluster is a cluster member, so this one name is both: it is what
# manageprofiles never creates and what the cluster job creates on this node.
#
# This is deliberately the SAME string the role pattern produces
# (cluster_node_index). Writing it out names the object this inventory creates
# instead of leaving it implicit - and because it matches the pattern, raising
# the member count below still works: the model only refuses a count above 1
# when the single name imposed is one the pattern would NOT have produced, and
# then it says to declare was_cluster_member_names instead.
was_cluster_member_name: "{{ was_cluster_name }}_{{ was_node_name }}_01"

# --------------------------------------------------------------------------
# How many application servers on this node
# --------------------------------------------------------------------------
# VERTICAL is this number; HORIZONTAL is how many hosts the nodeagents group
# holds. The lab has one VM, so one host, so one line in that group: a vertical
# cluster is the only kind it can grow, and it grows by raising this.
#
# One is the lab default because one JVM is what a 6 Gi VM carries comfortably
# while WAS itself is also running a deployment manager on it. Answer
# "Application servers per node" in the survey to go higher for a run - the
# survey is an extra var and outranks this file.
#
# Two members on one node means two JVMs claiming ports, so the module passes
# genUniquePorts=true and WAS allocates the second one its own. Pin them
# instead with was_cluster_member_ports when the plugin or a firewall needs a
# predictable port:
#
#   was_cluster_member_ports:
#     "{{ was_cluster_name }}_{{ was_node_name }}_02":
#       WC_defaulthost: 9082
was_cluster_members_per_node: 1

# --------------------------------------------------------------------------
# Ports
# --------------------------------------------------------------------------
# A different base from the deployment manager, because in this lab both
# profiles live on one machine. 100 apart is well clear of the dozen or so
# ports each template allocates.
was_base_port: "{{ was_lab_node_base_port }}"
