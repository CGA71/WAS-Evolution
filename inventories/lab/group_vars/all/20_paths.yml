---
# Same layout as the real inventory. cloud-init pre-creates /app, /mnt/binaries
# and /opt/exploit and gives them to the ansible account, so the install roles
# do not have to invent a layout.
was_app_base_dir: /app
was_binaries_base_dir: "{{ was_app_base_dir }}/binaries"
was_profiles_base_dir: "{{ was_app_base_dir }}/profiles"
was_logs_base_dir: "{{ was_app_base_dir }}/logs"
was_data_base_dir: "{{ was_app_base_dir }}/data"
was_dump_base_dir: "{{ was_app_base_dir }}/dump/was"

was_install_binaries_base_dir: /mnt/binaries
was_backup_base_dir: /backup

was_exploit_base_dir: /opt/exploit
was_exploit_scripts_dir: "{{ was_exploit_base_dir }}/scripts"
was_jython_dir: "{{ was_exploit_base_dir }}/scripts/{{ site_jython_dirname }}"

im_installer_dir: "{{ was_binaries_base_dir }}/InstallationManager"
im_installer_cmd: "{{ im_installer_dir }}/eclipse/tools/imcl"
im_shared_resources_dir: "{{ was_binaries_base_dir }}/IMShared"
im_data_dir: "{{ was_data_base_dir }}/IM/workspace"
im_install_log_dir: "{{ was_logs_base_dir }}/IM"

was_version_short: "90"
was_home: "{{ was_binaries_base_dir }}/was{{ was_version_short }}"
was_manageprofiles_cmd: "{{ was_home }}/bin/manageprofiles.sh"
was_managesdk_cmd: "{{ was_home }}/bin/managesdk.sh"
was_jdbc_provider_dir: "{{ was_home }}/jdbcprovider"

was_profile_name: "AppSrv01"
was_profile_path: "{{ was_profiles_base_dir }}/{{ was_profile_name }}"
was_dmgr_profile_name: "Dmgr_{{ was_env_upper }}_{{ was_channel_name }}"
was_dmgr_profile_path: "{{ was_profiles_base_dir }}/{{ was_dmgr_profile_name }}"

systemd_base_dir: /usr/lib/systemd/system
