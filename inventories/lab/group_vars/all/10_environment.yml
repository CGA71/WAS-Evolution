---
# No default on purpose.
#
# The environment is an answer to the workflow survey question, not a value
# baked into an inventory. Leaving a default here would mean a run with no
# answer silently builds one particular environment, which is exactly the
# confusion this removes.
#
# The model role refuses to continue when was_environment is undefined and
# says where it is meant to come from.
#
#   AWX  : workflow survey, target environment
#   shell: ansible-playbook ... -e was_environment=<code>

# The channel keeps a default: it is a second, independent input and the lab
# only ever exercises one.
was_channel: Extranet

# The lab has no environment group, deliberately: hosts.yml declares the role
# group only, because the same VM can be built as any environment. So the
# check that the inventory holds hosts for the chosen code does not apply
# here - it is a check for the estate inventory, where the groups exist.
model_require_hosts: false
