---
# Phase 1. The lab exists to prove the traditional install plane.
runtime:
  product: traditional
  jdk:
    version: 8
    vm: j9

# Overridden on purpose, to prove the override path: the model role honours a
# name that is already defined and only falls back to its own pattern.
was_console_label: "{{ was_channel_name }} {{ was_env_upper }} lab"

was_base_port: 30000
was_dmgr_soap_port: "{{ was_base_port | int + 5 }}"
was_server_base_port: "{{ was_base_port | int - 20000 }}"
