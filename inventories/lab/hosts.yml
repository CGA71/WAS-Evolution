---
# The install lab: one KubeVirt VM.
#
# NO environment group here. The environment is not a property of this host and
# never was: the same VM can be built as RIT, RA, RU or PRD, and which one it
# is decides the cell name, the profile names and the ports - nothing about
# where the machine lives.
#
# It is therefore supplied at launch, by the "Give an environment" question on
# the workflow survey. The host pattern is just the role group.
#
# AWX job pods run inside the cluster, so the service name resolves without a
# Route. From the node itself, pass -e ansible_host=<vm ip>.

all:
  children:

    was_lab:
      hosts:
        was-lab-01:
          ansible_host: was-lab-01.was-lab.svc.cluster.local
