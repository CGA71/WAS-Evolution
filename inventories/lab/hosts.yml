---
# The install lab: one KubeVirt VM, reached by its in-cluster service name.
#
# AWX job pods run inside the cluster, so the service name resolves without a
# Route and without exposing the VM outside. From the node itself, use the VM
# address that ci/k3s/make-lab-vm.sh prints.
#
# The environment group is rit, so every derived name matches what the real RIT
# inventory produces and the two are comparable.

all:
  children:

    rit:
      hosts:
        was-lab-01:
          ansible_host: was-lab-01.was-lab.svc.cluster.local

    was_lab:
      hosts:
        was-lab-01: {}
