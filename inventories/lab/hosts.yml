---
# The install lab: one KubeVirt VM, three inventory entries.
#
# NO environment group here. The environment is not a property of this host and
# never was: the same VM can be built as any environment, and which one it is
# decides the cell name, the profile names and the ports - nothing about where
# the machine lives.
#
# It is therefore supplied at launch, from the workflow survey question for the
# target environment. The host pattern is just the role group.
#
# The machine name below is this inventory's own, like every machine name in
# this repository. The collection reads it and composes nothing from it.
#
# AWX job pods run inside the cluster, so the service name resolves without a
# Route. From the node itself, pass -e ansible_host=<vm ip>; all three entries
# are the same machine, so one override is right for all of them.
#
# WHY THREE ENTRIES FOR ONE MACHINE
#
# An ND cell is a deployment manager plus at least one federated node, and this
# lab owns exactly one VM, so both profiles land on it. Ansible expresses "one
# machine playing two roles" with two inventory entries pointing at the same
# ansible_host - not with one entry in two groups, which would be the obvious
# shortcut and does not work here:
#
#   * roles/model/tasks/naming.yml decides the profile name and the node name
#     from group membership. A host in dmgr AND nodeagents is a deployment
#     manager as far as that decision goes, so the federated profile would be
#     named after the deployment manager and federation would fail on a node
#     name that already exists in the cell.
#   * group_vars/dmgr.yml and group_vars/nodeagents.yml both set
#     was_profile_path and was_service_name. On a host in both groups one
#     silently wins by alphabetical group order.
#
#   was-lab-01        the machine. Installs Installation Manager, WAS and the
#                     fix packs - once, because imcl takes a lock and two
#                     parallel installs on one machine contend for it.
#   was-lab-01-dmgr   the same machine, wearing the deployment manager role.
#   was-lab-01-node   the same machine, wearing the federated node role. This
#                     is what produces the node agent and carries the cluster
#                     member, which is the application server.

all:
  children:

    # Installation target. One entry on purpose - see above.
    was_lab:
      hosts:
        was-lab-01:
          ansible_host: was-lab-01.was-lab.svc.cluster.local

    # Deployment manager. Reached by lab_create_profiles.yml and by the
    # cluster job, which runs wsadmin against the deployment manager profile.
    dmgr:
      hosts:
        was-lab-01-dmgr:
          ansible_host: was-lab-01.was-lab.svc.cluster.local

    # Federated nodes. One here; an estate has one entry per machine.
    nodeagents:
      hosts:
        was-lab-01-node:
          ansible_host: was-lab-01.was-lab.svc.cluster.local
