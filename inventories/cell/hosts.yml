---
# A WAS cell on the k3s cluster: one deployment manager and two federated
# nodes, each its own KubeVirt virtual machine, built end to end by the AWX
# workflow "WAS cell - deployment manager and two federated nodes".
#
# NO environment group here, as in the lab: the environment and the channel are
# launch inputs, from the workflow survey. They decide the cell, profile, node,
# cluster and member names; nothing below does.
#
# The machine names are this inventory's own - the platform role creates the
# virtual machines under these names, and the model derives each node's name
# from its inventory name (<host>Node). Each machine is reached by the DNS name
# of its headless Service, which resolves from the AWX job pods and from the
# other machines alike.
#
#   media_source   the install lab VM, which holds the WAS repository IBM
#                  serves behind an IBMid; the cell's machines copy it from
#                  there (playbooks/cell_media.yml).

all:
  children:

    # Every machine of the cell: created by job 1, given the media by job 2,
    # Installation Manager and WAS by jobs 3 and 4.
    was_install:
      hosts:
        was-cell-dmgr:
          ansible_host: was-cell-dmgr.was-cell.svc.cluster.local
          platform_vm_name: was-cell-dmgr
          platform_vm_cores: 2
          platform_vm_memory: 4Gi
          platform_vm_disk: 30Gi
        was-cell-node-01:
          ansible_host: was-cell-node-01.was-cell.svc.cluster.local
          platform_vm_name: was-cell-node-01
          platform_vm_cores: 2
          platform_vm_memory: 4Gi
          platform_vm_disk: 30Gi
        was-cell-node-02:
          ansible_host: was-cell-node-02.was-cell.svc.cluster.local
          platform_vm_name: was-cell-node-02
          platform_vm_cores: 2
          platform_vm_memory: 4Gi
          platform_vm_disk: 30Gi

    # The deployment manager profile.
    dmgr:
      hosts:
        was-cell-dmgr:

    # The federated nodes: one node agent and one cluster member each - a
    # horizontal cluster of two.
    nodeagents:
      hosts:
        was-cell-node-01:
        was-cell-node-02:

    # Where the media comes from. Read only: it is archived and served there,
    # nothing on it is installed or changed.
    media_source:
      hosts:
        was-lab-01:
          ansible_host: was-lab-01.was-lab.svc.cluster.local
          platform_vm_namespace: was-lab
          platform_vm_name: was-lab-01
