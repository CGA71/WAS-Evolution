---
# ONE inventory for every environment.
#
# The environment is an INPUT, not a directory. It arrives as the variable
# was_environment, supplied at launch by the AWX Survey, and the plays build
# their host pattern from it:
#
#     hosts: "{{ was_environment | lower }}:&dmgr"
#
# which is the intersection of an environment group and a role group. Every
# host therefore belongs to two groups: one naming where it lives, one naming
# what it does.
#
# This replaces an earlier shape with four near-identical inventory
# directories. Four copies of the same site facts is four chances to drift;
# one inventory with the environment as a parameter has none.
#
# The Liberty plane does NOT appear here. Its inventory is localhost: the job
# runs inside the Execution Environment and talks to the OpenShift API.

all:
  children:

    # ---- environments ------------------------------------------------------
    # Per-environment values live in group_vars/<name>.yml, which is Ansible's
    # own mechanism for exactly this and needs no extra machinery.

    rit:
      hosts:
        rit-dmgr-01: {}
        rit-was-01: {}
        rit-ihs-01: {}

    ra:
      hosts:
        ra-dmgr-02: {}
        ra-was-01: {}
        ra-ihs-01: {}

    ru:
      hosts:
        ru-dmgr-02: {}
        ru-was-01: {}
        ru-ihs-01: {}

    prd:
      hosts:
        prd-dmgr-02: {}
        prd-was-01: {}
        prd-ihs-01: {}

    # ---- roles -------------------------------------------------------------

    dmgr:
      hosts:
        rit-dmgr-01: {}
        ra-dmgr-02: {}
        ru-dmgr-02: {}
        prd-dmgr-02: {}

    nodeagents:
      hosts:
        rit-was-01: {}
        rit-ihs-01: {}
        ra-was-01: {}
        ra-ihs-01: {}
        ru-was-01: {}
        ru-ihs-01: {}
        prd-was-01: {}
        prd-ihs-01: {}

    ihs:
      hosts:
        rit-ihs-01: {}
        ra-ihs-01: {}
        ru-ihs-01: {}
        prd-ihs-01: {}
