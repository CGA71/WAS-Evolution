---
# ONE inventory for every environment.
#
# Two things are declared here and NOWHERE else: the machine names, and which
# groups each machine belongs to. The collection composes no hostname and
# assumes no hostname shape - it reads what this file says. An earlier version
# of this file carried a former client's naming standard (ln + environment
# letter + role + index), which looked like a rule the code could rely on and
# was never ours to keep.
#
# The environment is an INPUT, not a directory. It arrives as the variable
# was_environment, supplied at launch by the AWX survey, and the plays build
# their host pattern from it:
#
#     hosts: "{{ was_environment | lower }}:&dmgr"
#
# the intersection of an environment group and a role group. Every host
# therefore belongs to two groups: one naming where it lives, one naming what
# it does.
#
# THE CONTRACT
#
#   1. One group per environment, named EXACTLY the survey answer in
#      lowercase. Answer with a code, and the group is that code in lower
#      case. The model
#      role refuses an answer with no matching group and lists the groups it
#      found, so a typo fails at the gate instead of building nothing.
#   2. Machine names are whatever this site calls its machines. Short names or
#      FQDNs both work; site_dns_domain in group_vars/all/00_site.yml is
#      appended where a fully qualified name is needed.
#   3. Per-environment values go in group_vars/<group name>.yml. See
#      group_vars/README.md for what belongs there.
#
# The Liberty plane does NOT appear here. Its inventory is localhost: the job
# runs inside the Execution Environment and talks to the OpenShift API.
#
# The names below are placeholders. Replace them - including the environment
# group name - with this site's own.

all:
  children:

    # ---- environments ------------------------------------------------------
    # One block per environment. Add as many as this site runs; nothing in the
    # collection needs to know their names.

    envcode:
      hosts:
        dmgr-01: {}
        app-01: {}
        web-01: {}

    # ---- roles -------------------------------------------------------------
    # What each machine does. A machine appears in exactly one role group and
    # in exactly one environment group.

    dmgr:
      hosts:
        dmgr-01: {}

    nodeagents:
      hosts:
        app-01: {}

    ihs:
      hosts:
        web-01: {}
