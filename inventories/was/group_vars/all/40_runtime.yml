---
# Runtime defaults. An environment moving along the trajectory overrides this
# in its own group_vars/<environment>.yml - see group_vars/README.md.
#
# This is the single switch that decides which back-end runs: wsadmin modules,
# or render plus kubernetes.core. The model role refuses an invalid
# product / JDK pair at render time.

runtime:
  product: traditional
  jdk:
    version: 8
    vm: j9

# WAS object names are NOT declared here any more.
#
# The cell, the profiles, the nodes, the cluster, its JVM members and the
# shared class cache are composed by roles/model/vars/naming.yml from the
# environment and the channel that arrived at launch, and published by the
# model role. They used to be written out in this file in all three
# inventories, with the cluster name hardcoded in two of them - three copies
# of one naming rule, and the disagreement only shows up as a node that will
# not federate.
#
# To override one for this site, declare it here or in the environment's own
# file: the role honours a name that is already defined and never overwrites
# it.

# Port base, offset per environment so two can share a host during a
# migration. Overridden per environment.
was_base_port: 30000
was_dmgr_soap_port: "{{ was_base_port | int + 5 }}"
was_server_base_port: "{{ was_base_port | int - 20000 }}"
