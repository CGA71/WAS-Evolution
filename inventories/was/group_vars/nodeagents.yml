---
# Node agents, in any environment. The node name is composed by the model
# role from the machine name this inventory declares.
was_service_name: wasnode

# The deployment manager of this host's environment. Resolved from the
# intersection of the environment group and the dmgr group, so adding an
# environment needs no new wiring here.
was_dmgr_host: >-
  {{ (groups[was_environment | lower] | intersect(groups['dmgr']) | first)
     ~ '.' ~ site_dns_domain }}
