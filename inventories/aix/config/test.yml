# TEST - ce qu'Installation Manager installe et met à jour, serveur par
# serveur. Voir dev.yml pour les clés.
#
# VIDE : le partage ne contient aucun fichier réponse pour TEST. Déclarer
# chaque serveur TEST ici avant de lancer le job de fix pack pour TEST -
# d'ici là, le job indique pour quel serveur il n'a pas d'entrée, et ne
# modifie rien. Par exemple :
#
#   imcl_servers:
#     ServeurAIX:
#       WASDMR:
#         profile: Was90Test
#       WAS:
#         profile: Was90TestNode
#       IHSPLG:
#         - profile: IBM HTTP Server V9.0
#           location: /usr/IBM/IHS9

imcl_level: FP9.0.5.28

imcl_servers: {}
