---
# DEV - ce qu'Installation Manager installe et met à jour, serveur par serveur.
#
# Chargé par le rôle env_config quand le formulaire répond DEV (ou DEV01,
# DEV02... : la famille décide du fichier). Lu avec group_vars/all/36_imcl.yml,
# qui contient tout ce qui est identique dans chaque environnement, et rendu à
# travers templates/imcl/. Modifier ce fichier, c'est modifier ce que DEV
# exécute.
#
# Par serveur - la clé est le serveur sur lequel le job tourne (question
# "Server" du formulaire, ou imcl_server sur l'hôte dans hosts.yml) - les
# composants qu'il porte :
#   WAS / WASDMR   profile : l'identifiant de profil Installation Manager sous
#                  lequel son WAS est enregistré
#   IHSPLG         ses instances IHS, chacune avec son plugin ou non
#                  (templates/imcl/ihsplg.xml.j2 décrit chaque clé)

# Le niveau de fix pack de DEV : une entrée de imcl_levels (36_imcl.yml), et
# un répertoire du partage, <partage>/Fixes/<niveau>.
imcl_level: FP9.0.5.28

imcl_servers:

  # Le serveur du gestionnaire de déploiement (DMGR_WAS_response_file.xml).
  DMGR:
    WASDMR:
      profile: Was90Dev

  # Nœud WAS, IHS et plugin sur un même serveur
  # (dev-was-01_WAS_Ihs_Plugins_response_file.xml).
  dev-was-01:
    WAS:
      profile: Was90DevNode
    IHSPLG:
      - profile: IBM HTTP Server V9.0
        location: /usr/IBM/IHS9
        plugin:
          profile: Web Server Plug-ins for IBM WebSphere Application Server V9.0
          location: /usr/IBM/Plugins9
