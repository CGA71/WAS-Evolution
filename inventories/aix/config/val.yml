---
# VAL - ce qu'Installation Manager installe et met à jour, serveur par serveur.
# "valid" dans les noms de répertoires du serveur. Voir dev.yml pour les clés.

imcl_level: FP9.0.5.28

imcl_servers:

  # Le serveur du gestionnaire de déploiement (val-dmgr-01_WAS_response_file.xml -
  # non photographié, déduit des autres environnements : à confirmer).
  val-dmgr-01:
    WASDMR:
      profile: Was90Val

  # Nœud WAS et un IHS sur le port 80, sans plugin
  # (val-was-01_WAS_IHS_response_file.xml).
  val-was-01:
    WAS:
      profile: Was90Val
    IHSPLG:
      - profile: IBM HTTP Server V9.0
        location: /usr/IBM/IHS9
        port: "80"

  # Le serveur IHS : cinq instances, dont trois avec plugin
  # (val-ihs-01_IHS_response_file.xml). Leur nom de service Windows est le nom
  # générique, pas celui du profil.
  val-ihs-01:
    IHSPLG:
      - profile: Ihs90Part
        location: /usr/IBM/IHS9/TPPART
        service_name: IBM HTTP Server V9.0
        port: "8081"
        plugin: {profile: Plugin90Part, location: /usr/IBM/Plugins9/TPPART}
      - profile: Ihs90Siteb
        location: /usr/IBM/IHS9/TPSITEB
        service_name: IBM HTTP Server V9.0
        port: "8080"
        plugin: {profile: Plugin90Siteb, location: /usr/IBM/Plugins9/TPSITEB}
      - profile: Ihs90WebTous
        location: /usr/IBM/IHS9/WEBTOUS
        service_name: IBM HTTP Server V9.0
        port: "8082"
        plugin: {profile: Plugin90WebTous, location: /usr/IBM/Plugins9/WEBTOUS}
      - profile: Ihs90Dispatcher
        location: /usr/IBM/IHS9/DISPATCHER
        service_name: IBM HTTP Server V9.0
        port: "8081"
      - profile: Ihs90Esb
        location: /usr/IBM/IHS9/ESB
        service_name: IBM HTTP Server V9.0
        port: "8081"

  # L'IHS de l'ESB seul (Ihs_Esb_response_file.xml, vérifié sur le serveur le
  # 21 novembre 2026). Le partage ne dit pas sur quel serveur il tourne : la clé reste
  # le nom du fichier tant qu'on ne le sait pas.
  Ihs_Esb:
    IHSPLG:
      - profile: Ihs90Esb
        location: /usr/IBM/IHS9/ESB
        service_name: IBM HTTP Server V9.0
        port: "8081"
