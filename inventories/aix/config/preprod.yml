---
# PREPROD - what Installation Manager installs and updates, server by server.
# See dev.yml for the keys.

imcl_level: FP9.0.5.28

# The multi-site IHS servers name each instance Ihs<site>90Preprod and its
# plugin Plugin<site>90Preprod: the "site:" short form of ihsplg.xml.j2.
imcl_ihs_profile_suffix: Preprod

imcl_servers:

  # The deployment manager's server (pp-dmgr-01_WAS_response_file.xml).
  pp-dmgr-01:
    WASDMR:
      profile: Was90PreProd

  # WAS node and IHS (pp-was-01_WAS_response_file.xml).
  pp-was-01:
    WAS:
      profile: Was90PreProd
    IHSPLG:
      - profile: IBM HTTP Server V9.0
        location: /usr/IBM/IHS9

  # WAS node and IHS (pp-was-02_WAS_response_file.xml). Was90Prod, not
  # Was90PreProd: as on the server. If that is the profile its WAS is
  # registered under, it must stay - check with
  #   imcl listInstalledPackages -long
  pp-was-02:
    WAS:
      profile: Was90Prod
    IHSPLG:
      - profile: IBM HTTP Server V9.0
        location: /usr/IBM/IHS9

  # Multi-site IHS server (pp-ihs-01_IHS_PLUGINS_response_file.xml).
  pp-ihs-01:
    IHSPLG:
      - site: SITEA
      - site: AUDIENS
      - site: B2V
      - site: GREFAC
      - site: LOURMEL
      - site: NHCBTP
      - site: SITEB
      - site: SICAP
      - site: Ged

  # Multi-site IHS server (pp-ihs-02_IHS_PLUGINS_response_file.xml). STATRES
  # has no plugin there.
  pp-ihs-02:
    IHSPLG:
      - site: SITEA
      - site: AUDIENS
      - site: B2V
      - site: CRP
      - site: GREFAC
      - site: KORELIO
      - site: LOURMEL
      - site: SITEB
      - site: SEVEANE
      - site: SICAP
      - site: STATRES
        plugin: false
      - site: VRF
