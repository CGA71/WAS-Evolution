---
# PREPROD - ce qu'Installation Manager installe et met à jour, serveur par
# serveur. Voir dev.yml pour les clés.

imcl_level: FP9.0.5.28

# Les serveurs IHS multi-sites nomment chaque instance Ihs<site>90Preprod et
# son plugin Plugin<site>90Preprod : c'est la forme courte "site:" de
# ihsplg.xml.j2.
imcl_ihs_profile_suffix: Preprod

imcl_servers:

  # Le serveur du gestionnaire de déploiement (pp-dmgr-01_WAS_response_file.xml).
  pp-dmgr-01:
    WASDMR:
      profile: Was90PreProd

  # Nœud WAS et IHS (pp-was-01_WAS_response_file.xml).
  pp-was-01:
    WAS:
      profile: Was90PreProd
    IHSPLG:
      - profile: IBM HTTP Server V9.0
        location: /usr/IBM/IHS9

  # Nœud WAS et IHS (pp-was-02_WAS_response_file.xml). Was90Prod et non
  # Was90PreProd : comme sur le serveur. Si c'est bien le profil sous lequel
  # son WAS est enregistré, il doit rester ainsi - à vérifier avec
  #   imcl listInstalledPackages -long
  pp-was-02:
    WAS:
      profile: Was90Prod
    IHSPLG:
      - profile: IBM HTTP Server V9.0
        location: /usr/IBM/IHS9

  # Serveur IHS multi-sites (pp-ihs-01_IHS_PLUGINS_response_file.xml).
  pp-ihs-01:
    IHSPLG:
      - site: SITEA
      - site: AUDIENS
      - site: B2V
      - site: GREFAC
      - site: LOURMEL
      - site: NHCBTP
      - site: SITEB
      - site: SICAP
      - site: Ged

  # Serveur IHS multi-sites (pp-ihs-02_IHS_PLUGINS_response_file.xml). STATRES
  # n'y a pas de plugin.
  pp-ihs-02:
    IHSPLG:
      - site: SITEA
      - site: AUDIENS
      - site: B2V
      - site: CRP
      - site: GREFAC
      - site: KORELIO
      - site: LOURMEL
      - site: SITEB
      - site: SEVEANE
      - site: SICAP
      - site: STATRES
        plugin: false
      - site: VRF
