---
# PROD - ce qu'Installation Manager installe et met à jour, serveur par
# serveur. Voir dev.yml pour les clés. Un lancement sur PROD exige toujours la
# confirmation de production du formulaire.

imcl_level: FP9.0.5.28

imcl_servers:

  # Le serveur du gestionnaire de déploiement (prod-dmgr-01_WAS_response_file.xml).
  prod-dmgr-01:
    WASDMR:
      profile: Was90Prod

  # Nœud WAS et IHS (prod-was-01_WAS_response_file.xml).
  prod-was-01:
    WAS:
      profile: Was90Prod
    IHSPLG:
      - profile: IBM HTTP Server V9.0
        location: /usr/IBM/IHS9

  # Nœud WAS et IHS (prod-was-02_WAS_response_file.xml).
  prod-was-02:
    WAS:
      profile: Was90Prod
    IHSPLG:
      - profile: IBM HTTP Server V9.0
        location: /usr/IBM/IHS9

  # Nœud WAS, l'IHS de la GED sur le port 8081 et son plugin
  # (prod-was-03_WAS_IHS_PLUGIN_response_file.xml).
  prod-was-03:
    WAS:
      profile: Was90Prod
    IHSPLG:
      - profile: IhsGed90Prod
        location: /usr/IBM/IHS9
        service_name: IBM HTTP Server V9.0
        port: "8081"
        plugin: {profile: PluginGed90Prod, location: /usr/IBM/Plugins9}
