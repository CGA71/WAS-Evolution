---
# How Ansible reaches ServeurAIX.
#
# The private key is supplied by the AWX Machine Credential, by --private-key
# on a command-line run, or by the CI variable AIX_SSH_PRIVATE_KEY. It is never
# named here.
# THE CONNECTING ACCOUNT IS NOT SET HERE. It is the username of the AWX
# Machine credential - and only as long as no inventory sets ansible_user,
# which would outrank it. On a command line: -u <account>; in the pipeline:
# the CI variable AIX_SSH_USER. It is not the owner of WebSphere (was,
# 00_site.yml): it connects, then reaches root through sudo su -.

# AIX ships no Python 3 in the base system. The AIX Toolbox for Open Source
# Software installs it under /opt/freeware, together with the other tools the
# roles call: sudo, bash, unzip and zipinfo (ansible.builtin.unarchive needs
# both), GNU tar and gzip. Interpreter discovery does not look there, so it is
# named explicitly.
ansible_python_interpreter: /opt/freeware/bin/python3

# Privilege escalation - was, or root - is the collection's
# (playbooks/group_vars/all.yml); the AWX web front overrides it (awx_web.yml).

# /tmp on AIX is often a small filesystem; Ansible's temporary files go under
# the account's home instead - on the hosts that become nobody but root. The
# collection overrides this with /tmp for every play
# (playbooks/group_vars/all.yml): was cannot reach the connecting account's home.
ansible_remote_tmp: "~/.ansible/tmp"
