---
# Installation directories. Every one of them, in one place, as they ARE on
# ServeurAIX - and on every server of the site, where they are always the same:
#
#   /usr/IBM/WebSphere9/Imcl         Installation Manager      was:was
#   /usr/IBM/WebSphere9/AppServer    WAS ND, profiles below    was:was
#   /usr/IBM/WebSphere9/certificats  the site's certificates   was:was
#   /usr/IBM/IHS9                    IBM HTTP Server           root:system
#   /usr/IBM/Plugins9                the plugin, where installed
#   /usr/IBM/WebSphere               the home directory of was - not a product
#
# The shared resources of Installation Manager are
# /usr/IBM/WebSphere9/Imcl/IMShared: the sharedLocation of every response file
# (36_response_files.yml).
#
# Each entry names the Installation Manager or WAS flag it feeds, so the
# mapping between an inventory variable and what IBM actually does with it is
# written down rather than inferred from the role.
#
#   variable                   flag / meaning
#   -------------------------  ------------------------------------------------
#   im_installer_dir           installc -installationDirectory
#                              where Installation Manager itself lives
#   im_shared_resources_dir    imcl -sharedResourcesDirectory. Empty: not passed
#   im_agent_data_dir          imcl -dataLocation. Empty: not passed
#   im_install_log_dir         imcl -log
#   im_preferences_dir         imcl -preferences. Empty: not passed
#   was_home                   imcl -installationDirectory for WAS
#   was_profiles_base_dir      manageprofiles -profilePath parent
#   ihs_home                   imcl -installationDirectory for IHS
#   plugin_home                imcl -installationDirectory for the plugin

# --- IBM Installation Manager --------------------------------------------

im_installer_dir: "{{ was_binaries_base_dir }}/Imcl"
im_installer_cmd: "{{ im_installer_dir }}/eclipse/tools/imcl"

# EMPTY ON PURPOSE, both of them.
#
# Installation Manager is already installed here, and it recorded its agent
# data (the registry of everything it installed) and its shared resources
# directory at that first install - normally /var/ibm/InstallationManager and
# a directory fixed for good. Passing other values would not move them: a
# different -dataLocation points imcl at an EMPTY registry, where WAS, IHS and
# the plugin do not exist, and it would try to install them again. Left empty,
# the flags are not passed and imcl uses what it recorded.
#
# Where it recorded them, on the server:
#   grep cic.appDataLocation /usr/IBM/WebSphere9/Imcl/eclipse/configuration/config.ini
#   imcl listInstalledPackages -long     (and the preferences for the shared dir)
im_agent_data_dir: ""
im_shared_resources_dir: ""

# EMPTY ON PURPOSE: imcl -log is not passed, and Installation Manager keeps its
# logs where it always has - in its own data location (logs/ under it), which
# is where the site already looks. Set a directory here only to get one extra
# log file per run (install_was.log, fixpack_products.log...) in it.
im_install_log_dir: ""

# im_unpack_dir is not set here: it only serves a FIRST install of
# Installation Manager, which this server will not have, and the role's own
# default (/tmp/im-installer) is fine for that case.

# Optional. Empty means Installation Manager's own defaults.
im_preferences_dir: ""

# --- WebSphere Application Server -----------------------------------------

was_home: "{{ was_binaries_base_dir }}/AppServer"
was_manageprofiles_cmd: "{{ was_home }}/bin/manageprofiles.sh"
was_managesdk_cmd: "{{ was_home }}/bin/managesdk.sh"

# Each profile below it is its own filesystem on this server
# (.../profiles/<profile name>), created by the system administrator before
# manageprofiles runs.
was_profiles_base_dir: "{{ was_home }}/profiles"

# --- IBM HTTP Server and the web server plugin ----------------------------
# Two roles, two jobs:
#   ihs_install      playbooks/lab_install_ihs.yml      -> ihs_home
#   plugin_install   playbooks/lab_install_plugin.yml   -> plugin_home

ihs_home: /usr/IBM/IHS9
plugin_home: /usr/IBM/Plugins9

# --- Where the IBM media is staged ----------------------------------------
# On the binaries share (20_paths.yml). Read only for a new installation.

# The site's layout of the share - see 20_paths.yml.
im_media_dir: "{{ was_install_binaries_base_dir }}/Imcl"
was_media_dir: "{{ was_install_binaries_base_dir }}/WasND"
# The "WAS 9.0 Supplements" repository: IHS, the plugin and the WebSphere
# Customization Tools - one repository for both roles. The Java SDK they need
# is its own repository here, SdkJava8.
ihs_media_dir: "{{ was_install_binaries_base_dir }}/Supplement"
plugin_media_dir: "{{ ihs_media_dir }}"
ihs_sdk_media_dir: "{{ was_install_binaries_base_dir }}/SdkJava8"
plugin_sdk_media_dir: "{{ ihs_sdk_media_dir }}"

# ONE fix pack level, not the whole Fixes directory: it holds every level the
# site ever applied (FP9.0.5.13 ... FP9.0.5.29), and handing them all to
# imcl updateAll installs the highest one it finds. The level is the one the
# response files are written for (36_response_files.yml).
was_fixpack_media_dir: "{{ was_install_binaries_base_dir }}/Fixes/{{ imcl_response_files_level }}"

# --- Free space checked before an install or a fix pack -------------------
# On the filesystems that receive the binaries, not on /usr/IBM/WebSphere9,
# which is a directory of the /usr/IBM filesystem. In MB.
forge_min_free_mb:
  "{{ was_home }}": 6144
  "{{ ihs_home }}": 1024
  "{{ plugin_home }}": 512
  "{{ was_logs_base_dir }}": 2048
