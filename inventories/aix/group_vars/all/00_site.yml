---
# Site facts for the AIX server.
#
# THE BINARIES SHARE - PRIMORDIAL. The IBM media - the Installation Manager
# archive, the WAS, IHS and plugin repositories, the fix packs - lives on an
# NFS share mounted on ServeurAIX at was_install_binaries_base_dir
# (20_paths.yml). Nothing can be installed or patched without it.
#
#   binaries_mount.yml        MOUNTS it (role binaries_share, through sudo) and
#                             writes its /etc/filesystems stanza. First job of
#                             the AWX workflow (0a) and of the pipeline
#                             (aix:share).
#   binaries_mount_check.yml  then VERIFIES it: mounted, of this type,
#                             readable, carrying the media.
#
# The site's export, as <server>:<export>: the NIM server's WAS 9 media. By
# hand, the same mount reads, as root:
#   mount nfs-server:/export/was90 /tmp/wasinst
# This is what binaries_mount.yml mounts, on was_install_binaries_base_dir.
site_binaries_repository: "nfs-server:/export/was90"
# nfs to mount it; jfs2 (a local filesystem) or none: nothing to mount.
site_binaries_repository_type: nfs

# The mount options (ro,bg,soft,intr by default) and the persistence are in
# roles/binaries_share/defaults/main.yml, e.g.
#   binaries_share_options: "ro,bg,soft,intr,vers=3"

# The AIX account that owns the installation and runs the processes, and the
# one Ansible connects as. It needs sudo (AIX Toolbox) for the tasks that
# become root - Installation Manager's administrator install, the directory
# layout, the user limits.
#
# The group is the one /usr/IBM/IHS9, Plugins9 and WebSphere9 belong to on the
# server. The account is the one that owns them: check with
#   ls -ld /usr/IBM/WebSphere9 /usr/IBM/IHS9
# prereqs_os gives the directories of 20_paths.yml to this account and group.
site_was_user: wasadmin
site_was_group: was
site_jython_dirname: jython-ansible
