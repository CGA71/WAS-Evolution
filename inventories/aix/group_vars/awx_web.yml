---
# The web front of AWX, for the certificate portal only.
#
# The AWX API URL decides the host name the portal is served on - the same
# origin as AWX, so the browser sends the viewer's AWX session. A placeholder:
# use the URL of the AWX this site runs.
awx_api_url: https://awx.example.internal/api/v2/

# Which web server fronts it (nginx or httpd), and the directory it serves at
# /wasevo/certificates/. See roles/platform/certificate_portal/defaults/main.yml.
certportal_web_server: nginx
certportal_web_root: /var/www/wasevo/certificates

# Not the WAS account: this is another machine.
ansible_user: "{{ awx_web_user | default('ansible') }}"
ansible_python_interpreter: auto_silent

# The application portal, beside it on the same web front: served at
# /wasevo/applications/. The workflow names are the ones
# ci/awx/apply-application-workflows.sh creates.
appportal_web_server: nginx
appportal_web_root: /var/www/wasevo/applications
appportal_deploy_workflow: "WAS AIX - Application: deploy"
appportal_decommission_workflow: "WAS AIX - Application: decommission"
