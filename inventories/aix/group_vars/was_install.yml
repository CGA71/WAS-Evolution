---
# The installation entry: ServeurAIX itself, once.
#
# WebSphere Application Server is installed from the IBM media on the binaries
# mount point - see group_vars/all/20_paths.yml and 25_install_dirs.yml. On
# this server the media is NOT on the controller: the share is mounted on the
# machine, so the staging sources stay empty and the roles read the mount
# directly. Validate the mount first:
#
#   ansible-playbook -i inventories/aix \
#       ansible_collections/wasevo/websphere/playbooks/binaries_mount_check.yml
#
# Neither the Installation Manager archive nor the WAS repository can be
# downloaded without an IBMid: they are placed on the share by hand.
im_media_src: ""
was_fixpack_media_src: ""

# The level the base install must reach at least. A Passport Advantage base
# image yields 9.0.0.0 and the fix pack job lifts it; a repository that already
# carries a later level passes too - the role asserts "at least".
was_expected_version: "9.0.0.0"

# NO OBJECT NAMES HERE.
#
# This group is the INSTALLATION target - one entry, the machine itself. A WAS
# object name belongs to the role the machine plays: the node names are in
# group_vars/dmgr.yml and group_vars/nodeagents.yml, the cell and the cluster
# in group_vars/all/30_naming.yml.

# No target level declared: whatever the fix pack repositories on the mount
# offer is what the server gets. Pin it here (e.g. "9.0.5.28") once the site
# has decided its level.
was_fixpack_target_version: ""
