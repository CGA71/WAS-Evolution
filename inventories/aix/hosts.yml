---
# The AIX server: one physical machine, ServeurAIX, carrying a whole ND cell -
# a deployment manager and a federated node - three inventory entries.
#
# NO environment group here. The environment is not a property of this host:
# the same machine can be built as any environment, and which one it is decides
# the cell name, the profile names and the ports - nothing about where the
# machine lives. It is supplied at launch, from the AWX survey or from
# -e was_environment=<code>, and the playbooks that act on the deployment
# manager are run with -e config_dmgr_hosts=dmgr.
#
# The machine name below is this inventory's own, like every machine name in
# this repository. The collection reads it and composes nothing from it. Put
# the name the controller resolves - short name or FQDN - in ansible_host.
#
# WHY THREE ENTRIES FOR ONE MACHINE
#
# An ND cell is a deployment manager plus at least one federated node, and both
# profiles land on this one server. Ansible expresses "one machine playing two
# roles" with two inventory entries pointing at the same ansible_host - not with
# one entry in two groups, which would be the obvious shortcut and does not
# work here:
#
#   * roles/model/tasks/naming.yml decides the profile name and the node name
#     from group membership. A host in dmgr AND nodeagents is a deployment
#     manager as far as that decision goes, so the federated profile would be
#     named after the deployment manager and federation would fail on a node
#     name that already exists in the cell.
#   * group_vars/dmgr.yml and group_vars/nodeagents.yml both set
#     was_profile_path and was_service_name. On a host in both groups one
#     silently wins by alphabetical group order.
#
#   ServeurAIX        the machine. Installs Installation Manager, WAS and the
#                     fix packs - once, because imcl takes a lock and two
#                     parallel installs on one machine contend for it.
#   ServeurAIX-dmgr   the same machine, wearing the deployment manager role.
#   ServeurAIX-node   the same machine, wearing the federated node role. This
#                     is what produces the node agent and carries the cluster
#                     member, which is the application server.

all:
  children:

    # Installation target. One entry on purpose - see above.
    was_install:
      hosts:
        ServeurAIX:
          ansible_host: ServeurAIX

    # Deployment manager. Reached by lab_create_profiles.yml and by the
    # cluster job, which runs wsadmin against the deployment manager profile.
    dmgr:
      hosts:
        ServeurAIX-dmgr:
          ansible_host: ServeurAIX

    # Federated nodes. One here; a second AIX server would be a second entry.
    nodeagents:
      hosts:
        ServeurAIX-node:
          ansible_host: ServeurAIX

    # Every entry that is the WAS server, whatever role it plays. Their
    # privilege escalation - WebSphere as was, the system as root - is
    # group_vars/was_servers.yml; awx_web below is another machine and keeps
    # its own.
    was_servers:
      children:
        was_install:
        dmgr:
        nodeagents:

    # The web server that fronts AWX's host name - AWX is hosted elsewhere.
    # Only the certificate portal job reaches it (platform_certificate_portal.yml).
    # A placeholder: put the name of that machine here.
    awx_web:
      hosts:
        awx-web: {}
