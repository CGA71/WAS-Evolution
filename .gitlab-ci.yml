---
# Three stages, in the order a WAS installation on a physical AIX server can
# go wrong, and in increasing cost:
#
#   validation   No change anywhere. The static gates - the model refuses
#                invalid product / JDK pairs and production without being
#                asked, the traditional chain works against a fake cell, the
#                portal logic holds - and, on ServeurAIX, the binaries mount
#                point: mounted, of the declared type, readable, carrying the
#                Installation Manager archive and a WAS repository; then the
#                forge preflight (filesets, AIX Toolbox commands, free space).
#   build        The product on ServeurAIX: Installation Manager, the fix
#                packs, WAS, read from the mount. Then the whole build is
#                replayed and must report changed=0 - the proof that the
#                install is idempotent, not just that it ran once.
#   deploy       The cell: a check run first, then the deployment manager and
#                the federated node, the cluster, its members, started - and
#                replayed, changed=0 again. Manual: it is a click, not a push.
#
# NOTHING HERE NEEDS KUBERNETES. The server jobs reach ServeurAIX over SSH from
# a plain Python image, with inventories/aix. They are skipped, not failed,
# when the CI variables that reach the server are absent, so a fork or a clone
# still gets the static gates.
#
# CI/CD variables (Settings > CI/CD > Variables), none of them in this file:
#
#   AIX_SSH_PRIVATE_KEY   File. The private key of the WAS account on
#                         ServeurAIX (site_ssh_user in inventories/aix).
#   AIX_SSH_KNOWN_HOSTS   File or variable. ServeurAIX's host key line(s), as
#                         ssh-keyscan prints them. Without it the key is taken
#                         on first use, and the job says so.
#   WAS_ENVIRONMENT       The environment code to build ServeurAIX as - what
#                         the AWX survey would ask: a DSI family, alone or with
#                         an instance (DEV01, VAL02...). No default, on purpose.
#   WAS_ADMIN_USER        The WAS administrative console user.
#   WAS_ADMIN_PASSWORD    Masked and protected. Written to a 0600 vars file,
#                         never to a command line.
#
# The build and deploy stages run on the default branch only, and one pipeline
# at a time (resource_group): two pipelines installing on one server contend
# for Installation Manager's lock.
#
# Versions: ci/release.sh X.Y.Z writes X.Y.Z into galaxy.yml and tags vX.Y.Z;
# a tag pipeline runs the static gates and release-version, nothing that
# changes ServeurAIX. AWX runs a tag, set by ci/awx/promote.sh.

stages:
  - validation
  - build
  - deploy

variables:
  ANSIBLE_FORCE_COLOR: "1"
  COLLECTION: ansible_collections/wasevo/websphere
  # GitLab checks out into a world-writable directory, so Ansible refuses to
  # read ansible.cfg from it - every setting in that file is silently ignored
  # here. The two that matter are therefore passed as environment variables.
  # The repository root is the collections path because it is the directory
  # that CONTAINS ansible_collections/, which is what Ansible looks for.
  ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR"
  ANSIBLE_ROLES_PATH: "$CI_PROJECT_DIR/ansible_collections/wasevo/websphere/roles"
  AIX_INVENTORY: inventories/aix
  # Only for ssh-keyscan when AIX_SSH_KNOWN_HOSTS is absent; Ansible reads the
  # host from the inventory.
  AIX_HOST: ServeurAIX

# ---------------------------------------------------------------------------
# Static checks. No server, no credentials.
# ---------------------------------------------------------------------------

.static:
  image: python:3.12-slim
  before_script:
    - pip install --quiet --no-cache-dir ansible-core ansible-lint yamllint

yamllint:
  extends: .static
  stage: validation
  script:
    - yamllint -s .

ansible-lint:
  extends: .static
  stage: validation
  script:
    - ansible-lint $COLLECTION
  # Advisory while the later-wave roles are still stubs.
  allow_failure: true

syntax:
  extends: .static
  stage: validation
  # THE ENVIRONMENT HAS TO BE PASSED, EVEN HERE. Most of these playbooks take
  # their host pattern from was_environment, because the environment is a
  # launch input rather than a directory. Ansible renders `hosts` before it
  # parses anything else, so a syntax check without that variable fails on
  # "'was_environment' is undefined" - a message about the playbook being
  # unparsable, which it is not. The value is arbitrary here: --syntax-check
  # matches no host and contacts nothing, it only has to render.
  #
  # This job was red for exactly that reason once, and a red job here keeps
  # the build and deploy stages from running.
  script:
    - ansible-playbook --syntax-check $COLLECTION/playbooks/pilot_render_matrix.yml
    - ansible-playbook --syntax-check $COLLECTION/playbooks/model_validate.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/forge_preflight.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_config.yml -e was_environment=SYNTAX
    # Each step of the traditional plane is its own playbook so it can be
    # replayed on its own, so each one is syntax-checked on its own too.
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_cluster.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_cluster_members.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_j2c.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_jdbc.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_shared_libraries.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_sibus.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_jms.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_transactions.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_ejb_container.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_cdi.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_jpa.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_ssl.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_security.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_policy_sets.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_dynamic_cache.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_logging.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_pmi.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/guard_target.yml -e was_environment=SYNTAX
    # The API families: catalogues over the steps above, one entry point each.
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/family_0_foundation.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/family_2_persistence.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/family_3_enterprise.yml -e was_environment=SYNTAX
    # The AIX server: the mount check and the install chain.
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/binaries_mount.yml
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/binaries_mount_check.yml
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/lab_install_im.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/lab_apply_fixpacks.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/lab_install_was.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/lab_install_ihs.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/lab_install_plugin.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/lab_create_profiles.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/traditional_start.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/traditional_log_root.yml -e was_environment=SYNTAX
    # Applications: deployment and every step of a decommissioning.
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/traditional_application_deploy.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check
        $COLLECTION/playbooks/traditional_application_decommission.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check
        $COLLECTION/playbooks/traditional_application_remove_node.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/family_1_web_services.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/family_6_management.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/family_4_messaging.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/family_5_extended.yml -e was_environment=SYNTAX
    # Certificates: inventory and renewal on the dmgr, the portal on AWX's web front.
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_certificates.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_certificate_renewal.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/platform_certificate_portal.yml
    # Applications: the inventory the portal reads, and the portal.
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/traditional_applications.yml -e was_environment=SYNTAX
    - ansible-playbook -i $AIX_INVENTORY --syntax-check $COLLECTION/playbooks/platform_application_portal.yml

# The environment is a launch input, so the loop passes it as one - exactly as
# the AWX survey does. There is no list of environment codes to iterate: what
# is tested is the MECHANISM, on the environment group the template inventory
# declares.
#
# Production is tested through was_environment_tier, not through a code,
# because no code is production in this collection's eyes - the tier is
# declared alongside the environment.
model-matrix:
  extends: .static
  stage: validation
  script:
    - |
      set -e
      echo "=============== the declared environment validates ==============="
      ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml         -e was_environment=ENVCODE
    - |
      echo "=============== a prod tier must be refused unacknowledged ==============="
      if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
           -e was_environment=ENVCODE -e was_environment_tier=prod; then
        echo "FAIL: production was accepted without acknowledgement"; exit 1
      fi
      echo "refused as expected"
    - |
      set -e
      echo "=============== and passes once acknowledged ==============="
      ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
        -e was_environment=ENVCODE -e was_environment_tier=prod \
        -e model_allow_production=true
    - |
      set -e
      echo "=============== blank survey names are derived, filled ones win ==============="
      # Exactly what AWX sends for optional questions left blank: "" for each.
      # An extra var named was_cell_name="" would outrank the model and empty
      # the name; the survey's names are survey_* so a blank one is ignored.
      ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
        -e '{"was_environment": "ENVCODE", "survey_was_cell_name": "", "survey_was_cluster_name": "",
             "survey_was_node_name": "", "survey_was_cluster_member_name": "",
             "survey_was_dmgr_profile_name": ""}' > survey-blank.log
      grep -q "_ENVCODE" survey-blank.log         || { echo "FAIL: a blank survey cell name was not derived"; exit 1; }
      ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
        -e was_environment=ENVCODE -e survey_was_cell_name=ImposedCell > survey-filled.log
      grep -q "ImposedCell" survey-filled.log         || { echo "FAIL: a survey cell name filled in did not win"; exit 1; }
      echo "blank names derived, a filled one imposed"
    - |
      echo "=============== an unusable code must be refused ==============="
      # Not "unknown" - any code a site uses is accepted. This one is refused
      # for its shape: a value that cannot be a WAS object name or a path.
      if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml            -e "was_environment=no pe"; then
        echo "FAIL: an unusable environment code was accepted"; exit 1
      fi
      echo "refused as expected"
    - |
      set -e
      echo "=============== environment families: a family and an instance ==============="
      # The site's families are inventory data; these two are test families,
      # never a real code. With families declared, the code must be one of
      # them, alone or with a two-digit instance, and the family decides the
      # tier.
      FAMILIES='{"was_environment_families": {"ENVCODE": {"tier": "non_prod", "long_name": "Test"},
                 "PRDCODE": {"tier": "prod", "long_name": "Prod test"}}, "model_require_hosts": false}'
      ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
        -e "$FAMILIES" -e was_environment=ENVCODE01 > family.log
      grep -q "family ENVCODE, instance 01" family.log || { echo "FAIL: ENVCODE01 was not read as ENVCODE + 01"; exit 1; }
      for refused in ENVCODE1 OTHER01 ENVCODE01X; do
        if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
             -e "$FAMILIES" -e was_environment=$refused > /dev/null 2>&1; then
          echo "FAIL: $refused was accepted although it is no family + instance"; exit 1
        fi
      done
      echo "=============== the family decides the tier ==============="
      if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
           -e "$FAMILIES" -e was_environment=PRDCODE02 > /dev/null 2>&1; then
        echo "FAIL: a production family ran without acknowledgement"; exit 1
      fi
      if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
           -e "$FAMILIES" -e was_environment=PRDCODE02 -e was_environment_tier=non_prod \
           -e model_allow_production=true > /dev/null 2>&1; then
        echo "FAIL: a production family answered as non_prod was accepted"; exit 1
      fi
      ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
        -e "$FAMILIES" -e was_environment=PRDCODE02 -e model_allow_production=true > /dev/null
      echo "families: instance read, strays refused, the tier taken from the family"
    - |
      echo "=============== an environment with no hosts must be refused ==============="
      if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml            -e was_environment=NOSUCH; then
        echo "FAIL: an environment with no hosts was accepted"; exit 1
      fi
      echo "refused as expected"
    - |
      echo "=============== the diagnostic JDK must be refused ==============="
      # The environment and the channel are passed so that this refusal is the
      # one being asserted. Without them the play fails on "no environment was
      # supplied" and the check passed for the wrong reason - a test that can
      # only succeed is not a test. Hence the grep as well as the exit code.
      if ansible-playbook $COLLECTION/playbooks/pilot_render_matrix.yml \
           -e was_environment=PILOT -e was_channel=Extranet \
           -e '{"pilot_targets": [{"file": "example_diagnostic_only.yml", "label": "the diagnostic JDK"}]}' \
           > diagnostic.log 2>&1; then
        echo "FAIL: the diagnostic JDK was accepted"; exit 1
      fi
      grep -qi "diagnostic" diagnostic.log \
        || { echo "FAIL: it was refused, but not for the diagnostic JDK:"; tail -20 diagnostic.log; exit 1; }
      echo "refused as expected, and for the right reason"

# One datasource, declared once, rendered for all three phases.
# One declared datasource, rendered into all three trajectory couples. If the
# three renders disagree, layer 1 is wrong - which is the point of doing this
# on one object in wave 0 rather than discovering it thirty modules later.
#
# The environment AND the channel are passed here. The play needs no inventory
# - it runs on localhost - but it resolves the model, and the model refuses to
# run without the two inputs that name every object it renders. Both are
# arbitrary here: what is being compared is the three renders of one object,
# not the names.
#
# They have to be passed explicitly because GitLab checks out into a
# world-writable directory, so Ansible refuses to read ansible.cfg - and
# ansible.cfg is what points at inventories/was, whose group_vars would
# otherwise supply the channel. Everything that file configures has to be an
# argument here.
pilot-render:
  extends: .static
  stage: validation
  script:
    - ansible-playbook $COLLECTION/playbooks/pilot_render_matrix.yml -e was_environment=PILOT -e was_channel=Extranet
  artifacts:
    paths: [rendered/]
    expire_in: 1 week

# The driver, the handler and the fake cell, with no server and no Ansible.
# Fast, and it catches most regressions before anything is deployed.
stub-unit:
  image: python:3.12-slim
  stage: validation
  # PyYAML and nothing else: the check that renders the shared model for WAS
  # traditional reads model/example/common.yml, and the driver, the handlers
  # and the fake cell need only the standard library. Still no Ansible here -
  # this gate stays the cheapest one.
  before_script:
    - pip install --quiet --no-cache-dir pyyaml
  script:
    - bash ci/run-stub-tests.sh

# The certificate and application portals' logic - status for today, newest report per cell,
# actions per issuer, extra vars of a launch - without a browser and without
# AWX. Node only: the page has no build step and no dependency.
portal-unit:
  image: node:22-alpine
  stage: validation
  script:
    - node ci/portal-tests.js
    - node ci/application-portal-tests.js

# A tag is a version AWX will run (ci/awx/promote.sh). ci/release.sh writes the
# version into galaxy.yml and makes the tag together; this refuses a tag made
# any other way that does not match: vX.Y.Z, X.Y.Z in galaxy.yml, and a commit
# of the default branch - a tag on an unmerged branch is code nobody reviewed.
release-version:
  image: python:3.12-slim
  stage: validation
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -e
      expr "$CI_COMMIT_TAG" : 'v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*$' > /dev/null \
        || { echo "FAIL: the tag $CI_COMMIT_TAG is not vX.Y.Z"; exit 1; }
      declared="$(sed -n 's/^version:[[:space:]]*//p' $COLLECTION/galaxy.yml | tr -d "\"' ")"
      [ "v$declared" = "$CI_COMMIT_TAG" ] \
        || { echo "FAIL: galaxy.yml says $declared, the tag says $CI_COMMIT_TAG - use ci/release.sh"; exit 1; }
      echo "galaxy.yml and the tag agree: $declared"
    - |
      set -e
      apt-get update -qq && apt-get install -y -qq git > /dev/null
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git fetch -q origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
      git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH" \
        || { echo "FAIL: $CI_COMMIT_TAG is not on $CI_DEFAULT_BRANCH"; exit 1; }
      echo "$CI_COMMIT_TAG is a commit of $CI_DEFAULT_BRANCH"


# ---------------------------------------------------------------------------
# ServeurAIX, over SSH
# ---------------------------------------------------------------------------

.aix:
  image: python:3.12-slim
  variables:
    ANSIBLE_STDOUT_CALLBACK: default
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client >/dev/null
    - pip install --quiet --no-cache-dir ansible-core
    # From requirements.yml, not a hand-picked list: forge_preflight checks the
    # collections it declares, and a subset fails that check. That file holds
    # the traditional plane only - no Kubernetes collection is installed here.
    - ansible-galaxy collection install --force -r collections/requirements.yml >/dev/null
    # The key and the known host, from CI variables, never from the repository.
    - |
      set -e
      install -d -m 700 ~/.ssh
      install -m 600 "$AIX_SSH_PRIVATE_KEY" ~/.ssh/id_aix
      export ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/id_aix
      echo "export ANSIBLE_PRIVATE_KEY_FILE=$HOME/.ssh/id_aix" >> ~/.aix-env
      if [ -n "${AIX_SSH_KNOWN_HOSTS:-}" ]; then
        if [ -f "$AIX_SSH_KNOWN_HOSTS" ]; then cat "$AIX_SSH_KNOWN_HOSTS"
        else printf '%s\n' "$AIX_SSH_KNOWN_HOSTS"; fi > ~/.ssh/known_hosts
      else
        echo "WARNING: AIX_SSH_KNOWN_HOSTS is not set - ServeurAIX's host key is taken on first use."
        ssh-keyscan -T 10 "$AIX_HOST" > ~/.ssh/known_hosts 2>/dev/null
      fi
      chmod 600 ~/.ssh/known_hosts
    # The WAS administrative credential, as a vars file in a private temporary
    # directory made by Python: a password on the command line is readable by
    # every process on the runner. Read from the environment, written 0600.
    - |
      set -e
      VARS_DIR="$(python3 -c 'import tempfile; print(tempfile.mkdtemp(prefix="aix-"))')"
      python3 - "$VARS_DIR/admin.json" <<'PY'
      import json, os, sys
      fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
      with os.fdopen(fd, "w") as f:
          json.dump({"was_admin_user": os.environ.get("WAS_ADMIN_USER", ""),
                     "was_admin_password": os.environ.get("WAS_ADMIN_PASSWORD", "")}, f)
      PY
      echo "export ADMIN_VARS=$VARS_DIR/admin.json" >> ~/.aix-env
    - . ~/.aix-env
    - test -n "${WAS_ENVIRONMENT:-}" || { echo "WAS_ENVIRONMENT is not set - which environment is ServeurAIX built as?"; exit 1; }
    - ansible -i $AIX_INVENTORY was_install -m ansible.builtin.ping
  after_script:
    - rm -f ~/.ssh/id_aix ~/.aix-env
  rules:
    - if: $AIX_SSH_PRIVATE_KEY == null
      when: never
    - when: on_success

# Every job that changes ServeurAIX: the default branch only, one at a time.
.aix-change:
  extends: .aix
  resource_group: serveur-aix
  rules:
    - if: $AIX_SSH_PRIVATE_KEY == null
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - when: on_success

# --- validation --------------------------------------------------------------

# The share that holds the IBM binaries, mounted - PRIMORDIAL: nothing on the
# server can be installed or patched without it. It changes the server (a
# mount, the /etc/filesystems stanza), so it is an .aix-change job: the default
# branch only. A replay changes nothing; the run must say so, or the mount is
# being redone each time, which means it does not survive. See
# roles/binaries_share.
aix:share:
  extends: .aix-change
  stage: validation
  script:
    - ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/binaries_mount.yml | tee share.log
    - ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/binaries_mount.yml > share-replay.log
    - cat share-replay.log
    - bash ci/assert-idempotent.sh share-replay.log
  artifacts:
    when: always
    paths: [share.log, share-replay.log]
    expire_in: 1 week

# The mount point that holds the IBM binaries, before anything reads it.
# Read-only. See roles/forge_preflight/tasks/binaries_mount.yml. After
# aix:share where that job runs (the default branch); on another branch it
# checks the share as it is.
aix:mount:
  extends: .aix
  stage: validation
  needs:
    - job: "aix:share"
      optional: true
  script:
    - ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/binaries_mount_check.yml | tee mount.log
  artifacts:
    when: always
    paths: [mount.log]
    expire_in: 1 week

# The forge preflight on the server: filesets (lslpp), the AIX Toolbox
# commands on the default PATH, free space, the mount again. The directory
# layout is not checked yet: the build creates it.
aix:preflight:
  extends: .aix
  stage: validation
  needs: [aix:mount]
  script:
    - >-
      ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/forge_preflight.yml
      -e forge_preflight_hosts=was_install -e was_environment="$WAS_ENVIRONMENT"
      -e forge_preflight_check_dirs=false

# --- build -------------------------------------------------------------------

# The product, from the mount: Installation Manager, its fix pack pass, WAS,
# IHS and the plugin, the second fix pack pass - the order the AWX workflow
# runs them in. Then the six again, which must change nothing.
aix:install:
  extends: .aix-change
  stage: build
  timeout: 3h
  script:
    - |
      set -e
      for pb in lab_install_im lab_apply_fixpacks lab_install_was lab_install_ihs lab_install_plugin lab_apply_fixpacks; do
        echo "=============== $pb ==============="
        ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/$pb.yml \
          -e lab_hosts=was_install -e was_environment="$WAS_ENVIRONMENT" | tee -a install.log
      done
    - |
      set -e
      echo "=============== replay: must change nothing ==============="
      : > install-replay.log
      for pb in lab_install_im lab_apply_fixpacks lab_install_was lab_install_ihs lab_install_plugin lab_apply_fixpacks; do
        ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/$pb.yml \
          -e lab_hosts=was_install -e was_environment="$WAS_ENVIRONMENT" > "replay-$pb.log"
        cat "replay-$pb.log" >> install-replay.log
        bash ci/assert-idempotent.sh "replay-$pb.log"
      done
    - |
      set -e
      echo "=============== the full preflight, now that the layout exists ==============="
      ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/forge_preflight.yml \
        -e forge_preflight_hosts=was_install -e was_environment="$WAS_ENVIRONMENT"
  artifacts:
    when: always
    paths: [install.log, install-replay.log]
    expire_in: 1 month

# --- deploy ------------------------------------------------------------------

# The cell on ServeurAIX: a deployment manager and a federated node, the
# cluster, its members, started. A check run first - what AWX offers as
# "Job type: Check" - then the run, then the replay.
aix:cell:
  extends: .aix-change
  stage: deploy
  needs: [aix:install]
  timeout: 2h
  rules:
    - if: $AIX_SSH_PRIVATE_KEY == null
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - when: manual
  script:
    - |
      echo "=============== profiles: check run ==============="
      ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/lab_create_profiles.yml \
        -e profile_hosts=was_install -e was_topology=nd -e was_environment="$WAS_ENVIRONMENT" \
        -e @"$ADMIN_VARS" --check --diff | tee profiles-check.log
    - |
      set -e
      run() {
        ansible-playbook -i $AIX_INVENTORY $COLLECTION/playbooks/$1.yml \
          -e profile_hosts=was_install -e config_dmgr_hosts=dmgr -e was_topology=nd \
          -e was_environment="$WAS_ENVIRONMENT" -e @"$ADMIN_VARS"
      }
      for pb in lab_create_profiles traditional_cluster traditional_cluster_members traditional_start; do
        echo "=============== $pb ==============="
        run "$pb" | tee -a cell.log
      done
      echo "=============== replay: must change nothing ==============="
      : > cell-replay.log
      for pb in lab_create_profiles traditional_cluster traditional_cluster_members traditional_start; do
        run "$pb" > "replay-$pb.log"
        cat "replay-$pb.log" >> cell-replay.log
        bash ci/assert-idempotent.sh "replay-$pb.log"
      done
    - |
      # The administrative password must never reach a log, masked or not.
      if [ -n "${WAS_ADMIN_PASSWORD:-}" ] && grep -qF -- "$WAS_ADMIN_PASSWORD" profiles-check.log cell.log cell-replay.log; then
        echo "the administrative password reached a log"; exit 1
      fi
      echo "the administrative password is in no log"
  artifacts:
    when: always
    paths: [profiles-check.log, cell.log, cell-replay.log]
    expire_in: 1 month
