---
# Three things this pipeline proves, in order of how much they cost to get wrong:
#
#   1. The model refuses invalid product / JDK pairs, refuses production without
#      being asked, and refuses an artefact with no version. Static, no cluster.
#   2. The whole traditional chain - module, payload, wsadmin launch, driver,
#      handler, JSON, changed/diff - works, against a fake cell. No cluster.
#   3. The same chain works against real hosts, over a real connection, with
#      real idempotency: run twice, the second run must report changed=0.
#      This one needs k3s.
#
# The simulation uses Rocky Linux 9 because it is the closest freely
# redistributable match to the RHEL the estate runs on: same package manager,
# same systemd, same /etc/security/limits.d semantics.
#
# Two namespaces, was-sim-dmgr and was-sim-nodeagents, because the deployment
# manager and the node agents are different trust zones. A NetworkPolicy makes
# that boundary testable instead of implied.

stages:
  - lint
  - validate
  - simulate
  - teardown

variables:
  ANSIBLE_FORCE_COLOR: "1"
  COLLECTION: ansible_collections/wasevo/websphere
  # GitLab checks out into a world-writable directory, so Ansible refuses to
  # read ansible.cfg from it - every setting in that file is silently ignored
  # here. The two that matter are therefore passed as environment variables.
  # The repository root is the collections path because it is the directory
  # that CONTAINS ansible_collections/, which is what Ansible looks for.
  ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR"
  ANSIBLE_ROLES_PATH: "$CI_PROJECT_DIR/ansible_collections/wasevo/websphere/roles"
  NS_DMGR: was-sim-dmgr
  NS_NODES: was-sim-nodeagents

# ---------------------------------------------------------------------------
# Static checks. No cluster, no credentials.
# ---------------------------------------------------------------------------

.static:
  image: python:3.12-slim
  before_script:
    - pip install --quiet --no-cache-dir ansible-core ansible-lint yamllint

yamllint:
  extends: .static
  stage: lint
  script:
    - yamllint -s .

ansible-lint:
  extends: .static
  stage: lint
  script:
    - ansible-lint $COLLECTION
  # Advisory while the later-wave roles are still stubs.
  allow_failure: true

syntax:
  extends: .static
  stage: lint
  # THE ENVIRONMENT HAS TO BE PASSED, EVEN HERE. Most of these playbooks take
  # their host pattern from was_environment, because the environment is a
  # launch input rather than a directory. Ansible renders `hosts` before it
  # parses anything else, so a syntax check without that variable fails on
  # "'was_environment' is undefined" - a message about the playbook being
  # unparsable, which it is not. The value is arbitrary here: --syntax-check
  # matches no host and contacts nothing, it only has to render.
  #
  # This job was red for exactly that reason, and a red lint stage skips every
  # job after it - which is why the stub and simulation gates had not run.
  script:
    - ansible-playbook --syntax-check $COLLECTION/playbooks/pilot_render_matrix.yml
    - ansible-playbook --syntax-check $COLLECTION/playbooks/model_validate.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/forge_preflight.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_config.yml -e was_environment=SYNTAX
    # Each step of the traditional plane is its own playbook so it can be
    # replayed on its own, so each one is syntax-checked on its own too.
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_cluster.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_cluster_members.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_j2c.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_jdbc.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_shared_libraries.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/traditional_sibus.yml -e was_environment=SYNTAX
    - ansible-playbook -i inventories/was --syntax-check $COLLECTION/playbooks/guard_target.yml -e was_environment=SYNTAX

# The environment is a launch input, so the loop passes it as one - exactly as
# the AWX survey does. There is no list of environment codes to iterate: what
# is tested is the MECHANISM, on the environment group the template inventory
# declares.
#
# Production is tested through was_environment_tier, not through a code,
# because no code is production in this collection's eyes - the tier is
# declared alongside the environment.
model-matrix:
  extends: .static
  stage: validate
  script:
    - |
      set -e
      echo "=============== the declared environment validates ==============="
      ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml         -e was_environment=ENVCODE
    - |
      echo "=============== a prod tier must be refused unacknowledged ==============="
      if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
           -e was_environment=ENVCODE -e was_environment_tier=prod; then
        echo "FAIL: production was accepted without acknowledgement"; exit 1
      fi
      echo "refused as expected"
    - |
      set -e
      echo "=============== and passes once acknowledged ==============="
      ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml \
        -e was_environment=ENVCODE -e was_environment_tier=prod \
        -e model_allow_production=true
    - |
      echo "=============== an unusable code must be refused ==============="
      # Not "unknown" - any code a site uses is accepted. This one is refused
      # for its shape: a value that cannot be a WAS object name or a path.
      if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml            -e "was_environment=no pe"; then
        echo "FAIL: an unusable environment code was accepted"; exit 1
      fi
      echo "refused as expected"
    - |
      echo "=============== an environment with no hosts must be refused ==============="
      if ansible-playbook -i inventories/was $COLLECTION/playbooks/model_validate.yml            -e was_environment=NOSUCH; then
        echo "FAIL: an environment with no hosts was accepted"; exit 1
      fi
      echo "refused as expected"
    - |
      echo "=============== the diagnostic JDK must be refused ==============="
      # The environment and the channel are passed so that this refusal is the
      # one being asserted. Without them the play fails on "no environment was
      # supplied" and the check passed for the wrong reason - a test that can
      # only succeed is not a test. Hence the grep as well as the exit code.
      if ansible-playbook $COLLECTION/playbooks/pilot_render_matrix.yml \
           -e was_environment=PILOT -e was_channel=Extranet \
           -e '{"pilot_targets": [{"file": "example_diagnostic_only.yml", "label": "the diagnostic JDK"}]}' \
           > diagnostic.log 2>&1; then
        echo "FAIL: the diagnostic JDK was accepted"; exit 1
      fi
      grep -qi "diagnostic" diagnostic.log \
        || { echo "FAIL: it was refused, but not for the diagnostic JDK:"; tail -20 diagnostic.log; exit 1; }
      echo "refused as expected, and for the right reason"

# One datasource, declared once, rendered for all three phases.
# One declared datasource, rendered into all three trajectory couples. If the
# three renders disagree, layer 1 is wrong - which is the point of doing this
# on one object in wave 0 rather than discovering it thirty modules later.
#
# The environment AND the channel are passed here. The play needs no inventory
# - it runs on localhost - but it resolves the model, and the model refuses to
# run without the two inputs that name every object it renders. Both are
# arbitrary here: what is being compared is the three renders of one object,
# not the names.
#
# They have to be passed explicitly because GitLab checks out into a
# world-writable directory, so Ansible refuses to read ansible.cfg - and
# ansible.cfg is what points at inventories/was, whose group_vars would
# otherwise supply the channel. Everything that file configures has to be an
# argument here.
pilot-render:
  extends: .static
  stage: validate
  script:
    - ansible-playbook $COLLECTION/playbooks/pilot_render_matrix.yml -e was_environment=PILOT -e was_channel=Extranet
  artifacts:
    paths: [rendered/]
    expire_in: 1 week

# The driver, the handler and the fake cell, with no cluster and no Ansible.
# Fast, and it catches most regressions before anything is deployed.
stub-unit:
  image: python:3.12-slim
  stage: validate
  # PyYAML and nothing else: the check that renders the shared model for WAS
  # traditional reads model/example/common.yml, and the driver, the handlers
  # and the fake cell need only the standard library. Still no Ansible here -
  # this gate stays the cheapest one.
  before_script:
    - pip install --quiet --no-cache-dir pyyaml
  script:
    - bash ci/run-stub-tests.sh

# ---------------------------------------------------------------------------
# Simulation on k3s
# ---------------------------------------------------------------------------

.k3s:
  image: python:3.12-slim
  variables:
    # The password of the simulation's J2C alias. A marker, not a secret: the
    # point is the PATH - inventories/k3s_sim/group_vars/all/60_resources.yml
    # declares password_env: SIM_J2C_PASSWORD, and the role reads it from the
    # controller's environment exactly as it reads one an AWX credential
    # injected. Nothing about a real password is exercised by its value.
    SIM_J2C_PASSWORD: "sim-marker-not-a-secret"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
    - pip install --quiet --no-cache-dir ansible-core kubernetes
    # From requirements.yml, not a hand-picked list. forge_preflight checks the
    # collections it declares, and a job that installs a subset of them fails
    # that check - which is the preflight working, not a false positive.
    - ansible-galaxy collection install --force -r collections/requirements.yml >/dev/null
    - curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
    # Built from CI variables, never from a kubeconfig in the repository. The
    # ServiceAccount behind KUBE_TOKEN is scoped to the two simulation
    # namespaces by namespaced Roles, so a leaked token reaches nothing else.
    - |
      set -e
      echo "$KUBE_CA_B64" | base64 -d > /tmp/k3s-ca.crt
      kubectl config set-cluster k3s --server="$KUBE_URL" \
        --certificate-authority=/tmp/k3s-ca.crt --embed-certs=true
      kubectl config set-credentials ci --token="$KUBE_TOKEN"
      kubectl config set-context k3s --cluster=k3s --user=ci --namespace="$NS_DMGR"
      kubectl config use-context k3s
  rules:
    # Skipped rather than failed when the cluster credentials are absent, so a
    # fork or a clone without them still gets the static gates.
    - if: $KUBE_TOKEN == null
      when: never
    - when: on_success

sim:deploy:
  extends: .k3s
  stage: simulate
  script:
    - |
      set -e
      echo "--- clearing pods left by an earlier run ---"
      kubectl -n $NS_DMGR  delete pod -l was-evolution/sim=true --ignore-not-found --wait=true
      kubectl -n $NS_NODES delete pod -l was-evolution/sim=true --ignore-not-found --wait=true
    - kubectl apply -f ci/k3s/10-sim-hosts.yml
    - kubectl -n $NS_DMGR  wait --for=condition=Ready pod/was-dmgr-01 --timeout=180s
    - kubectl -n $NS_NODES wait --for=condition=Ready pod/was-node-01 --timeout=180s
    - kubectl -n $NS_NODES wait --for=condition=Ready pod/was-node-02 --timeout=180s
    - kubectl get pods -n $NS_DMGR -o wide
    - kubectl get pods -n $NS_NODES -o wide

sim:preflight:
  extends: .k3s
  stage: simulate
  needs: [sim:deploy]
  script:
    # Target-side checks against Rocky 9. Packages are reported, not enforced:
    # the pod starts from a stock image and prereqs_os is what installs them.
    - ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/forge_preflight.yml

# THE ENVIRONMENT IS PASSED AS AN EXTRA VAR, EVEN THOUGH THE INVENTORY
# DECLARES IT. A play's `hosts:` is rendered before any host is in scope, so it
# cannot see inventory variables - group_vars/all/10_environment.yml included -
# and these playbooks take their host pattern from was_environment because the
# environment is a launch input. In AWX the survey answer is an extra var; here
# -e is the same thing. Without it the run dies on "Mandatory variable
# 'was_environment' not defined", which is a message about the pattern and
# reads like a missing inventory.
sim:configure:
  extends: .k3s
  stage: simulate
  needs: [sim:preflight]
  script:
    # The jars of the simulation's pattern library. A real estate puts them
    # there when it deploys its application binaries; the shared library role
    # only reads the directory, on the deployment manager, so they have to be
    # in place before it runs. Empty files: the fake cell never opens a jar.
    - |
      set -e
      echo "=============== stage the jars the pattern library matches ==============="
      kubectl -n $NS_DMGR exec was-dmgr-01 -- sh -c \
        'mkdir -p /app/sim-shared && : > /app/sim-shared/commons-a.jar && : > /app/sim-shared/commons-b.jar \
         && : > /app/sim-shared/README.txt && ls -1 /app/sim-shared'
    - |
      echo "=============== dry run first ==============="
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/traditional_config.yml \
        -e was_environment=SIM -e was_admin_user=ci -e was_admin_password=check-only \
        --check --diff
    - |
      echo "=============== apply ==============="
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/traditional_config.yml \
        -e was_environment=SIM -e was_admin_user=ci -e was_admin_password=check-only | tee run1.log
    - |
      echo "=============== replay: must change nothing ==============="
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/traditional_config.yml \
        -e was_environment=SIM -e was_admin_user=ci -e was_admin_password=check-only | tee run2.log
      set -e
      # The second run is the only real proof of idempotency. The legacy
      # approach could not make this claim: its marker files reported "nothing
      # to do" whether or not the cell still matched.
      bad=$(grep -E "^was-(dmgr|node)-[0-9]+ +:" run2.log | grep -v "changed=0" || true)
      if [ -n "$bad" ]; then
        echo "IDEMPOTENCY FAILURE - the second run changed something:"
        echo "$bad"
        exit 1
      fi
      echo "second run reported changed=0 on every host"
    - |
      set -e
      echo "=============== the pattern library holds exactly what *.jar matched ==============="
      # Two jars and a README were staged. Two jars, not three files: the
      # pattern is honoured, not the directory taken whole.
      grep -q "simCommonLibrary (2 jar(s))" run1.log \
        || { echo "simCommonLibrary did not resolve to exactly the 2 staged jars"; exit 1; }
      grep -q "simReportingLibrary (2 jar(s))" run1.log \
        || { echo "simReportingLibrary did not keep its 2 explicit jars"; exit 1; }
      echo "the pattern matched the 2 jars and left the README; the explicit list was taken as written"
  artifacts:
    when: always
    paths: [run1.log, run2.log]
    expire_in: 1 week

# The profile roles, simulated the way AWX simulates: a check run.
#
# "Simulate the installation" means --check, which AWX offers as
# "Job type: Check" in the launch dialog. There is no dry-run flag of our own -
# a second code path is a second thing to keep true, and it would be the one
# nobody launches. Under --check the command tasks do not run, the hard refusals
# stand down, and each profile role prints what it WOULD hand to manageprofiles,
# rendered on the controller with lookup('template') so nothing is written
# anywhere.
#
# Both topologies are exercised, because the one that is not exercised is the
# one that breaks: nd renders a management template on the deployment manager
# and a managed template on each node, standalone renders a default template
# and refuses to build a cluster.
sim:profiles:
  extends: .k3s
  stage: simulate
  needs: [sim:preflight]
  script:
    - |
      echo "=============== nd: check run ==============="
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/lab_create_profiles.yml \
        -e was_topology=nd \
        -e was_admin_user=ci -e was_admin_password=check-only \
        --check --diff | tee nd.log
    - |
      set -e
      echo "=============== nd: what would be sent must be ND ==============="
      # Asserted on the rendered response file, because that file is the
      # contract between this collection and manageprofiles. A check run writes
      # nothing, so the log is where it appears.
      for want in "profileTemplates/management" "serverType=DEPLOYMENT_MANAGER" "cellName=" "nodeName="; do
        grep -q "$want" nd.log || { echo "the deployment manager response file lacks $want"; exit 1; }
      done
      for want in "profileTemplates/managed" "federateLater=false" "dmgrHost=" "dmgrPort="; do
        grep -q "$want" nd.log || { echo "the node response file lacks $want"; exit 1; }
      done
      # A standalone template on a node would be an unfederated server that
      # looks healthy and is in no cell.
      grep -q "profileTemplates/default" nd.log && { echo "an ND run rendered a standalone template"; exit 1; }
      # The administrative password must never reach a log, masked or not.
      grep -q "check-only" nd.log && { echo "the administrative password reached the log"; exit 1; }
      grep -q "adminPassword=<masked>" nd.log || { echo "the password was not masked in the display"; exit 1; }
      echo "both ND response files carry what manageprofiles needs, password masked"
    - |
      echo "=============== standalone: check run ==============="
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/lab_create_profiles.yml \
        -e was_topology=standalone \
        -e was_admin_user=ci -e was_admin_password=check-only \
        --check --diff | tee standalone.log
    - |
      set -e
      echo "=============== standalone: no cluster, no federation ==============="
      grep -q "no cluster" standalone.log || { echo "the standalone topology did not report that it cannot cluster"; exit 1; }
      grep -q "there is no deployment manager to create" standalone.log \
        || { echo "profile_dmgr did not stand down on a standalone run"; exit 1; }
      grep -q "there is no cell to join" standalone.log || { echo "profile_nodeagent did not stand down on a standalone run"; exit 1; }
      grep -q "profileTemplates/default" standalone.log || { echo "the standalone run did not render the default template"; exit 1; }
      echo "standalone built one cell and refused the ND machinery"
    - |
      echo "=============== an unknown topology must be refused ==============="
      set +e
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/lab_create_profiles.yml \
        -e was_topology=whatever --check > refused.log 2>&1
      rc=$?
      set -e
      [ "$rc" -ne 0 ] || { echo "a topology of 'whatever' was accepted"; exit 1; }
      grep -q "accepted values are" refused.log || { echo "the refusal did not say what is accepted"; exit 1; }
      echo "refused, and the message names the two values"
    - |
      echo "=============== nothing was deployed ==============="
      set -e
      # The point of a check run: no profile and no response file left behind
      # on any simulated host.
      #
      # WHY THIS IS NOT "/app/profiles IS EMPTY" ANY MORE. The wsadmin
      # stand-in has to live where the modules look for wsadmin, which is
      # <profile path>/bin/wsadmin.sh, so staging it creates a directory under
      # /app/profiles. That directory is not a profile: it holds three stub
      # files and nothing else.
      #
      # So what is asserted is the absence of what manageprofiles ACTUALLY
      # creates, which is also what the profile roles verify afterwards -
      # startNode.sh, startServer.sh, portdef.props, a config tree. A check run
      # that produced any of those would mean manageprofiles had been called.
      #
      # /app/data/profiles is still required to be empty: that is the response
      # file directory, and a rendered response file carries the administrative
      # password.
      for ns_pod in was-sim-dmgr/was-dmgr-01 was-sim-nodeagents/was-node-01 was-sim-nodeagents/was-node-02; do
        ns="${ns_pod%%/*}"; pod="${ns_pod##*/}"
        real=$(kubectl -n "$ns" exec "$pod" -- sh -c \
          'ls -1 /app/profiles/*/bin/startNode.sh /app/profiles/*/bin/startServer.sh \
                 /app/profiles/*/properties/portdef.props /app/profiles/*/config 2>/dev/null' || true)
        [ -z "$real" ] || { echo "$pod carries a real profile after a check run: $real"; exit 1; }
        responses=$(kubectl -n "$ns" exec "$pod" -- sh -c 'ls -A /app/data/profiles 2>/dev/null' || true)
        [ -z "$responses" ] || { echo "$pod left something in the response directory: $responses"; exit 1; }
        stub=$(kubectl -n "$ns" exec "$pod" -- sh -c 'ls -A /app/profiles/*/bin 2>/dev/null' || true)
        echo "  $pod: no profile, no response file. Under /app/profiles: ${stub:-nothing}"
      done
      echo "no profile and no response file on any simulated host"
  artifacts:
    when: always
    paths: [nd.log, standalone.log, refused.log]
    expire_in: 1 week

# The cluster members, which are the application servers.
#
# sim:configure already builds one member per node through traditional_config.yml,
# which is a HORIZONTAL cluster. This job is the vertical axis and the replay:
# two members per node over two nodes is four JVMs, which is the shape that
# catches everything specific about members - the -firstMember rule that must
# fire exactly once per cluster, and the generated ports that must differ for
# two JVMs on one node.
#
# It also runs the playbook ON ITS OWN rather than through traditional_config.yml,
# because being separately launchable is the point of splitting it out: one
# wsadmin session to fix the members after a change, not the whole chain.
sim:members:
  extends: .k3s
  stage: simulate
  needs: [sim:configure]
  script:
    - |
      echo "=============== vertical x horizontal: dry run ==============="
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/traditional_cluster_members.yml \
        -e was_environment=SIM -e was_admin_user=ci -e was_admin_password=check-only \
        -e was_cluster_members_per_node=2 --check --diff | tee members-check.log
    - |
      echo "=============== apply ==============="
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/traditional_cluster_members.yml \
        -e was_environment=SIM -e was_admin_user=ci -e was_admin_password=check-only -e was_cluster_members_per_node=2 | tee members1.log
    - |
      echo "=============== replay: must change nothing ==============="
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/traditional_cluster_members.yml \
        -e was_environment=SIM -e was_admin_user=ci -e was_admin_password=check-only -e was_cluster_members_per_node=2 | tee members2.log
      set -e
      bad=$(grep -E "^was-(dmgr|node)-[0-9]+ +:" members2.log | grep -v "changed=0" || true)
      if [ -n "$bad" ]; then
        echo "IDEMPOTENCY FAILURE - the second run changed something:"
        echo "$bad"
        exit 1
      fi
      echo "second run reported changed=0 on every host"
    - |
      set -e
      echo "=============== the shape must be what was asked for ==============="
      # Four members over two nodes, and the role saying so in those words:
      # the count alone would pass with four members on one node, which is a
      # different cluster.
      grep -q "4 member(s) over 2 node(s)" members1.log \
        || { echo "the run did not build 4 members over 2 nodes"; exit 1; }
      grep -q "vertical and horizontal" members1.log \
        || { echo "the role did not recognise the shape it built"; exit 1; }
      echo "4 JVMs, 2 per node, on 2 nodes"
    - |
      set -e
      echo "=============== two JVMs on one node cannot share a port ==============="
      # Asserted in the fake cell, which is where the serverindex lives. The
      # generated ports of the two members of a node must differ; if they did
      # not, the second server would fail to start hours later with an
      # address-already-in-use error.
      kubectl -n $NS_DMGR exec was-dmgr-01 -- cat /opt/exploit/was-sim-state.json \
        | python3 ci/assert-member-ports.py
    - |
      set -e
      echo "=============== a count above the bound must be refused ==============="
      set +e
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/traditional_cluster_members.yml \
        -e was_environment=SIM -e was_admin_user=ci -e was_admin_password=check-only \
        -e was_cluster_members_per_node=99 --check > refused-count.log 2>&1
      rc=$?
      set -e
      [ "$rc" -ne 0 ] || { echo "99 members per node was accepted"; exit 1; }
      grep -q "upper bound" refused-count.log \
        || { echo "the refusal did not say there is a bound"; exit 1; }
      echo "refused, and the message says why there is a bound"
    - |
      set -e
      echo "=============== one imposed name cannot name several JVMs ==============="
      # The ambiguity that must not be guessed at: a name somebody chose by
      # hand, and a count that needs more than one name. Appending an index to
      # it would invent a convention they did not ask for.
      set +e
      ansible-playbook -i inventories/k3s_sim $COLLECTION/playbooks/traditional_cluster_members.yml \
        -e was_environment=SIM -e was_admin_user=ci -e was_admin_password=check-only \
        -e was_cluster_members_per_node=2 -e was_cluster_member_name=OneServerOnly \
        --check > refused-name.log 2>&1
      rc=$?
      set -e
      [ "$rc" -ne 0 ] || { echo "one name was accepted for two members"; exit 1; }
      grep -q "cannot name" refused-name.log \
        || { echo "the refusal did not name the conflict"; exit 1; }
      grep -q "was_cluster_member_names" refused-name.log \
        || { echo "the refusal did not say how to declare several names"; exit 1; }
      echo "refused, and the message gives both ways out"
  artifacts:
    when: always
    paths:
      - members-check.log
      - members1.log
      - members2.log
      - refused-count.log
      - refused-name.log
    expire_in: 1 week

sim:isolation:
  extends: .k3s
  stage: simulate
  needs: [sim:configure]
  script:
    # The two namespaces exist to separate trust zones, so the separation is
    # asserted rather than described.
    - |
      set -e
      echo "--- the simulation identity must NOT reach other namespaces ---"
      for ns in kube-system ci default; do
        if kubectl auth can-i create pods/exec -n $ns 2>/dev/null | grep -q "^yes"; then
          echo "FAIL: the CI identity can exec into $ns"; exit 1
        fi
        echo "ok: no exec in $ns"
      done
    # The boundary is asserted by TRAFFIC, not by reading the policy objects.
    # An existing NetworkPolicy proves a YAML object exists, not that anything
    # is blocked - and reading it needed a right an administrator had to grant
    # by hand. Sending connections across the boundary needs only pods/exec,
    # which this identity already holds, and proves the thing that matters.
    - |
      set -e
      echo "--- the boundary must hold, checked by connections ---"
      bash ci/assert-network-boundary.sh

sim:teardown:
  extends: .k3s
  stage: teardown
  needs: [sim:configure, sim:members, sim:isolation]
  when: always
  script:
    # Pods only. The namespaces, the ServiceAccount and the NetworkPolicies are
    # infrastructure applied once by an administrator; a pipeline that deletes
    # them makes itself unrunnable.
    - kubectl -n $NS_DMGR  delete pod -l was-evolution/sim=true --ignore-not-found
    - kubectl -n $NS_NODES delete pod -l was-evolution/sim=true --ignore-not-found
    - echo "simulation pods removed, namespaces left in place"
